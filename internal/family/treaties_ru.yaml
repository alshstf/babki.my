# Соглашения России об избежании двойного налогообложения (решение Р-50 А): когда
# каждое применяется, когда Указ № 585 приостановил его статьи о доходах и ставках
# (статью об устранении двойного налогообложения он не трогал), когда партнёр
# приостановил его полностью и когда оно прекращено. Первоисточник — Минфин,
# «Информация о статусе международных договоров об избежании двойного
# налогообложения … по состоянию на 14.07.2026» (minfin.gov.ru, «Международные
# налоговые отношения»). Налог, уплаченный за рубежом, засчитывается в порядке
# договора (ст. 232 НК): без применяемого соглашения — без зачёта.
# Абхазия (соглашение с 01.01.2025) не входит: у неё нет кода страны ISO.
