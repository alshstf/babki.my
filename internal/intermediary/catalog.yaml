# Банки и брокеры (решение Р-47 В). Банки сверены со справочником кредитных
# организаций Банка России (веб-сервис CreditOrgInfo, 2026-10-14): номер, название,
# статус «норм.». Банк, который принимает вклады граждан и работает, участвует в
# системе страхования вкладов обязательно; у части банков, вошедших в неё позже,
# в справочнике ЦБ нет даты вступления — это пробел данных, не исключение.
# Ликвидированные (Росбанк № 2272, Почта Банк № 650, Хоум Банк № 316 — влиты в
# другие банки) сюда не входят: счёт с таким названием выбирается руками.
