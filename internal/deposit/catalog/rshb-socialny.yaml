      Для получателей социальной поддержки, один такой вклад во всех банках. Переменная ставка — наибольшая ставка банка по вкладам (13,8 % в день сверки), меняется со дня новой ставки банка — программа берёт ставку из редакции каждого дня. 365 дней, до 50 000 ₽, проценты ежемесячно в последний день месяца.
