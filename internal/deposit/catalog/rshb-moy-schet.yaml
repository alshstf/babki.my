id: rshb-moy-schet
bank: rshb
name: Накопительный счёт «Мой счёт»
kind: savings
watch:
  - https://www.rshb.ru/natural/deposits/my-account
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://www.rshb.ru/natural/deposits/my-account
      - https://www.rshb.ru/wcms-resources/vklad_calculator_moy-schet.json
    notes: >-
      Дата редакции у банка не указана — ставки калькулятора страницы в день сверки. Проценты — на фактический
      остаток, капитализация ежемесячно. Новому клиенту — 14 % первые три месяца на сумму до 1,5 млн ₽. Надбавка за
      покупки по карте банка в месяце (от 10 000 ₽ +5,5, от 30 000 ₽ +6,5, от 90 000 ₽ +7) — на остаток до 1,5 млн ₽,
      причисляется в последний день месяца. Остаток до 100 ₽ — 0,01 %.
    variants:
      - id: daily
        name: «Мой счёт»
        accrual: daily
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "6" }
        schedule:
          - { name: Приветственная, months: 3, grid: [{ percent: "14" }], cap: 150000000, requires: new_client }
        bonuses:
          - id: spend
            name: Покупки по карте Россельхозбанка за месяц
            check: card_spend
            cap: 150000000
            levels:
              - { from: 1000000, plus: "5.5" }
              - { from: 3000000, plus: "6.5" }
              - { from: 9000000, plus: "7" }
