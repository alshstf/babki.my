editions:
  - from: 2026-10-17
    checked_on: 2026-10-17
    sources:
      - https://www.tkbbank.ru/documents/premium/
    notes: >-
      Для клиентов Privilege, от 2,5 млн ₽ (ступени — от 15, 30 и 100 млн ₽); дата редакции в документе не указана
      — действует не позже дня сверки. Проценты ежемесячно на счёт. «Привилегия» — без пополнения и снятия;
      «Привилегия (Управляемый)» — пополнение и снятие до неснижаемого остатка 2,5 млн ₽. При продлении держателям
      карт Мир Supreme — надбавка 0,10–0,15 п. п. Досрочно — 0,01 %.
