id: novikom-kapital
bank: novikom
name: Вклад «Капитал»
kind: deposit
watch:
  - https://novikom.ru/deposit/
editions:
  - from: 2026-10-07
    checked_on: 2026-10-16
    sources:
      - https://novikom.ru/deposit/
      - https://novikom.ru/documents/minimalnye-garantirovannye-stavki-po-vkladam-06102026.pdf
    notes: >-
      Ставки страницы вклада и минимальные гарантированные ставки с 07.10.2026. Ступень — по первоначальному взносу:
      в рублях от 10 000 ₽ и от 1 млн ₽, в юанях от 10 000 и от 100 000 ¥. Без пополнения и снятия, проценты
      присоединяются в день окончания срока. Линейки «Капитал Социальный» (для получателей соцвыплат),
      «Капитал зарплатный онлайн» (для зарплатных клиентов) и премиальные — отдельными вариантами; у них здесь —
      ставки минимального взноса (у бо́льших сумм банк может давать выше).
