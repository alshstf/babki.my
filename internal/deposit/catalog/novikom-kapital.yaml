id: novikom-kapital
bank: novikom
name: Вклад «Капитал»
kind: deposit
watch:
  - https://novikom.ru/deposit/
editions:
  - from: 2026-10-07
    checked_on: 2026-10-16
    sources:
      - https://novikom.ru/deposit/
      - https://novikom.ru/documents/minimalnye-garantirovannye-stavki-po-vkladam-06102026.pdf
      - https://novikom.ru/documents/pasport-vklada-premium-kapital-12082026.pdf
    notes: >-
      Ставки страницы вклада и минимальные гарантированные ставки с 07.10.2026. Ступень — по первоначальному взносу:
      в рублях от 10 000 ₽ и от 1 млн ₽, в юанях от 10 000 и от 100 000 ¥. Без пополнения и снятия, проценты
      присоединяются в день окончания срока. Линейки «Капитал Социальный» (для получателей соцвыплат),
      «Капитал зарплатный онлайн» (для зарплатных клиентов) и премиальные — отдельными вариантами; у них здесь —
      ставки минимального взноса (у бо́льших сумм банк может давать выше). Ступени больших сумм есть только в
      «Сборнике условий» от 12.08.2026, а часть его клеток с 07.10 изменилась (181 день у зарплатного — 12,9 там и
      12,6 с 07.10), поэтому их нет. «Premium Капитал» — от 3,5 млн ₽, 1 млн ¥ или 100 000 $ (паспорт вклада).
      «Капитал премиум онлайн» — таблица страницы вклада, кроме 181 дня: на странице 13,3 % от 10 млн ₽, в
      минимальных ставках с 07.10 — 13,1 %, поэтому 181 день — 13,1 % на любую сумму от 10 млн ₽.
