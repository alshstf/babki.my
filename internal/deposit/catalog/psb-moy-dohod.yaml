    checked_on: 2026-10-16
    sources:
      - https://www.psbank.ru/qpstorage/psb/images/conditionsterms.pdf
    notes: >-
      Условия вкладов с 29.09.2026. От 50 000 ₽ (в банкомате — от 10 000 ₽, по своим ставкам), пополнение — первые 30
      дней, снятия нет, проценты в конце срока. В офисе ставки на 0,2 п. п. выше, чем в PSB-Retail. Досрочно до 90-го
      дня — «до востребования», позже — половина ставки. Продление не больше трёх раз — на условиях вклада «Моя
      выгода».
