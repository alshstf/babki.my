    notes: >-
      Условия вкладов с 29.09.2026. От 50 000 ₽, пополнение — до 30 дней до конца срока, снятия нет, проценты
      ежемесячно на вклад или на другой счёт. На сумму сверх 20 млн ₽ — 0,65 ставки (банк считает без
      капитализированных процентов). Досрочно — «до востребования». Продление не больше трёх раз.
