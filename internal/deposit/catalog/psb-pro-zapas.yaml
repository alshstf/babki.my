  - from: 2025-12-30
    checked_on: 2026-10-19
    sources:
      - https://www.psbank.ru/qpstorage/psb/images/personal/savingsaccount/full_terms_ns_30122025.pdf
    notes: >-
      Архив банка: условия накопительных счетов с 30.12.2025, действовали по 01.03.2026. Проценты — на минимальный остаток месяца. Новому клиенту (90 дней без накопительных счетов и вкладов в ПСБ) — 14 % первые два месяца на сумму до 5 млн ₽, один такой счёт; потом базовая 5 %.
    variants:
      - id: minimum
        name: «Про запас»
        audience: [all]
        accrual: minimum
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "5" }
        schedule:
          - { name: Для новых клиентов, days: 61, grid: [{ percent: "14" }], cap: 500000000, requires: new_client }
