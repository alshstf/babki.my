id: psb-pro-zapas
bank: psb
name: Накопительный счёт «Про запас»
kind: savings
watch:
  - https://www.psbank.ru/personal/savingsaccount
editions:
  - from: 2026-08-14
    checked_on: 2026-10-16
    sources:
      - https://www.psbank.ru/qpstorage/psb/images/personal/savingsaccount/full_terms_ns.pdf
    notes: >-
      Условия накопительных счетов с 14.08.2026. Проценты — на минимальный остаток месяца. Новому клиенту (180 дней без
      накопительных счетов с остатком больше 1 000 ₽ и без вкладов в ПСБ) — 13 % первые два месяца на сумму до 5 млн
      ₽, один такой счёт; потом базовая 5 %.
    variants:
      - id: minimum
        name: «Про запас»
        audience: [all]
        accrual: minimum
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "5" }
        schedule:
          - { name: Для новых клиентов, days: 61, grid: [{ percent: "13" }], cap: 500000000, requires: new_client }
