id: vtb-vklad
bank: vtb
name: ВТБ-Вклад без пополнения и снятия
kind: deposit
watch:
  - https://www.vtb.ru/personal/vklady-i-scheta/vtb-vklad-r/
  - https://www.vtb.ru/tarify/chastnim-licam/
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://www.vtb.ru/media-files/vtb.ru/sitepages/personal/vklady-i-scheta/vtb-vklad-r/vtb_vklad_bez_popolneniya_i_snyatiya.pdf
      - https://www.vtb.ru/media-files/vtb.ru/sitepages/tarify/chastnim-licam/t_vklady.xlsx
    notes: >-
      Ставки и надбавки — по «Тарифам по депозитам и накопительным счетам» ВТБ (Excel, с 16.10.2026). Ставка —
      сумма базовой и надбавок, действовавших каждый день срока: за зарплату или пенсию на карту ВТБ — пока они
      приходят, за подписку ВТБ Плюс — пока она есть, из этих трёх действует одна; за уровень «Расти с ВТБ» — в месяце
      после того, в котором он присвоен (для вкладов, открытых с 01.09.2026). Надбавки «Новый вкладчик» (180 дней без
      вкладов и накопительных в ВТБ) и «Новые деньги» (которых 90 дней не было на счетах ВТБ) фиксируются на весь срок;
      «новые деньги» действуют только на новую часть суммы — отметка здесь значит, что новые все деньги вклада. У
      «Мультикарты» и «Привилегии» базовые ставки одни, надбавки разные: у «Привилегии» за зарплату больше, за
      подписку — нет; её варианты — онлайн. В юанях — от 1 000 ¥ онлайн, до 0,9 %. Ежемесячная выплата на вклад и на
      счёт — по одним ставкам. Досрочно — 0,01 %, надбавки не выплачиваются. Автопродления нет. Вклады с
      пополнением — по своим таблицам, ручная ставка.
