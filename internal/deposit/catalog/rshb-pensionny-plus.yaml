    notes: >-
      Для пенсионеров (по пенсионному удостоверению или справке о пенсии). Дата редакции у банка не указана —
      ставки страницы в день сверки. Ступень — по неснижаемому остатку: от 500 ₽ и свыше 2 млн ₽. Пополнение, снятие
      до неснижаемого остатка, капитализация ежемесячно. Продление — по ставке дня продления, за прошлые сроки
      проценты сохраняются.
