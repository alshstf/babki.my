id: sber-nakopitelny-premium
bank: sber
name: Накопительный счёт Премиум
kind: savings
watch:
  - https://www.sberbank.ru/ru/person/premium/premium_ns
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://www.sberbank.ru/common/img/uploaded/files/pdf/prem_ns.pdf
    notes: >-
      Для клиентов «Премиального обслуживания» (уровни по накоплениям в Сбере: 1 — от 2 млн ₽, 2 — от 3 млн, 3 — от 6
      млн, 4 — от 15 млн, 5 — от 30 млн, 6 — от 100 млн ₽); дата редакции в документе не указана — действует не позже
      дня сверки. Базовая 6,5 % на ежедневный минимальный остаток; надбавка за пакет (уровни 1–3 — 1, 4–6 — 1,9)
      уже в ставке варианта, поэтому вариант выбирается по уровню. Надбавки за инвестиции в Сбере и за покупки по
      картам Сбера — свои у уровней 4–6. Максимум — 11,75 % без уровня, 12,75 % на уровнях 1–3, 13 % на 4–6.
    variants:
      - id: none
        name: Без уровня
        audience: [premium]
        accrual: daily
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "6.5" }
        bonuses:
          - id: invest
            name: Инвестиции в Сбере (от 100 тыс.; от 1 млн; от 5 млн ₽)
            check: manual
            levels:
              - { from: 1, plus: "0.5" }
              - { from: 2, plus: "1.5" }
          - id: spend
            name: Покупки по картам Сбера за прошлый месяц
            check: card_spend
            next_month: true
            levels:
              - { from: 3000000, plus: "1" }
              - { from: 5000000, plus: "2" }
              - { from: 10000000, plus: "3.75" }
      - id: levels1-3
        name: Уровни 1–3 (ставка с надбавкой за пакет)
        audience: [premium]
        accrual: daily
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "7.5" }
        bonuses:
          - id: invest
            name: Инвестиции в Сбере (от 100 тыс.; от 1 млн; от 5 млн ₽)
            check: manual
            levels:
              - { from: 1, plus: "0.5" }
              - { from: 2, plus: "1.5" }
          - id: spend
            name: Покупки по картам Сбера за прошлый месяц
            check: card_spend
            next_month: true
            levels:
              - { from: 3000000, plus: "1" }
              - { from: 5000000, plus: "2" }
              - { from: 10000000, plus: "3.75" }
      - id: levels4-6
        name: Уровни 4–6 (ставка с надбавкой за пакет)
        audience: [premium]
        accrual: daily
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "8.4" }
        bonuses:
          - id: invest
            name: Инвестиции в Сбере (от 100 тыс.; от 1 млн; от 5 млн ₽)
            check: manual
            levels:
              - { from: 1, plus: "1" }
              - { from: 2, plus: "1.5" }
              - { from: 3, plus: "1.75" }
          - id: spend
            name: Покупки по картам Сбера за прошлый месяц
            check: card_spend
            next_month: true
            levels:
              - { from: 3000000, plus: "1" }
              - { from: 5000000, plus: "1.5" }
              - { from: 10000000, plus: "2.85" }
