          - { from: 120, to: 120, amount_from: 30000000, percent: "11.5" }
          - { from: 150, to: 150, amount_from: 30000000, percent: "11.5" }
          - { from: 181, to: 181, amount_from: 30000000, percent: "11.6" }
          - { from: 367, to: 367, amount_from: 30000000, percent: "10.9" }
          - { from: 731, to: 731, amount_from: 30000000, percent: "10.3" }
          - { from: 1095, to: 1095, amount_from: 30000000, percent: "10.8" }
