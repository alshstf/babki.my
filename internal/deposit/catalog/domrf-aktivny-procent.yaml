id: domrf-aktivny-procent
bank: domrf
name: Вклад «Активный процент»
kind: deposit
watch:
  - https://domrfbank.ru/deposits/active-percent/
  - https://domrfbank.ru/deposits/docs/
editions:
  - from: 2026-10-09
    checked_on: 2026-10-16
    sources:
      - https://domrfbank.ru/upload/iblock/800/n33j3oorrtxgwcuvzx0npw3zuw7yv7bf/%D0%9F%D1%80%D0%BE%D1%86%D0%B5%D0%BD%D1%82%D0%BD%D1%8B%D0%B5%20%D1%81%D1%82%D0%B0%D0%B2%D0%BA%D0%B8%20%D1%81%2009.10.2026.pdf
    notes: >-
      От 30 000 ₽, без пополнения и снятия, проценты в конце срока. Ставка каждого месяца — по покупкам по картам
      ДОМ.РФ в прошлом календарном месяце (от 10 000, 50 000 и 90 000 ₽ — повышенные ставки, меньше 10 000 ₽ —
      базовая); в месяц открытия — наибольшая. Переводы, СБП, оплата по QR-коду и покупки кредитной картой не
      считаются — программа покупки кредиткой считает, это стоит учесть отметкой. Срок выбирается вариантом: у
      каждого срока свои ставки.
    variants:
      - id: d91
        name: 91 дней
        payouts: [end]
        ops: none
        term_unit: days
        grid:
          - { from: 91, to: 91, amount_from: 3000000, percent: "13" }
        schedule:
          - { name: Месяц открытия, months: 1, grid: [{ from: 91, to: 91, amount_from: 3000000, percent: "14.5" }] }
        bonuses:
          - id: spend
            name: Покупки по картам ДОМ.РФ за прошлый месяц
            check: card_spend
            next_month: true
            levels:
              - { from: 1000000, plus: "0.8" }
              - { from: 5000000, plus: "0.9" }
              - { from: 9000000, plus: "1.5" }
