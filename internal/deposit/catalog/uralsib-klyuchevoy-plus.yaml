    sources:
      - https://uralsib.ru/api/directory-engine/files/rates/klyuchevoj-plyus_250926_c2xs8slj.pdf
    notes: >-
      Ставка — ключевая ставка Банка России минус 0,8 (91 день) или 0,7 (181 и 367 дней) п. п.; меняется с даты
      изменения ключевой, прошлые периоды не пересчитываются. От 500 000 ₽; у пакетов «Премиум» и «Частный» — свои
      варианты от 2 млн ₽ (у «Частного» — ещё ступени от 10 и 50 млн ₽). Проценты ежемесячно — на отдельный счёт или на вклад. Досрочно — 0,01 %.
