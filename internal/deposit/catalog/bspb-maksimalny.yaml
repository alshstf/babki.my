      - https://s3.ru-msk.k2.cloud/bucket-cms-prod/vklad_maksimalnyj_b4669357d4.pdf
    notes: >-
      «Краткие условия по вкладам» с 08.10.2026: от 10 000 ₽, без пополнения и снятия; online — на 0,5 п. п. выше, чем
      в офисе. Сроки — 31, 91, 181, 367, 733 и 1097 дней. Продление — на условиях вклада «Депозит 2.0» в день продления
      (у online — по выбору). Досрочно — ставка «До востребования». В долларах, евро и юанях — от 1 000, сроки в
      месяцах, ставки online и в офисе одинаковые.
