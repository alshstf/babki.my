    sources:
      - https://www.vtb.ru/media-files/vtb.ru/sitepages/personal/vklady-i-scheta/dvojnaya-vygoda/dvoinaya_vigoda.pdf
    notes: >-
      Для участников программы долгосрочных сбережений НПФ ВТБ: открыть в 14 дней после договора (от 30 000 ₽), сумма
      вклада — не больше первого взноса по нему, один вклад на договор. Без пополнения и снятия, проценты в конце
      срока, без продления. Расторгли договор в «период охлаждения» — ставка вклада снижается до 0,01 %: тогда
      впишите ставку вручную.
