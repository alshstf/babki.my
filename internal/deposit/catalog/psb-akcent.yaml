id: psb-akcent
bank: psb
name: Накопительный счёт «Акцент на процент»
kind: savings
watch:
  - https://www.psbank.ru/personal/savingsaccount
editions:
  - from: 2025-12-30
    checked_on: 2026-10-19
    sources:
      - https://www.psbank.ru/qpstorage/psb/images/personal/savingsaccount/full_terms_ns_30122025.pdf
    notes: >-
      Архив банка: условия накопительных счетов с 30.12.2025, действовали по 15.01.2026. Базовая 10 % на ежедневный остаток, надбавка за покупки по картам ПСБ в прошлом месяце — на остаток до 1,5 млн ₽ (Orange Premium Club — до 3 млн ₽).
    variants:
      - id: daily
        name: «Акцент на процент»
        audience: [all]
        accrual: daily
        payouts: [capitalize]
        ops: topup_withdraw
        grid:
          - { percent: "10" }
        bonuses:
          - id: spend
            name: Покупки по картам ПСБ за прошлый месяц
            check: card_spend
            next_month: true
            cap: 150000000
            levels:
              - { from: 1000000, plus: "3" }
              - { from: 5000000, plus: "4" }
              - { from: 10000000, plus: "5" }
              - { from: 15000000, plus: "6" }
              - { from: 25000000, plus: "7" }
