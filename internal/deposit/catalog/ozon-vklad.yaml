id: ozon-vklad
bank: ozon
name: Вклад
kind: deposit
watch:
  - https://finance.ozon.ru/documents/deposit-tariffs
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://finance.ozon.ru/documents/deposit-tariffs
    notes: >-
      Дата редакции у банка не указана — действует не позже дня сверки. От 10 000 ₽, проценты капитализируются
      ежемесячно в число открытия. Здесь — номинальные ставки тарифа; в рекламе банк называет ставку «с
      капитализацией» (например, 13,7 % вместо 13,55 % на 3 месяца). Непополняемый — деньги кладутся один раз при
      открытии. Досрочно — 0,1 % без капитализации. Продление — на тот же срок по условиям дня продления.
