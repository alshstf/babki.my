id: sber-sbervklad
bank: sber
name: СберВклад
kind: deposit
watch:
  - https://www.sberbank.ru/ru/person/contributions/deposits/vklad
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://www.sberbank.ru/ru/person/contributions/deposits/vklad
      - https://www.sberbank.ru/proxy/services/deposit/dict/depositCalc/valQvbGroup/1321?terrBankCode=038&timeZone=0
      - https://www.sberbank.ru/common/img/uploaded/vklad/usl_r_vkladov.pdf
    notes: >-
      Дата редакции у банка не указана — ставки со страницы вклада (её калькулятор) в день сверки. Без пополнения и
      снятия, открытие в СберБанк Онлайн, от 100 000 ₽; в отделении ставки на 1 п. п. ниже — ручная ставка, как и у
      вклада с пополнением. Ступень — по сумме вклада: от 100 000, 500 000 ₽ и 1 млн ₽. Надбавки (у вкладов до года,
      по 0,5 п. п.) действуют, пока выполнено условие (п. 76 Общих условий): СберПрайм или премиальный пакет; одна из
      трёх — пенсия, зарплата или покупки по картам Сбера от 30 000 ₽ за прошлый месяц; остаток на накопительных
      счетах Сбера от 100 000 ₽ на конец дня. Выплата ежемесячно — на карту или с капитализацией по одной ставке.
