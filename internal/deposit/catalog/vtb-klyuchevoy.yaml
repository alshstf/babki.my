id: vtb-klyuchevoy
bank: vtb
name: ВТБ-Вклад «Ключевой»
kind: deposit
watch:
  - https://www.vtb.ru/personal/vklady-i-scheta/vklad-klyuchevoj/
editions:
  - from: 2026-07-27
    checked_on: 2026-10-16
    sources:
      - https://www.vtb.ru/media-files/vtb.ru/sitepages/personal/vklady-i-scheta/vklad-klyuchevoj/vtb-vklad_klyuchevoy_mass.pdf
    notes: >-
      Ставка — ключевая ставка Банка России на каждый день срока минус дисконт; дисконт фиксируется при открытии,
      новая ключевая — с даты начала действия решения. Ступень — по первоначальному взносу (от 500 000 ₽, 5 и 15 млн
      ₽). Пополнение — до максимальной суммы вклада, снятие — до неснижаемого остатка. Выплата в конце срока — только
      без пополнения и снятия. Автопродления нет.
    variants:
