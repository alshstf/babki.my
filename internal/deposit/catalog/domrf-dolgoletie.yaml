    notes: >-
      Для тех, кто при посредничестве банка заключил договор долгосрочных сбережений с НПФ «Ренессанс Накопления» и
      внёс первый взнос в день открытия вклада; сумма — от 100 000 ₽ и не больше взноса. Без пополнения и снятия,
      проценты в конце срока. Расторгли договор — ставка становится ставкой «Мой Дом» на дату открытия: тогда
      впишите ставку вручную.
