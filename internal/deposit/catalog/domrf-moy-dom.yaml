  - from: 2026-10-09
    checked_on: 2026-10-16
    sources:
      - https://domrfbank.ru/upload/iblock/800/n33j3oorrtxgwcuvzx0npw3zuw7yv7bf/%D0%9F%D1%80%D0%BE%D1%86%D0%B5%D0%BD%D1%82%D0%BD%D1%8B%D0%B5%20%D1%81%D1%82%D0%B0%D0%B2%D0%BA%D0%B8%20%D1%81%2009.10.2026.pdf
    notes: >-
      Ставки «Процентные ставки по вкладам с 09.10.2026» (банк публикует новую таблицу раз в одну-две недели). Ступень —
      по сумме вклада: от 30 000 ₽ и от 1,5 млн ₽. Надбавка «Новый клиент» или за «новые деньги» — только у вклада без
      пополнения и снятия на 91 день, только в основной срок и если новые все деньги вклада. Пенсионерам («Вклад для
      пенсионеров») — +0,7 на 91 день и +0,1 на другие сроки; с надбавкой «новым» не складывается. В юанях и
      долларах — от 500 до 200 000; с пополнением ставка 0,01 %. Досрочно — 0,01 %.
