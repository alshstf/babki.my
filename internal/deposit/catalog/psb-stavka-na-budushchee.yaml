id: psb-stavka-na-budushchee
bank: psb
name: Вклад «Ставка на будущее»
kind: deposit
watch:
  - https://www.psbank.ru/personal/saving/stavka-na-budushchee
  - https://www.psbank.ru/personal/saving
editions:
  - from: 2026-09-29
    checked_on: 2026-10-16
    sources:
      - https://www.psbank.ru/qpstorage/psb/images/conditionsterms.pdf
    notes: >-
      Условия вкладов с 29.09.2026. Открывается вместе с договором долгосрочных сбережений с НПФ ПСБ и первым взносом по нему; от 30 000 ₽ и не больше взноса, до 3 вкладов на человека. Без пополнения и снятия, проценты в конце срока. Расторгли договор в 14 дней — ставка снижается до 0,01 % с начала вклада: тогда впишите ставку вручную. Продление не больше 3 раз — на условиях «Моей выгоды».
