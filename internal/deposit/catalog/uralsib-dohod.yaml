    notes: >-
      Тарифы с 25.09.2026, рубли и юани. От 100 000 ₽ (онлайн — от 50 000 ₽); на 91 день — от 1,4 млн ₽. Проценты
      на фактический ежедневный остаток: у «Дохода» — ежемесячно на отдельный счёт или в конце срока; у «Доход.
      Премиум» (пакеты «Премиум», «Премиум Старт») и «Доход. Частный» (Private Banking) — ещё и капитализация (здесь
      — базовая ставка, без учёта капитализации). В юанях — от 20 000 ¥, проценты ежемесячно. Досрочно — 0,01 %.
