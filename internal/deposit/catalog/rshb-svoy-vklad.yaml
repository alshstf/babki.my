id: rshb-svoy-vklad
bank: rshb
name: «Свой вклад»
kind: deposit
watch:
  - https://www.rshb.ru/natural/deposits/svoy-deposit
editions:
  - from: 2026-10-16
    checked_on: 2026-10-16
    sources:
      - https://www.rshb.ru/natural/deposits/svoy-deposit
      - https://www.rshb.ru/wcms-resources/vkladcalculator-novij-obshij.json
    notes: >-
      Дата редакции у банка не указана — ставки калькулятора страницы в день сверки. Сумма — от 5 000 до 10 млн ₽
      (со снятием — от 10 000 ₽), срок в месяцах. Дистанционно ставки выше, чем в офисе. «Новый сберегатель» (30 дней
      без вкладов и накопительных в банке) получает надбавку только к вкладу без пополнения и снятия с процентами в
      конце срока. Акция «Выгодные зачисления» (пенсия или зарплата в банке) — по своим ставкам, ручная ставка.
