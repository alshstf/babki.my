id: tbank-black
bank: tbank
name: Программа лояльности Black
watch:
  - https://www.tbank.ru/finance/vygoda/
editions:
  - from: 2026-04-02
    checked_on: 2026-10-19
    sources:
      - https://cdn.tbank.ru/static/documents/loyalty-program-black.pdf
      - https://cdn.tbank.ru/static/documents/description-mcc-categories.pdf
    notes: >-
      Карты Black, Black Premium, Black Private. Дата редакции правил не указана; редакция — с даты перечня категорий
      «МСС-ПЛ-BLACK-260402» (02.04.2026), правила сверены 19.10.2026. Каждый месяц банк предлагает категории с процентами (до 30 %), клиент
      выбирает 4 и может получить дополнительную в течение месяца; «1 % на все покупки» — тоже категория из
      предложенных. Бонус за выбранные категории — только за покупки после выбора. Потолок бонусов за расчётный период
      без подписки — 3 000 ₽, с Pro, Premium, Private — по условиям сервиса; сверх потолка сгорает. Бонус округляется до
      рубля вниз. Без бонусов: переводы, СБП, снятие наличных, пополнения, оплата в «Платежах» приложения, перечень
      брендов банка. «Самокаты» и «Маркетплейсы» банк определяет по магазинам, а не по кодам.
    period: month
    variants:
      - { id: black, name: Black без подписки, pick: 4, cap_minor: 300000 }
      - { id: black-pro, name: Black с подпиской Pro, pick: 4 }
      - { id: black-premium, name: Black Premium, pick: 4 }
      - { id: black-private, name: Black Private, pick: 4 }
