    notes: >-
      Правила программы лояльности «СберСпасибо», редакция с 01.03.2025 (таблица 1 — категории покупок и их MCC);
      правила сверены 19.10.2026. Категории выбираются каждый месяц с первого числа в СберБанк Онлайн («Кошелёк» →
      СберСпасибо → Мои категории); у СберКарты — 3 категории (по странице программы). Сколько категорий и какой лимит
      у пенсионеров, премиальных пакетов и СберПрайм — таблица 2 правил, по уровням; у премиального обслуживания 5
      уровня и Sber Private Banking категории подключены всегда. Без выбора бонусы — только у партнёров. Покупки в
      сервисах экосистем (коды 3990, 3991 — «Яндекс Еда», «Купер», «Самокат»…) входят в категории только по своим
      сервисам и сюда не включены. Базовая категория «На все покупки» — все покупки, кроме исключений правил (п. 3.8, таблица 3: переводы, наличные, госплатежи, связь и ЖКХ, маркетплейсы, оптовая торговля, страхование…); категория, назвавшая код сама (5715 — «Супермаркеты»), берёт его всё равно.
