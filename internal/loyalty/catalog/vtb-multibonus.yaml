editions:
  - from: 2026-10-01
    checked_on: 2026-10-19
    sources:
      - https://www.vtb.ru/media-files/vtb.ru/sitepages/personal/karty/tarify/pravila-pr-loyalnosti.pdf
    notes: >-
      Правила программы лояльности «Мультибонус». Дата редакции в правилах не указана; правила скачаны 19.10.2026 и
      внесены с начала месяца сверки — категории выбираются на месяц.
      Категории месяца подключаются с 26-го числа предыдущего месяца до конца месяца — все доступные сразу, поменять
      выбор нельзя; число категорий — по пакету на 10-е число предыдущего месяца (таблица 3 правил): зарплатному
      клиенту или с регулярным автопополнением — 4, остальным — 3; перечень и ставки категорий банк задаёт на каждый
      месяц. Кроме этих категорий есть особые: «Все остальные покупки» и «Все покупки» — все коды таблицы 1, кроме
      исключений раздела 5. Исключения (раздел 5) с пометкой «*» (ЖКХ, связь) бонус дают, если код входит в
      подключённую категорию.
