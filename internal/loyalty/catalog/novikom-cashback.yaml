id: novikom-cashback
bank: novikom
name: Программа лояльности «Кешбэк»
watch:
  - https://novikom.ru/cards/cashback-program/
editions:
  - from: 2026-09-01
    checked_on: 2026-10-19
    sources:
      - https://novikom.ru/documents/perechen-mss-kodov-po-izbrannym-kategoriyam-deystvuyushchim-s-01-09-2026-po-31-10-2026.pdf
      - https://novikom.ru/documents/tarify-i-usloviya-banka-po-pl-keshbek-01092026.pdf
      - https://novikom.ru/documents/perechen-mss-kodov-po-operatsiyam-isklyucheniyam-po-programme-keshbek.pdf
    notes: >-
      Избранные категории на период с 01.09.2026 по 31.10.2026: банк выкладывает перечень на каждые два месяца (с марта,
      мая, июля, сентября), клиент подключает до 4 категорий в приложении один раз за период — выбор каждый раз заново.
      Кешбэк по избранным категориям — до 25 %. Кроме них — базовый кешбэк по сумме покупок месяца (0,25–1 % по
      типу карты, до 7 000 ₽ в месяц) — его каталог пока не считает. Исключения — перечень MCC банка.
