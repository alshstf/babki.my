name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npm run build
      - name: Test UI
        run: cd web && npm run test
      - name: Lint UI
        run: cd web && npm run lint
      - name: Check UI i18n coverage
        run: cd web && npm run i18n:check

      # go.mod requires go 1.26 (approved deviation from the original brief's
      # "1.25"); the .x wildcard pins CI to the latest 1.26.z patch.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Check generated code is fresh
        run: |
          make gen
          git diff --exit-code
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --build-tags=embedui
      - name: Test
        run: go test ./...
      - name: Test embedded UI
        run: go test -tags embedui ./web/

      - name: Docker build
        run: docker build -t babki:ci .
