name: ci
on:
  push:
    branches: [main]
  pull_request:
  # A release runs the same checks before it builds anything (release.yml).
  workflow_call:

# The workflow reads the repository and nothing else: it publishes nothing and
# comments on nothing, so its token is not given the right to.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npm run build
      - name: Test UI
        run: cd web && npm run test
      - name: Lint UI
        run: cd web && npm run lint
      - name: Check UI i18n coverage
        run: cd web && npm run i18n:check

      # go.mod requires go 1.26 (approved deviation from the original brief's
      # "1.25"); the .x wildcard pins CI to the latest 1.26.z patch.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Check generated code is fresh
        run: |
          make gen
          git diff --exit-code
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --build-tags=embedui
      # Known vulnerabilities in what the code actually calls (tests included)
      # and in the dependencies the built page ships. A finding here is fixed by
      # updating the module it names.
      - name: Known vulnerabilities (Go)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Known vulnerabilities (UI, shipped dependencies)
        run: cd web && npm audit --omit=dev
      - name: Test
        run: go test ./...
      - name: Test embedded UI
        run: go test -tags embedui ./web/

      - name: Docker build
        run: docker build -t babki:ci .

  # The owner's first path through the built program — sign in, open an
  # account, buy shares, see the position grow — against the real server and
  # database, seeded with the demo data. Runs beside build-test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the program with the demo data
        working-directory: deploy/compose
        run: |
          {
            echo "POSTGRES_PASSWORD=e2e-$(openssl rand -hex 8)"
            echo "BABKI_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "BABKI_COOKIE_SECURE=false"
          } > .env
          docker compose up -d --build --wait
          docker compose exec -T app babki seed
      - name: Install the browser
        run: cd web && npm ci && npx playwright install --with-deps chromium
      - name: Journey
        run: cd web && BASE_URL=http://localhost:8080 npm run e2e
      - name: Program log
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs app | tail -200
