name: release
on:
  # A version tag (v0.N.0) publishes the image and the release page (decision
  # Р-18).
  push:
    tags: ["v*.*.*"]
  # A change to how the image is built is tried on both architectures before it
  # merges; nothing is published.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    # On a pull request the checks are ci.yml's own run, so this job goes ahead
    # without them.
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Only the last stage runs as arm64 (see the Dockerfile), so emulation
      # costs one `apk add`.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.3.1 is published as 0.3.1, 0.3 and latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alshstf/babki
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The release page lists the pull requests merged since the previous tag, by
  # their titles.
  page:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
