name: vulns
on:
  # A vulnerability published today is found today, even when nothing merged.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          # The newest 1.26 patch, not the runner's cached one: a security
          # release (Go's own fixes in net/http, crypto/tls) is what the
          # vulnerability check asks for the day it ships.
          check-latest: true
      - name: Go
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI, shipped dependencies
        run: cd web && npm audit --omit=dev
