name: vulns
on:
  # A vulnerability published today is found today, even when nothing merged.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  known-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Go
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI, shipped dependencies
        run: cd web && npm audit --omit=dev
