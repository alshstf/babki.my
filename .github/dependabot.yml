# Weekly, grouped: one PR per ecosystem a week rather than one per package; a
# new major version comes on its own, since it may need the code changed.
# Security updates come at once and outside this schedule (the repository's
# Dependabot security updates). Every PR passes the same checks as any other
# and is merged on green (decision Р-18).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    # Node's types follow the Node the UI is built with (22, here and in CI),
    # not the newest Node.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A base image's new major (node 24, a new alpine) is a decision, not an
    # update; the compose file's postgres is left out for the same reason — a
    # new major needs its data upgraded.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Go moves as one: go.mod, CI and the image together, by hand.
      - dependency-name: golang
    groups:
      images:
        patterns: ["*"]
