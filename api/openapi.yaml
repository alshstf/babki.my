openapi: 3.0.3
info:
  title: babki.my API
  version: 0.1.0
paths:
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /api/v1/setup:
    post:
      operationId: performSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Instance initialized, caller signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tax-residencies:
    get:
      operationId: listTaxResidencies
      description: >-
        Every country this application has cost basis rules for, with the rules
        themselves, sorted by country code. This is the list a client offers the
        owner to choose from, and it is served rather than hardcoded so the
        countries and their consequences live in exactly one place — a client
        that shipped its own copy would eventually offer a country the server
        rejects, or promise rules the server does not follow.
      responses:
        "200":
          description: Selectable tax residencies and what each implies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostBasisRules" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/space:
    patch:
      operationId: updateSpace
      description: Updates the space's base currency and/or the owner's country of tax residency (owner-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberInfo" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberRequest" }
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/members/{userId}:
    patch:
      operationId: updateMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Accounts with latest balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountWithBalance" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}:
    patch:
      operationId: updateAccount
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveAccount
      description: Archives the account (soft delete).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/balance:
    put:
      operationId: setAccountBalance
      description: Sets a manual balance mark for a date (upsert per account+date).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBalanceRequest" }
      responses:
        "200":
          description: Account with the new latest balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Per-currency totals over active accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments:
    get:
      operationId: searchInstruments
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Matching instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstrumentRequest" }
      responses:
        "201":
          description: Created instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}:
    patch:
      operationId: updateInstrument
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInstrumentRequest" }
      responses:
        "200":
          description: Updated instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/operations:
    get:
      operationId: listAccountOperations
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Account operations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operations:
    post:
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/transfer:
    post:
      operationId: createTransfer
      description: Creates a linked transfer_out/transfer_in pair moving instrument quantity between accounts with FIFO cost-basis carryover.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Created pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}:
    delete:
      operationId: deleteOperation
      description: Deletes the operation (whole pair for transfers). Rejected if the remaining journal becomes inconsistent (oversell).
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/positions:
    get:
      operationId: listAccountPositions
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Open positions computed from the journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SetupStatus:
      type: object
      required: [setup_needed]
      properties:
        setup_needed: { type: boolean }
    SetupRequest:
      type: object
      required: [space_name, username, display_name, password]
      properties:
        space_name: { type: string }
        username: { type: string }
        display_name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    UserInfo:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SessionInfo:
      type: object
      required: [user, role, space_id, space_name, base_currency, tax_residency, cost_basis_rules]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        role: { $ref: "#/components/schemas/Role" }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        base_currency: { type: string, description: "ISO-4217, e.g. RUB" }
        tax_residency:
          type: string
          description: "The OWNER'S country of tax residency, ISO 3166-1 alpha-2 (e.g. RU). A property of the person, not of an account: a Russian resident declares a foreign broker's account by Russian rules too, so it is set once per space and applies to every account in it. Defaults to RU."
        cost_basis_rules:
          description: "What tax_residency implies for the cost basis figures this application computes. Carried in the session so the settings screen can state the consequence of the country the owner picked; the same object is repeated on PositionsResponse so the screen showing the figures carries the caveat with them."
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
    UpdateSpaceRequest:
      type: object
      description: "Partial update of the space. Every field is optional and an omitted field is left unchanged, but at least one must be present — an empty body is rejected rather than silently accepted as a no-op."
      properties:
        base_currency: { type: string, description: "ISO-4217 uppercase, e.g. RUB" }
        tax_residency:
          type: string
          description: "ISO 3166-1 alpha-2 uppercase, e.g. RU. Must be one of the countries this application has cost basis rules for (GET /api/v1/tax-residencies lists them); anything else is a 400. An unrecognised code is never accepted and quietly treated as Russia — that silent substitution is the exact failure this field exists to prevent."
    CostBasisMethod:
      type: string
      description: "How a jurisdiction decides WHICH of the parcels held are the ones a sale disposed of. `fifo`: the earliest acquisitions, in order. `average`: no parcels at all — one pooled average cost per instrument. `specific_lot`: the taxpayer nominates the parcel. `not_applicable`: the country does not tax an individual's capital gains, so nothing has to be matched. `unknown`: the stored country has no rules row in this application (see CostBasisNotice.unknown_country)."
      enum: [fifo, average, specific_lot, not_applicable, unknown]
    CostBasisPerimeter:
      type: string
      description: "Over WHICH holdings that queue is built. `account`: separately per account/depot. `owner`: across everything the owner holds, wherever it sits — representable here but NOT implemented; a country carrying it is reported as unsupported. `not_applicable`: no queue exists to scope (the taxpayer picks the parcel, or gains are untaxed). `unknown`: no rules row for the stored country."
      enum: [account, owner, not_applicable, unknown]
    CostBasisNotice:
      type: string
      description: "One way this application's computation fails to answer for the owner's country. Machine-readable on purpose: the wording the owner reads is the interface's to translate, and the server never sends prose. `method_mismatch`: the country matches disposals by a different method, so the figures are NOT a cost basis under its rules. `perimeter_mismatch`: the queue must span more than one account. `not_taxed`: the country does not tax an individual's capital gains at all, so the figures are informational rather than fiscal. `unknown_country`: the stored country has no rules row here, so nothing is claimed about it — the figures are still FIFO within one account, which is what they always are."
      enum: [method_mismatch, perimeter_mismatch, not_taxed, unknown_country]
    CostBasisRules:
      type: object
      description: "The cost basis rules of one country, derived from its ISO 3166-1 alpha-2 code through a single table in the server. The figures this application publishes are ALWAYS computed FIFO within one account; this object says whether that is what the country actually requires, and names every way it is not."
      required: [country, method, perimeter, supported, notices]
      properties:
        country: { type: string, description: "ISO 3166-1 alpha-2 the row was derived from" }
        method: { $ref: "#/components/schemas/CostBasisMethod" }
        perimeter: { $ref: "#/components/schemas/CostBasisPerimeter" }
        supported:
          type: boolean
          description: "True only when this country's method and perimeter are exactly what the application computes — FIFO within one account — and the country taxes capital gains at all. When false, `notices` is non-empty and says why; the figures are still returned, because a cost basis is also plainly \"what I paid\", but they must not be presented as this country's tax basis."
        notices:
          type: array
          items: { $ref: "#/components/schemas/CostBasisNotice" }
          description: "Empty exactly when `supported` is true. Several can apply at once (Britain pools by average AND across all of the owner's holdings) and all of them are listed: reporting only the first would hide a real divergence behind another one."
    Role:
      type: string
      enum: [owner, editor, viewer]
    MemberInfo:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    CreateMemberRequest:
      type: object
      required: [username, display_name, password, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AccountType:
      type: string
      enum: [brokerage, checking, savings, deposit, credit_card, loan, cash]
    AccountStatus:
      type: string
      enum: [active, archived]
    AccountWithBalance:
      type: object
      required: [id, name, type, currency, institution, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string }
        institution: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        created_at: { type: string, format: date-time }
        balance: { $ref: "#/components/schemas/BalancePoint" }
        balance_in_base:
          nullable: true
          description: "Account's balance converted into the space's base currency at today's fx rate. Null when the account has no balance, its currency already equals base_currency (nothing to convert), or no fx rate could be resolved."
          allOf:
            - $ref: "#/components/schemas/MoneyInBase"
    BalancePoint:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    MoneyInBase:
      type: object
      required: [amount_minor, currency, rate_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Amount in the base currency's minor units" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the fx rate actually used for this conversion" }
    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string, description: "ISO-4217, e.g. RUB" }
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
    UpdateAccountRequest:
      type: object
      properties:
        name: { type: string }
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AccountStatus" }
    SetBalanceRequest:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    CurrencyTotal:
      type: object
      required: [currency, assets_minor, liabilities_minor, net_minor]
      properties:
        currency: { type: string }
        assets_minor: { type: integer, format: int64 }
        liabilities_minor: { type: integer, format: int64, description: "Negative or zero" }
        net_minor: { type: integer, format: int64 }
    Summary:
      type: object
      required: [totals, base_currency, unconverted]
      properties:
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        base_currency: { type: string, description: "ISO-4217, from the space; e.g. RUB" }
        total_in_base_minor:
          type: integer
          format: int64
          nullable: true
          description: "Sum of totals[].net_minor converted using the latest FX rate on or before today; null only if none of the currencies could be converted"
        unconverted:
          type: array
          items: { type: string }
          description: "Currencies from totals that had no fx rate available and were excluded from total_in_base_minor; empty if all converted"
        rates_on:
          type: string
          nullable: true
          description: "Oldest FX rate date used for the conversion; null if nothing was converted"
    InstrumentType:
      type: string
      enum: [share, bond, etf, currency, crypto, metal, custom]
    Instrument:
      type: object
      required: [id, type, name, ticker, isin, figi, currency, frozen]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
        frozen: { type: boolean }
    CreateInstrumentRequest:
      type: object
      required: [type, name, currency]
      properties:
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
    UpdateInstrumentRequest:
      type: object
      properties:
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        frozen: { type: boolean }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
    OperationType:
      type: string
      enum: [buy, sell, deposit, withdrawal, dividend, coupon, amortization, fee, tax, transfer_in, transfer_out, split, interest, conversion]
    Operation:
      type: object
      required: [id, account_id, type, occurred_on, amount_minor, currency, fee_minor, note, source, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true, description: "Date YYYY-MM-DD" }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price: { type: string, nullable: true, description: "Decimal as string" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        transfer_group_id: { type: string, format: uuid, nullable: true }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
        source: { type: string }
        created_at: { type: string, format: date-time }
        in_base:
          nullable: true
          description: "amount_minor and fee_minor converted into the space's base currency at the fx rate in effect on occurred_on — the rate of the day the operation happened, NOT today's. This is the deliberate difference from AccountWithBalance.balance_in_base, which answers \"what is this worth now\"; the journal answers \"what did this cost then\". Position.in_base sits between the two: its cost_minor and income_minor follow the same historical rule as this field (each lot at the rate of its acquisition date, each payment at the rate of its own), while only its market_value_minor is a current valuation. Each amount is converted and rounded independently. One exception, and it is the whole point of the rule rather than a break from it: an in-kind transfer between two accounts of the same family carries a cost basis assembled from purchases made on other days, so its amount_minor is converted piece by piece at the rate of the day each piece was bought, and the whole is rounded once (in_base.assembled_from_lots says when this happened). BOTH legs of the pair are converted that way — the departing transfer_out and the arriving transfer_in describe one parcel with one set of purchases behind it, so they publish the same figure and, for the same reason, both fall back to null together when any one of those purchase dates has no rate. Converting either on the transfer's own date would price old shares at the rate of the day they changed brokers and make that row contradict the position built from the very same purchases. Null when `currency` already equals the base currency (nothing to convert), when no fx rate could be resolved for one of the dates it needs nor any earlier one, or when the transfer's parcel — or a piece of it — does not know when it was bought: a basis entered by hand, one recorded before breakdowns were kept, or a breakdown that mixes dated pieces with pieces carried over from an earlier undated transfer, all leave at least one purchase date unknown, and no rate answers for a date nobody recorded (both legs fall back to null together here too, for the identical reason Position.in_base does — see its description). A partially converted operation is never published. Computed only for the journal listing (GET /accounts/{accountId}/operations); create and transfer responses omit the field entirely, since those return an operation the client just submitted rather than a journal to read. An absent field and an explicit null mean the same thing to a reader: there is nothing converted to show."
          allOf:
            - $ref: "#/components/schemas/OperationInBase"
    OperationInBase:
      type: object
      required: [amount_minor, fee_minor, currency, rate_on, assembled_from_lots]
      properties:
        amount_minor: { type: integer, format: int64, description: "Operation.amount_minor converted into currency. The sign is preserved — a buy stays negative — and rounding is half-away-from-zero, so converting never shrinks the magnitude of an outflow" }
        fee_minor: { type: integer, format: int64, description: "Operation.fee_minor converted into currency, rounded independently of amount_minor: the two are separate figures, not terms of one total" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of an fx rate ACTUALLY used, which is occurred_on itself or the nearest earlier date that has a rate (weekend, holiday, provider gap) — never today's date. For a 2019 operation this is a 2019 date; that is what makes this a historical conversion rather than a current valuation. For a transfer converted piece by piece (assembled_from_lots = true) the figure is struck at several rates and no single date describes it: this then names the newest of them, the rate of the most recent purchase in the parcel, and never the transfer's own date — that is the one rate deliberately not used" }
        assembled_from_lots: { type: boolean, description: "True when amount_minor was NOT converted at one rate on occurred_on but assembled piece by piece from the purchases behind it, each at the rate of the day it was bought — the case described in Operation.in_base, and true on both legs of such a transfer. It exists because rate_on alone cannot be read honestly without it: when this is true, rate_on names one of several rates that made the figure rather than the single rate behind it, and it is neither \"the operation's own date\" nor \"the nearest earlier date with a rate\" — comparing rate_on with occurred_on therefore proves nothing and a reader that does so will describe the number wrongly whichever way the comparison lands. False for every ordinary operation, where rate_on does mean exactly what it says; a transfer whose parcel does not know when it was bought, wholly or in part, has no in_base to carry this field at all (see Operation.in_base)" }
    CreateOperationRequest:
      type: object
      required: [account_id, type, occurred_on, amount_minor, currency]
      properties:
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price: { type: string, nullable: true, description: "Decimal as string" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
    TransferRequest:
      type: object
      required: [from_account_id, to_account_id, instrument_id, quantity, occurred_on]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        cost_minor: { type: integer, format: int64, nullable: true, description: "Cost basis override; default is FIFO carryover from the source account" }
        note: { type: string }
    TransferResponse:
      type: object
      required: [out, in]
      properties:
        out: { $ref: "#/components/schemas/Operation" }
        in: { $ref: "#/components/schemas/Operation" }
    Position:
      type: object
      required: [instrument, quantity, cost_minor, realized_pnl_minor, income_minor, fees_minor, currency]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        quantity: { type: string, description: "Decimal as string" }
        cost_minor: { type: integer, format: int64 }
        realized_pnl_minor: { type: integer, format: int64 }
        income_minor: { type: integer, format: int64 }
        fees_minor: { type: integer, format: int64 }
        currency: { type: string }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Market value in market_value_currency; always the same currency as the position's own `currency` when a conversion rate was available, so it's directly comparable to cost_minor. For a bond whose raw valuation is in the face value's currency (not the quote's) and that currency differs from the position's, this is the value converted into the position's currency at today's fx rate; if no rate is available it falls back to the raw (unconverted) value. Null if no usable quote." }
        market_value_currency: { type: string, nullable: true, description: "Currency of market_value_minor. Equal to `currency` (the position's own currency) whenever a conversion happened; otherwise the raw valuation currency (the quote's currency for share/etf, the instrument's face_currency for bond). Null exactly when market_value_minor is null." }
        market_value_source_currency: { type: string, nullable: true, description: "Set only when market_value_minor was converted from a different currency (see market_value_minor): the original, unconverted valuation currency (e.g. a bond's face_currency). Null when no conversion happened, including when one was needed but no fx rate was available." }
        market_value_source_minor: { type: integer, format: int64, nullable: true, description: "Set only when market_value_minor was converted from a different currency: the original, unconverted valuation amount in market_value_source_currency, kept for transparency (e.g. shown in a tooltip). Null when no conversion happened." }
        price: { type: string, nullable: true, description: "Decimal as string; latest quote price used for the valuation" }
        price_on: { type: string, nullable: true, description: "Date YYYY-MM-DD of the quote used for the valuation" }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor, i.e. the position's unrealized profit or loss; both are already in the same currency (market_value_minor is converted into the position's currency when needed, see above), so this is a plain integer subtraction. Null when there is no market_value_minor, or when market_value_currency still differs from currency (a conversion was needed but no fx rate was available)." }
        in_base:
          nullable: true
          description: "The position's amounts in the space's base currency, each valued at the fx rate that answers its own question: cost_minor sums the FIFO lots still held, every lot converted at the rate of the day IT was acquired; income_minor sums the income operations, each at the rate of the day it occurred; market_value_minor uses TODAY's rate, because that is what the holding is worth now; unrealized_pnl_minor is the difference of those last two. Base-currency profit therefore INCLUDES the currency's own move against the base currency, and may differ from the position-currency profit in magnitude and even in sign — that is the intended answer, not a rounding artefact. Null when `currency` already equals the base currency (nothing to convert), any single rate the object needs is missing (today's, one lot's, one income operation's), or one of the FIFO lots still held does not know when it was acquired — a transfer's basis given by hand, or one recorded before breakdowns were kept, produces a lot with no purchase date, and no rate answers for a date nobody recorded. A partially converted position is never published, whether the missing piece is a rate or a date. Inside the object, market_value_minor and unrealized_pnl_minor can still be null on their own when the valuation isn't in the position's currency (see their descriptions). fees_minor and realized_pnl_minor are intentionally not carried into this object (owner feedback)."
          allOf:
            - $ref: "#/components/schemas/PositionInBase"
    PositionInBase:
      type: object
      required: [cost_minor, income_minor, currency, rate_on]
      properties:
        cost_minor: { type: integer, format: int64, description: "Remaining cost basis in currency: every FIFO lot still held, converted at the fx rate of ITS OWN acquisition date, summed as decimals and rounded once at the end. Deliberately NOT Position.cost_minor times today's rate — that would price the basis as if everything had been bought today and would strip the currency's move out of unrealized_pnl_minor below" }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Position.market_value_minor converted into currency at TODAY's fx rate — the one figure in this object that is current rather than historical, since it answers what the holding is worth now. Never fabricated: null when Position.market_value_minor itself is null (no usable quote), AND null whenever market_value_currency differs from the position's own currency, because the rate applied here converts the position's currency into the base currency and a valuation still denominated in some other currency (a bond's face_currency, when no rate could bring it into the position's currency) would then be multiplied by the wrong pair's rate — a silently wrong number" }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor. Both are already in currency, so this is exact integer subtraction and nothing is rounded a second time. Since the basis is historical and the valuation is current, this INCLUDES the fx revaluation of the position: it is NOT Position.unrealized_pnl_minor times a rate, and a holding can be in profit in its own currency while at a loss in the base currency (or the reverse). Null exactly when market_value_minor above is null — the P&L is derived from the valuation and cannot outlive it" }
        income_minor: { type: integer, format: int64, description: "Income in currency: every income operation of the position (dividend, coupon, tax) converted at the fx rate of the date it occurred, summed as decimals and rounded once at the end — not Position.income_minor times today's rate" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the fx rate behind market_value_minor: today's rate, or the nearest earlier date the rate table actually holds. It does NOT describe cost_minor or income_minor — those use one rate per lot and per operation date, so no single date could name them" }
    PositionsResponse:
      type: object
      required: [positions, cost_basis_rules]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        cost_basis_rules:
          description: "Whether the cost basis behind every figure above is the one the owner's country requires (see CostBasisRules). It travels with the numbers rather than only in the session because this is the payload a reader takes the numbers from: a client that renders positions without ever reading the session must still be unable to show cost_minor, unrealized_pnl_minor and realized_pnl_minor as if they were a tax basis when they are not. It describes the whole computation, not one row, so it sits on the response rather than being repeated identically inside every Position."
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
