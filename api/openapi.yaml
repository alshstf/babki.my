openapi: 3.0.3
info:
  title: babki.my API
  version: 0.1.0
paths:
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /api/v1/setup:
    post:
      operationId: performSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Instance initialized, caller signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tax-residencies:
    get:
      operationId: listTaxResidencies
      description: >-
        Every country this application has cost basis rules for, with the rules
        themselves, sorted by country code. This is the list a client offers the
        owner to choose from, and it is served rather than hardcoded so the
        countries and their consequences live in exactly one place — a client
        that shipped its own copy would eventually offer a country the server
        rejects, or promise rules the server does not follow.
      responses:
        "200":
          description: Selectable tax residencies and what each implies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostBasisRules" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/space:
    patch:
      operationId: updateSpace
      description: Updates the space's base currency and/or the owner's country of tax residency (owner-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberInfo" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberRequest" }
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/members/{userId}:
    patch:
      operationId: updateMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Accounts with latest balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountWithBalance" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}:
    patch:
      operationId: updateAccount
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveAccount
      description: Archives the account (soft delete).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archived }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/balance:
    put:
      operationId: setAccountBalance
      description: Sets a manual balance mark for a date (upsert per account+date).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBalanceRequest" }
      responses:
        "200":
          description: Account with the new latest balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Per-currency totals over active accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments:
    get:
      operationId: searchInstruments
      description: >-
        The instrument catalog, ordered by name, one page at a time. An absent
        or empty `query` lists the whole catalog; a non-empty one keeps the rows
        whose name, ticker or ISIN contains it, case-insensitively.


        IT IS PAGED BY `offset`, AND UNTIL #104 IT WAS NOT. The endpoint took a
        `limit` alone, so the catalog past the ceiling could not be reached by
        any request at all — the interface offered a text search and nothing
        else, and an instrument nobody remembered the name of was simply not
        there. The order is total (name, then id), so consecutive offsets
        partition the catalog with nothing repeated and nothing skipped even
        when two instruments share a name.


        A LIMIT ABOVE THE `maximum` BELOW IS REFUSED WITH 400, NOT QUIETLY
        REDUCED, the same as the two paged endpoints of the importer and for the
        same reason (#118): a ceiling the document states and the server does not
        apply is not a rule, and a client that sent 250 would be answered as
        though it had asked for 200 with nothing in the answer saying so.
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the catalog, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstrumentRequest" }
      responses:
        "201":
          description: Created instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}:
    patch:
      operationId: updateInstrument
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInstrumentRequest" }
      responses:
        "200":
          description: Updated instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/operations:
    get:
      operationId: listAccountOperations
      description: >-
        One account's journal, newest first, one page at a time.


        A `limit` OR AN `offset` OUTSIDE THE BOUNDS BELOW IS REFUSED WITH 400,
        NOT QUIETLY REPLACED. Until #118 this endpoint clamped an over-large
        limit to the ceiling and silently ignored everything else it could not
        read — a zero, a negative, a word — falling back to the default and
        answering 200 as though the number sent had been the number applied.
        The ceiling in particular was stated in this document and not applied by
        the server, which made it a description of nothing: a schema-aware
        client refused to send `limit=250` while the server would have answered
        it. That silence is also the ground #86 stood on, and the `has_more`
        flag treated the symptom rather than this. The bounds are now the same
        rule at both ends of the wire, and they are the same rule the instrument
        catalog applies, for the same reason.


        A limit AT the ceiling is accepted: these bounds are refused past, not
        at.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the account's journal, newest first, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operations:
    post:
      operationId: createOperation
      description: >-
        Records one journal entry. The account's WHOLE journal is replayed with the new row
        through the portfolio engine, and the row is kept only if the result computes.


        409 SAYS THAT REPLAY REFUSED, AND NOTHING FINER. Unrelated causes arrive as this one
        status: a sell or transfer_out releasing more than the account holds; an operation
        whose currency is not the one that position's cost, quantity and fees are already kept
        in (only a dividend, a coupon or a tax may arrive in another); a transfer whose stored
        FIFO breakdown no longer matches the history it is replayed against; a position's
        income total leaving the int64 range. THE REFUSED ROW NEED NOT BE THE ROW POSTED,
        since every stored row is folded again on every write — a buy releases nothing and is
        still answered 409 over an entry recorded months earlier, on a date this request never
        carried. So a client may not caption this status with a cause, nor with anything about
        the request it just sent. The body carries the engine's own English explanation, which
        is written for a log and is not part of this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/transfer:
    post:
      operationId: createTransfer
      description: >-
        Creates a linked transfer_out/transfer_in pair moving instrument quantity between
        accounts with FIFO cost-basis carryover. Both accounts' journals are replayed, and its
        409 means what POST /api/v1/operations' does — that a replay refused, with no way to
        tell which of that status's several causes it was, nor which account's row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Created pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}:
    delete:
      operationId: deleteOperation
      description: >-
        Deletes the operation (whole pair for transfers). Rejected with 409 if the remaining
        journal no longer replays — an oversell is one cause of that and not the only one, see
        POST /api/v1/operations — and rejected outright when `source` is not `manual`:
        an imported operation belongs to the importer, which would write it back on its next
        rebuild, so "deleted" would be a lie. Retire such an operation by deleting its
        connection instead — that stops the updates and leaves the history in place.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/positions:
    get:
      operationId: listAccountPositions
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Open positions computed from the journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/token-check:
    post:
      operationId: checkTinvestToken
      description: >-
        Asks the broker which of the caller's T-Invest accounts a read-only
        token can see, so the owner can pick the ones to import before anything
        is stored. NOTHING IS WRITTEN BY THIS CALL: the token is used for the
        one request to the broker and dropped, so a token typed here and never
        confirmed leaves no trace.


        OWNER-ONLY, like every path under /api/v1/tinvest. The check lives in
        the service rather than in the route, so an editor and a viewer both get
        403 here exactly as they do on the writes below.


        502 means the broker could not be reached, or answered with something
        this server could not use. 400 covers the two ways a token can be no
        good: one this server refuses before sending it anywhere (an empty
        string is the only such case) and one the broker itself refused. Those
        are different news from a 502 — one is worth retrying, the other needs a
        different token — and the status code is the only place that difference
        is stated, since the error text is prose a client must not read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TinvestTokenCheckRequest" }
      responses:
        "200":
          description: The importable accounts this token can see
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestTokenCheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections:
    get:
      operationId: listTinvestConnections
      description: >-
        Every T-Invest connection of the caller's space. Owner-only.
      responses:
        "200":
          description: The space's connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnectionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTinvestConnection
      description: >-
        Connects a broker token and starts the first import. Owner-only.


        ONE REQUEST DOES THREE THINGS. For each broker account picked it creates
        a NEW babki account to import into — never an existing one, so nothing
        hand-entered is ever mixed with imported history — then ties the two
        together, and finally queues the first sync, which is what actually goes
        and reads the history. The response therefore describes a connection
        whose accounts are still empty; the run log (GET
        /api/v1/tinvest/connections/{connectionId}/runs) is where the import
        itself becomes visible.


        THE ACCOUNTS IT CREATES ARE RUBLE BROKERAGE ACCOUNTS AT «Т-Банк», and
        the currency is load-bearing rather than a default: after every
        successful sync the reconciliation writes the broker's own ruble balance
        onto the account as a balance mark, and it refuses to write that mark
        onto an account kept in any other currency.


        The token is checked against the broker before anything is written, so a
        token the broker refuses creates nothing (400). A broker account already
        imported by another connection of this space is refused too (409):
        importing one broker account twice would produce two babki accounts
        holding the same operations.


        422 AND NOT 400 WHEN A PICKED BROKER ACCOUNT IS NOT ONE THIS TOKEN CAN
        IMPORT — the token works and the request is well formed, but the account
        list the broker answered with does not hold what was picked, or holds it
        as a kind this program does not import. THIS CALL ASKS FOR THAT LIST
        AFRESH, so it can differ from the one POST /api/v1/tinvest/token-check
        returned a minute earlier: an account closed in between, or a token
        whose access was narrowed, is enough. Sharing 400 with a refused token
        would leave a client no way to tell the two apart, and the sentence it
        would then show — check the token, it may be truncated or expired —
        sends the owner to re-issue a token that never stopped working. 400 on
        this path stays what it has always been: the token, or the request's own
        shape.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTinvestConnectionRequest" }
      responses:
        "201":
          description: The connection, its linked accounts, and a queued first sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}:
    get:
      operationId: getTinvestConnection
      description: One connection of the caller's space. Owner-only.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTinvestConnection
      description: >-
        Replaces the connection's token, switches it on or off, or both.
        Owner-only.


        A NEW TOKEN IS CHECKED AGAINST THE BROKER BEFORE IT IS STORED, and a
        connection parked at `token_revoked` comes back to `active` on a token
        the broker accepts — that acceptance is the only evidence a token works,
        and pasting one is not evidence of anything. A `status` sent in the same
        request wins over that, so a token can be replaced without switching the
        connection on.


        `status` accepts only `active` and `disabled`. `token_revoked` is the
        server's own verdict, reached by asking the broker; a client that could
        set it would be able to state a fact nobody checked.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTinvestConnectionRequest" }
      responses:
        "200":
          description: The updated connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTinvestConnection
      description: >-
        Withdraws the connection to the broker. Owner-only.


        THE ACCOUNTS AND THE OPERATIONS STAY. What goes is everything about the
        connection itself — the stored token, the links, the mirror of what the
        broker said, the instrument map and the run log. The babki accounts it
        created and the journal operations the import wrote into them are the
        owner's data and are left exactly as they are; they simply stop being
        updated.


        AND NOTHING HERE OFFERS A WAY TO REMOVE THEM AFTERWARDS, which this
        description used to promise. An account is ARCHIVED and never deleted
        (archiveAccount is the only endpoint that retires one), and an imported
        operation cannot be deleted at all: deleteOperation refuses every row
        whose `source` is not `manual`. Withdrawing the connection is therefore
        the end of the matter, not the first half of it.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disconnected; the accounts and their operations remain }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/sync:
    post:
      operationId: syncTinvestConnection
      description: >-
        Asks for this connection to be synced now. Owner-only.


        202 AND NOT 200: the sync is queued, not performed. The same queue and
        the same uniqueness the hourly schedule uses, so a manual request and a
        scheduled one can never run over one connection at the same time — see
        TinvestSyncAcceptedResponse.queued for what happens when one is already
        there.


        409 when the connection is not `active`: a disabled connection is
        skipped by the scheduler too, and one at `token_revoked` has no working
        token to sync with. Both need an act from the owner (PATCH) rather than
        a retry.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Queued, or already in the queue — see `queued`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestSyncAcceptedResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/runs:
    get:
      operationId: listTinvestSyncRuns
      description: >-
        The connection's sync log, newest first, one page at a time.
        Owner-only.


        A LIMIT ABOVE THE `maximum` BELOW IS REFUSED WITH 400, NOT QUIETLY
        REDUCED. A ceiling the document states and the server does not apply is
        not a rule at all (#118): the request would be answered as if it had
        asked for something else, with nothing in the answer saying that the
        number it sent was not the number applied.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the run log, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestSyncRunsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/unparsed:
    get:
      operationId: listTinvestUnparsedOperations
      description: >-
        The connection's broker operations that this program could not turn into
        journal entries, newest first, one page at a time. Owner-only.


        THEY ARE NOT LOST AND NOT HIDDEN: each carries the broker's own record
        of the operation, including the raw element it sent, and a code saying
        why the projection refused it. A limit above the maximum is refused with
        400, for the reason the run log gives.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the unparsed operations, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestUnparsedResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SetupStatus:
      type: object
      required: [setup_needed]
      properties:
        setup_needed: { type: boolean }
    SetupRequest:
      type: object
      description: "Creates the first user, the space and the owner membership, and only while the instance has no users at all — a second call is a 409. The four rules below are the ones internal/family/auth.go, Setup applies, and each of them is a 400."
      required: [space_name, username, display_name, password]
      properties:
        space_name:
          type: string
          minLength: 1
          description: "What to call the space. Refused EMPTY and nothing more: a name of one character is accepted, and so is one made of nothing but blanks — the server compares against \"\" and does not trim. The floor is declared because a client validating against this document should not have to send a request to learn that \"\" is not a name; the absence of a ceiling and of a shape is equally deliberate, since the server checks neither."
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          description: "Lowercase letters, digits and underscore, three to thirty-two of them. That is the WHOLE rule (family.UsernamePattern, applied in validateCredentials), and it is applied at both doors that create a user — here and on CreateMemberRequest — so the pattern is declared at both. Anything else is a 400. Taken already is a 409 rather than a 400: the name is well formed, the conflict is with a row that exists. NOT DECLARED ON LoginRequest, which checks no shape at all — see it."
        display_name:
          type: string
          minLength: 1
          description: "What to call the person. Same rule and same reasoning as space_name above: refused empty, not trimmed, no ceiling and no shape."
        password:
          type: string
          minLength: 8
          description: "At least eight CHARACTERS, counted as Unicode code points — which is what `minLength` counts here and what the server counts now. It used to count BYTES while its own refusal said «characters», so a seven-letter Cyrillic password was fourteen bytes and went through, and this document could not state the rule without stating one stricter than the code (#117). The count moved to code points rather than the sentence to bytes, because the sentence is what the person reads. No ceiling is declared because none is checked; the request body as a whole stops at 1 MB, answered 413. NOT DECLARED ON LoginRequest, which checks no length at all — see it."
    LoginRequest:
      type: object
      description: >-
        NEITHER FIELD CARRIES THE RULE ITS TWIN ON SetupRequest CARRIES, and
        that is the point of this schema rather than an omission. Login reads
        the username straight out of the table and compares the password
        against the hash it finds (internal/family/auth.go, Login); no shape and
        no length is judged, and every failure — a malformed name, a name
        nobody has, a wrong password — comes back as the same 401, on purpose,
        so that a caller cannot enumerate users by the answers it gets.

        A `pattern` or a `minLength` here would therefore describe a refusal
        that does not exist, and it would do real harm rather than merely be
        untrue. The password's own count changed with #117 — from bytes to
        code points — so a password accepted at setup as fourteen bytes of
        seven Cyrillic letters is a password `minLength: 8` now describes as
        too short. Declared here, it would lock that user out through his own
        client while the server stood ready to let him in. This document states
        what the server checks, and on this path it checks nothing.
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    UserInfo:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SessionInfo:
      type: object
      required: [user, role, space_id, space_name, base_currency, tax_residency, cost_basis_rules]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        role: { $ref: "#/components/schemas/Role" }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        base_currency: { type: string, description: "ISO-4217, e.g. RUB" }
        tax_residency:
          type: string
          description: "The OWNER'S country of tax residency, ISO 3166-1 alpha-2 (e.g. RU). A property of the person, not of an account: a Russian resident declares a foreign broker's account by Russian rules too, so it is set once per space and applies to every account in it. Defaults to RU."
        cost_basis_rules:
          description: >-
            What tax_residency implies for the cost basis figures this
            application computes. Carried in the session so the settings screen
            can state the consequence of the country the owner picked; the same
            object is repeated on PositionsResponse so the screen showing the
            figures carries the caveat with them.

            THIS IS THE STATEMENT OF RECORD, AND IT IS A PROPERTY OF THE SPACE
            RATHER THAN OF ANY ONE PAYLOAD. It qualifies EVERY cost basis this
            API publishes, wherever the figure appears — not only the ones on
            PositionsResponse. The journal has one of its own: a transfer's
            `Operation.amount_minor` (and its `in_base` twin) is the cost basis
            of the shares moved, picked by the very same queue of earliest
            purchases that produces Position.cost_minor, so it is a figure this
            object speaks about. GET /accounts/{accountId}/operations does
            not repeat it, and now does so as a choice rather than for want of
            anywhere to put it: OperationsResponse has been an envelope since
            #86, and this statement is still not in it, because one truth
            published in three places is two more places to forget when the
            truth changes. A client therefore reads this once, from the session
            it loads anyway, and applies it to every cost basis it renders —
            including the journal's, which otherwise shows a FIFO-derived
            amount with nothing said about it.
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
    UpdateSpaceRequest:
      type: object
      description: "Partial update of the space. Every field is optional and an omitted field is left unchanged, but at least one must be present — an empty body is rejected rather than silently accepted as a no-op. minProperties enforces that in the schema itself, not only in this description, so a schema-aware client can reject an empty body without a round trip."
      minProperties: 1
      properties:
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. Changing it changes the currency every converted figure in this API is published in; nothing stored is rewritten, since those figures are computed on the way out."
        tax_residency:
          type: string
          description: "ISO 3166-1 alpha-2 uppercase, e.g. RU. Must be one of the countries this application has cost basis rules for (GET /api/v1/tax-residencies lists them); anything else is a 400. An unrecognised code is never accepted and quietly treated as Russia — that silent substitution is the exact failure this field exists to prevent."
    CostBasisMethod:
      type: string
      description: "How a jurisdiction decides WHICH of the parcels held are the ones a sale disposed of. `fifo`: the earliest acquisitions, in order. `average`: no parcels at all — one pooled average cost per instrument. `specific_lot`: the taxpayer nominates the parcel. `not_applicable`: the country does not tax an individual's capital gains, so nothing has to be matched. `unknown`: the stored country has no rules row in this application (see CostBasisNotice.unknown_country)."
      enum: [fifo, average, specific_lot, not_applicable, unknown]
    CostBasisPerimeter:
      type: string
      description: "Over WHICH holdings that queue is built. `account`: separately per account/depot. `owner`: across everything the owner holds, wherever it sits — representable here but NOT implemented; a country carrying it is reported as unsupported. `not_applicable`: no queue exists to scope (the taxpayer picks the parcel, or gains are untaxed). `unknown`: no rules row for the stored country."
      enum: [account, owner, not_applicable, unknown]
    CostBasisNotice:
      type: string
      description: "One way this application's computation fails to answer for the owner's country. Machine-readable on purpose: the wording the owner reads is the interface's to translate, and the server never sends prose. `method_mismatch`: the country matches disposals by a different method, so the figures are NOT a cost basis under its rules. `perimeter_mismatch`: the queue must span more than one account. `not_taxed`: the country does not tax an individual's capital gains at all, so the figures are informational rather than fiscal. `unknown_country`: the stored country has no rules row here, so nothing is claimed about it — the figures are still FIFO within one account, which is what they always are. `unverified_rule`: the row's method and perimeter were not traced to an established norm during jurisdiction research — they are an assumption by analogy, not a checked rule, even when they happen to read fifo/account."
      enum: [method_mismatch, perimeter_mismatch, not_taxed, unknown_country, unverified_rule]
    CostBasisRules:
      type: object
      description: "The cost basis rules of one country, derived from its ISO 3166-1 alpha-2 code through a single table in the server. The figures this application publishes are ALWAYS computed FIFO within one account; this object says whether that is what the country actually requires, and names every way it is not."
      required: [country, method, perimeter, supported, notices]
      properties:
        country: { type: string, description: "ISO 3166-1 alpha-2 the row was derived from" }
        method: { $ref: "#/components/schemas/CostBasisMethod" }
        perimeter: { $ref: "#/components/schemas/CostBasisPerimeter" }
        supported:
          type: boolean
          description: "True only when this country's method and perimeter are exactly what the application computes — FIFO within one account — and the country taxes capital gains at all. When false, `notices` is non-empty and says why; the figures are still returned, because a cost basis is also plainly \"what I paid\", but they must not be presented as this country's tax basis."
        notices:
          type: array
          items: { $ref: "#/components/schemas/CostBasisNotice" }
          description: "Empty exactly when `supported` is true. Several can apply at once (Britain pools by average AND across all of the owner's holdings) and all of them are listed: reporting only the first would hide a real divergence behind another one."
    Role:
      type: string
      enum: [owner, editor, viewer]
    MemberInfo:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    CreateMemberRequest:
      type: object
      description: "Adds a family member. Owner-only (403 otherwise). The three rules below are the second door user credentials are written through — internal/family/auth.go, CreateMember — and each of them is the same rule Setup applies, which is why each is declared in both places."
      required: [username, display_name, password, role]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          description: "Same rule as SetupRequest.username — see it, including why LoginRequest carries none."
        display_name:
          type: string
          minLength: 1
          description: "What to call the person. Refused EMPTY and nothing more: the server compares against \"\" and does not trim, so a name of nothing but blanks is accepted here even though the member dialog's own Save button will not offer it."
        password:
          type: string
          minLength: 8
          description: "Same rule as SetupRequest.password — see it, including why the count is in code points and why LoginRequest carries none."
        role: { $ref: "#/components/schemas/Role" }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AccountType:
      type: string
      enum: [brokerage, checking, savings, deposit, credit_card, loan, cash]
    AccountStatus:
      type: string
      enum: [active, archived]
    AccountWithBalance:
      type: object
      required: [id, name, type, currency, institution, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string }
        institution: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        created_at: { type: string, format: date-time }
        balance: { $ref: "#/components/schemas/BalancePoint" }
        balance_in_base:
          nullable: true
          description: "Account's balance converted into the space's base currency at today's fx rate. Null when the account has no balance, its currency already equals base_currency (nothing to convert), or no fx rate could be resolved."
          allOf:
            - $ref: "#/components/schemas/MoneyInBase"
    BalancePoint:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    MoneyInBase:
      type: object
      required: [amount_minor, currency, rate_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Amount in the base currency's minor units" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the fx rate actually used for this conversion" }
    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name:
          type: string
          minLength: 1
          description: "What to call the account. Refused EMPTY and nothing more (internal/account/http.go, handleCreate): the server compares against \"\" and does not trim, so a name of nothing but blanks is accepted. The floor is stated because a client validating against this document should not need a round trip to learn that \"\" is not a name; no ceiling and no shape are stated because the server checks neither."
        type: { $ref: "#/components/schemas/AccountType" }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. It cannot be changed afterwards — UpdateAccountRequest carries no currency — because the balance marks recorded against the account carry no currency of their own and are denominated in this one."
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: "Same rule as on creation — refused empty, not trimmed (internal/account/http.go, handleUpdate). OMITTING the field leaves the name as it stands; that is what a PATCH does with a field it does not carry, and it is a different thing from sending \"\", which is the refusal this floor states."
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AccountStatus" }
    SetBalanceRequest:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor:
          type: integer
          format: int64
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: "Negative for a debt: a credit card or a loan carries what is owed as a negative balance. Bounded at ±10^15 minor units — ten trillion whole roubles or dollars — the SAME cap CreateOperationRequest.amount_minor carries, because it is the same money in the same currency on the same screen. Past it, 400. The bound is far above any real balance and far enough below int64 that the accounts screen can still convert what it accepts: at the largest balance taken here an fx rate of up to ~9223 still fits in an int64 of minor units, which is above any rate this program will meet. A balance that cannot be converted is not a wrong figure on the screen — the server refuses to publish one — it is an accounts list that cannot be drawn at all until the row is overwritten, which is why the refusal is at the write. Rows written before the bound existed are untouched and are still returned as they stand."
    CurrencyTotal:
      type: object
      required: [currency, assets_minor, liabilities_minor, net_minor]
      properties:
        currency: { type: string }
        assets_minor: { type: integer, format: int64 }
        liabilities_minor: { type: integer, format: int64, description: "Negative or zero" }
        net_minor: { type: integer, format: int64 }
    Summary:
      type: object
      required: [totals, base_currency, unconverted]
      properties:
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        base_currency: { type: string, description: "ISO-4217, from the space; e.g. RUB" }
        total_in_base_minor:
          type: integer
          format: int64
          nullable: true
          description: "Sum of totals[].net_minor converted using the latest FX rate on or before today; null only if none of the currencies could be converted"
        unconverted:
          type: array
          items: { type: string }
          description: "Currencies from totals that had no fx rate available and were excluded from total_in_base_minor; empty if all converted"
        rates_on:
          type: string
          nullable: true
          description: "Oldest FX rate date used for the conversion; null if nothing was converted"
    InstrumentType:
      type: string
      enum: [share, bond, etf, currency, crypto, metal, custom]
    Instrument:
      type: object
      required: [id, type, name, ticker, isin, figi, currency, frozen]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: "What one bond is worth at redemption, in face_currency's minor units. Null for a bond whose face value has not been recorded, and null for anything that is not a bond — the writes refuse the pair on every other type, since a bond is the one instrument whose quote is a percentage of face and the only one for which this field answers anything (see the same field on CreateInstrumentRequest). Rows written before that rule are returned exactly as they stand: no migration clears them, because a face value on a share makes no published figure wrong — a share is valued at the quote's price per unit and this field is never read for one — and discarding a number somebody entered is not a migration's decision. Clearing the pair through PATCH is the repair, and it stays available on any type. Never zero, never negative, and never present without face_currency: the two are written together or not at all, and the writes enforce it (see the same field on CreateInstrumentRequest). Both are backed by the CHECK constraint migration 0012 added on this column, which is why `minimum: 1` above is a guarantee about every row already stored, not merely about what a future write will accept. There is no `maximum` here on purpose: the write doors also refuse a face value too large, because one large enough overflows the very valuation it prices (portfolio.marketValue) and leaves the position unreadable — but that ceiling is a write-time check with no CHECK constraint behind it, so, unlike the floor, it is not a claim this response can make about a row already stored. The same line is already drawn for money elsewhere in this document: SetBalanceRequest.amount_minor carries a maximum and BalancePoint.amount_minor, the same figure coming back, carries none."
        face_currency:
          type: string
          nullable: true
          minLength: 1
          description: "The currency face_value_minor is denominated in, which need not be the instrument's own currency. Null exactly when face_value_minor is null — see it. NEVER AN EMPTY STRING, and that is a promise about every row already stored rather than about the next write: a CHECK constraint keeps '' out of this column (migration 0012), which is what makes `minLength: 1` above true of the whole table. It matters because '' does not look like a missing value — it satisfies a presence check and a NOT NULL alike while denominating the face value in nothing, and the valuation then comes back as a bare number with no currency on it. THE ISO-4217 SHAPE IS NOT DECLARED HERE, and the omission is the rule rather than an oversight (#119). Every writer does enforce it — the two HTTP doors (checkFacePair / checkFaceUpdate) and the T-Invest resolver, which creates catalog rows against the store with no handler on its path — but each enforces it separately, no such check predates #93, and migration 0012 states in as many words that it deliberately leaves the SHAPE to the writers and constrains only the emptiness. A row written earlier as \"rub\" would still be published from this field, and one writer losing the check tomorrow would put a fresh one there. A `pattern` on a request field says what the server will refuse today; the same `pattern` on a response field says no row this API can publish has any other shape, and that is a claim about the database, which nothing here backs. The line is the one already drawn on face_value_minor beside this field, which keeps `minimum: 1` because the same constraint backs it and drops the `maximum` its own write door enforces — and the one drawn for money, where SetBalanceRequest.amount_minor carries the cap and BalancePoint.amount_minor, the same figure coming back, carries none. Where a response CAN make such a claim it does: Operation.source is enumerated precisely because a CHECK constraint closes that column's set."
        frozen: { type: boolean }
    InstrumentsResponse:
      type: object
      required: [instruments, has_more]
      description: "One page of the instrument catalog. It used to be a bare array, and the endpoint took no `offset` at all: past the ceiling the catalog was unreachable by any request that could be made, and a client had no way to tell a whole catalog from a clamped one either (#104). Both halves are gone — `offset` continues the listing, and `has_more` says whether there is anything to continue to."
      properties:
        instruments:
          type: array
          items: { $ref: "#/components/schemas/Instrument" }
          description: "The page itself, ordered by name, at most `limit` long. Shorter than `limit` only at the end of the catalog: an over-large `limit` is refused rather than clamped here, so a short page has one meaning."
        has_more:
          type: boolean
          description: "Whether the catalog holds at least one more instrument beyond this page — i.e. at `offset + len(instruments)` and later. The server's to answer, and fetched rather than inferred: one row beyond the page is asked for and its arrival IS this answer, after which a statement of its own trims that row away so nothing downstream can mistake it for part of the page. A flag rather than a total, for the reason OperationsResponse.has_more gives. False on an empty page, which is the end of the catalog (or past it)."
    CreateInstrumentRequest:
      type: object
      required: [type, name, currency]
      properties:
        type: { $ref: "#/components/schemas/InstrumentType" }
        name:
          type: string
          minLength: 1
          description: "What to call the instrument. Refused EMPTY and nothing more (internal/instrument/http.go, handleCreate): the server compares against \"\" and does not trim. Same floor and same reasoning as CreateAccountRequest.name — see it."
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB: the currency the instrument's own figures are denominated in, which is not necessarily face_currency below. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. It cannot be changed afterwards — UpdateInstrumentRequest carries no currency."
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 1000000000000000
          description: "A bond's face value in face_currency's minor units. Only `type: bond` may carry one: sending either half with any other type is a 400 naming the type that was sent, because an exchange quotes a bond as a PERCENTAGE of face while every other instrument this program prices is quoted in money already, so the field answers nothing on them. Must be POSITIVE, no larger than ten trillion minor units, and must be given TOGETHER with face_currency — both set, or neither. Past any rule, 400 naming the field. Zero is refused rather than stored because an exchange quotes a bond as a percentage of face: a face value of zero turns every price into no money at all, and the position it values into 0,00. The upper bound is the same cap every other money field in this API is written against (see amount_minor on SetBalanceRequest): far above any bond ever issued, and far enough below an int64's own range that multiplying it by a price and a quantity (portfolio.marketValue) cannot by itself be the reason a position's valuation overflows. A bond may be created without a face value; it simply cannot be priced until one is recorded."
        face_currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
          description: "The currency face_value_minor is denominated in: an ISO-4217 code in uppercase, and the pattern is enforced, not merely described. An empty string is refused with 400 like any other non-code — it passes a presence check and a NOT NULL alike while denominating the face value in nothing, which leaves a bond priced as a bare number with no currency beside it. Given together with face_value_minor or not at all, and on `type: bond` alone — see it."
    UpdateInstrumentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: "Same rule as on creation — refused empty, not trimmed (internal/instrument/http.go, handleUpdate). Omitting the field leaves the name as it stands; see UpdateAccountRequest.name."
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        frozen: { type: boolean }
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 1000000000000000
          description: "Same rules as on creation, with one addition and one difference. The addition: the bond-only rule is judged against the STORED instrument, since a PATCH carries no type and nothing in this API can change one — setting either half on a row that is not a bond is a 400 naming that row's type, while CLEARING the pair (two nulls) is allowed on any type and is how a face value recorded before that rule is taken back. This is the one place the endpoint reads the row before writing it, and it is not raced: a type is not a column any writer in this program can change, so what this read sees is what the write will land on. The difference is the mention rule, which applies to the REQUEST rather than to the row it lands on: to touch either half of the pair, send both — either two values, or two nulls to clear the pair. Sending one alone is refused even when the stored row would make the result well formed, so that an accepted PATCH always leaves the pair whole without this endpoint having to read the PAIR itself and race a concurrent write over it — unlike the type above, the pair is judged from the request alone and the row's own two columns are never read for this rule. That refusal carries a sentence of its own — `face_value_minor and face_currency must be sent together, even to change one` — because creation's `set together or not at all` is true of the stored row both before such a PATCH and after it, and so names nothing the client could do about it. Omitting both leaves the pair exactly as it was."
        face_currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
          description: "The currency face_value_minor is denominated in: an ISO-4217 code in uppercase, enforced as on creation — an empty string comes back 400, not stored. Sent together with face_value_minor or not at all, and set only on an instrument that is stored as a bond — see it."
    OperationType:
      type: string
      description: "What the entry is. `redemption` deserves a note of its own: it is a bond reaching maturity, and it is ARITHMETICALLY A SALE — the paper leaves, the money arrives, the earliest-purchases-first queue gives up the basis those bonds carried — so every figure derived from it (realized profit, remaining cost, quantity) is computed by the same rule a `sell` is, and НК РФ ст. 214.1 names the two together, «реализации (погашения)». It is a separate value because it is a different EVENT: nobody sold anything, the bond ran out, and the journal already named the partial repayment separately as `amortization`, which left the full one the only disposal wearing another name. A client may group the two wherever it groups disposals; what it must not do is call one the other on screen."
      enum: [buy, sell, redemption, deposit, withdrawal, dividend, coupon, amortization, fee, tax, transfer_in, transfer_out, split, interest, conversion]
    Operation:
      type: object
      required: [id, account_id, type, occurred_on, amount_minor, currency, fee_minor, note, source, created_at, has_undated_lots, assembled_from_lots]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true, description: "Date YYYY-MM-DD" }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price:
          type: string
          nullable: true
          description: "Decimal as string: money per unit, denominated in THIS OPERATION'S OWN `currency` — the same currency `amount_minor` and `fee_minor` carry, and never the space's base currency. It is an ANNOTATION rather than a term of any computation: nothing values a trade from it (the engine reads `amount_minor`), so it is never converted and no display-currency mode touches it. That is precisely why a client drawing it beside converted amounts has to name `currency` on the number itself rather than let the neighbouring figures speak for it — in the base-currency mode those figures are roubles while this one is still dollars, and a bare number was read off them (#114). WHERE THE CLAIM COMES FROM, since the column stores no currency of its own: a manually written operation is held to it — `price` × `quantity` is bounded as the same money `amount_minor` is, see CreateOperationRequest.quantity — while the T-Invest import ASSUMES it and names the assumption, the broker sending a price with a currency of its own that the mirror keeps no column for (see tradePrice in internal/importer/tinvest/projection.go)."
        amount_minor:
          type: integer
          format: int64
          description: "The operation's own amount in `currency`, sign preserved — an outflow stays negative. For every ordinary row it is money that moved on `occurred_on` and owes nothing to any cost basis rule. A transfer_in/transfer_out is the exception and it matters here: its amount is the COST BASIS of the shares moved, carried over from the source account by the earliest-purchases-first queue this application computes — the same rule and the same queue behind Position.cost_minor. Whether that queue is the one the owner's country requires is published once per space, on SessionInfo.cost_basis_rules, and deliberately NOT repeated on this listing (see that field for why). A client rendering this figure without reading it shows an unqualified cost basis in the journal however carefully it qualified the same shares on the positions screen. WITH ONE EXCEPTION INSIDE THE EXCEPTION: a transfer whose basis was GIVEN BY HAND (TransferRequest.cost_minor) was produced by no queue at all. Both of its legs carry the hand-entered figure, and the source account gives up the basis its own queue holds for those shares, which need not be that number and usually is not — the two legs are deliberately not reconciled, because the person said what the parcel was worth and the journal does not contradict them. So on such a pair this figure is the basis the shares ARRIVE with and not a statement about what left, and the family's total basis can change across such a transfer, by design. `has_undated_lots` is true on both legs, since a hand-entered basis has no purchase dates behind it — but it does not single this case out, being equally true of a transfer recorded before breakdowns were kept and of one whose breakdown carries a dateless piece; what those three share is exactly what the flag says, that the amount's purchase dates are not all known."
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        transfer_group_id: { type: string, format: uuid, nullable: true }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
        source:
          type: string
          enum: [manual, csv, tinvest]
          description: "Who wrote this row. `manual` is a person, through this API; anything else is an importer, and the set is closed by a CHECK constraint on the column rather than only by the code that writes it, which is why it is enumerated on a response at all. It is not decoration: an operation whose source is not `manual` cannot be deleted (see deleteOperation) because the importer that owns it would write it back on its next rebuild, so a client must not offer a delete control on such a row."
        created_at: { type: string, format: date-time }
        has_undated_lots:
          type: boolean
          description: "True when this operation's amount_minor is a cost basis whose purchase dates are not all known: an in-kind transfer whose per-lot breakdown was never recorded (a basis given by hand, or one predating breakdowns), or one whose breakdown contains at least one dateless piece — shares that reached it through an earlier undated transfer. Both legs of such a pair answer the same way; they describe one parcel. False for every ordinary operation, whose amount belongs to the day it happened and needs no purchase date at all. This is the journal's twin of Position.has_undated_lots and exists for the identical reason: in_base being null has several causes, and they are not the same news to the person reading the row. A missing fx rate is a gap the backfill job closes on its own and the figure appears later; an unrecorded purchase date never resolves, because nobody wrote it down and nothing can recover it. Here the distinction is sharper still than on a position: a transfer's own date usually DOES have a rate — the demo instance has one for every transfer it records — so a client saying \"no rate for this date\" about such a row does not merely fail to explain it, it states something false, and promises a figure that will never arrive. `in_base_gap` draws the same line finer, separating a missing rate for the operation's own date from one for a purchase date, and is the field to caption a journal row with; this one remains the standing fact about the operation, published on the create and transfer responses too, where nothing was ever converted and no gap is published at all. Always present, never inferred by the reader from in_base being null. It changes nothing about the figures: an unknown purchase date costs no money and no shares, and amount_minor and fee_minor are published in the operation's own currency exactly as usual. Together with assembled_from_lots, published alongside it on this same object, the two fields answer completely for whether amount_minor is a cost basis at all: a full, dated breakdown makes assembled_from_lots true, a missing or partial one makes this field true, and a breakdown with one dateless piece among dated ones makes both true at once. Neither field ever needs the other to make sense of it, and neither depends on in_base — a client that reads only in_base for this answer will miss every case where the breakdown could not be converted, which is the bug both fields exist to prevent."
        assembled_from_lots:
          type: boolean
          description: "True when amount_minor is a cost basis assembled piece by piece from the purchases behind it, each acquired on its own day, rather than money that moved on occurred_on itself — a statement about how the FIGURE was arrived at, not about whether it was converted into the base currency. Set from the presence of a stored per-lot breakdown (see TransferLots / Store.attachTransferLots): true for a transfer_in/transfer_out whose parcel carries one, whether or not every piece in it has a purchase date and whether or not in_base exists for this row at all. False for every ordinary operation, which never carries a breakdown, and for a transfer given a hand-typed basis (or one recorded before breakdowns were kept), which has no breakdown to assemble from — has_undated_lots is what answers for that parcel instead. Both legs of a transfer pair answer the same way; they describe one parcel. This is also what OperationInBase.rate_on reads to decide whether it names the single rate behind amount_minor or merely the newest of several — see that field. It used to live on OperationInBase alone, which made it disappear exactly when the conversion block did: a transfer already denominated in the base currency, or one whose newest purchase has no fx rate yet, published nothing about how amount_minor was derived even though the breakdown that answers the question sits in the operation itself, entirely independent of whether it could be converted. Moving the flag here, next to has_undated_lots, closes that gap: a reader no longer has to hope a nullable in_base exists before learning what kind of number amount_minor is."
        in_base:
          nullable: true
          description: "amount_minor and fee_minor converted into the space's base currency at the fx rate in effect on occurred_on — the rate of the day the operation happened, NOT today's. This is the deliberate difference from AccountWithBalance.balance_in_base, which answers \"what is this worth now\"; the journal answers \"what did this cost then\". Position.in_base sits between the two: its cost_minor and income_minor follow the same historical rule as this field (each lot at the rate of its acquisition date, each payment at the rate of its own), while only its market_value_minor is a current valuation. Each amount is converted and rounded independently. One exception, and it is the whole point of the rule rather than a break from it: an in-kind transfer between two accounts of the same family carries a cost basis assembled from purchases made on other days, so its amount_minor is converted piece by piece at the rate of the day each piece was bought, and the whole is rounded once (the operation's own assembled_from_lots says when this happened — see that field; it is unaffected by whether this object exists at all). BOTH legs of the pair are converted that way — the departing transfer_out and the arriving transfer_in describe one parcel with one set of purchases behind it, so they publish the same figure and, for the same reason, both fall back to null together when any one of those purchase dates has no rate. Converting either on the transfer's own date would price old shares at the rate of the day they changed brokers and make that row contradict the position built from the very same purchases. Null when `currency` already equals the base currency (nothing to convert), when no fx rate could be resolved for one of the dates it needs nor any earlier one, or when the transfer's parcel — or a piece of it — does not know when it was bought: a basis entered by hand, one recorded before breakdowns were kept, or a breakdown that mixes dated pieces with pieces carried over from an earlier undated transfer, all leave at least one purchase date unknown, and no rate answers for a date nobody recorded (both legs fall back to null together here too, for the identical reason Position.in_base does — see its description). `in_base_gap` says which of those a null is, and says it in the sharpest form the server can: not merely «a rate» but WHICH rate — the operation's own day's or a purchase day's — since a rate that has not been fetched yet, a purchase date nobody ever wrote down, and a purchase date whose rate is missing must not be explained to a reader with the same sentence. `has_undated_lots` answers the same question more coarsely and keeps doing so on the two responses that carry no `in_base` at all. A partially converted operation is never published. Computed only for the journal listing (GET /accounts/{accountId}/operations); create and transfer responses omit the field entirely, since those return an operation the client just submitted rather than a journal to read. An absent field and an explicit null mean the same thing to a reader: there is nothing converted to show. `assembled_from_lots` and `has_undated_lots`, by contrast, are properties of the operation itself and are published on every response that returns one, this object's absence notwithstanding."
          allOf:
            - $ref: "#/components/schemas/OperationInBase"
        in_base_gap:
          nullable: true
          description: "Which term stopped `in_base`, or null when nothing did. Null therefore covers two situations and `currency` tells them apart: either `in_base` is present, or `currency` already equals the space's base currency and there was nothing to convert in the first place — the operation's own amounts ARE the base-currency ones and no «not converted» caption belongs over them at all. Non-null exactly when `in_base` is null and `currency` differs from the base currency. Published wherever `in_base` is, and only there: the journal listing (GET /accounts/{accountId}/operations) computes both, while the create and transfer responses omit both, since those hand back an operation the client just submitted rather than a journal to read. It is the sharper twin of `has_undated_lots`: that one is a standing fact about the operation, published on every response that returns one whether or not there was ever anything to convert, while this one names the term the conversion actually stopped on — and this is the one to caption a row with, since an undated parcel is only the FIRST of three things that can stop it. Before this field existed the screen said «Нет курса на дату операции» over all three, which is false about a parcel whose purchase dates nobody ever recorded, and false again about a transfer whose own date has a perfectly good rate and whose PURCHASE date has none (#79)."
          allOf:
            - $ref: "#/components/schemas/OperationInBaseGap"
    OperationInBaseGap:
      type: string
      enum: [undated_lot, no_rate_operation_date, no_rate_lot_date]
      description: "Which TERM the server could not value, and so why Operation.in_base — the whole object — is absent. It is the journal's twin of InBaseGap and names terms for the same reason that one does: there is exactly one operation here, and the terms are the very figures standing side by side in its row. `undated_lot`: amount_minor is the cost basis of a transferred parcel and at least one piece of that parcel does not know when it was bought — a breakdown that was never recorded (a basis given by hand, or a transfer predating breakdowns) or one carrying a dateless piece inherited from an earlier undated transfer. There is no date to ask the fx table about and none will ever be recovered, because nobody wrote it down. This is the same condition Operation.has_undated_lots reports. `no_rate_operation_date`: amount_minor is money that moved on `occurred_on`, and the fx table holds no rate for that day nor for any earlier one. `no_rate_lot_date`: amount_minor is a cost basis assembled from a stored breakdown whose every piece IS dated, and the fx table holds no rate for one of those PURCHASE days nor for any earlier one. The transfer's own date is not the date at issue and usually has a perfectly good rate — it is simply not a rate that may value shares bought on other days — so a caption naming it would blame a day that had nothing to do with the gap, which is the whole of #79. EXACTLY ONE VALUE IS PUBLISHED, AND THERE IS NO COMBINED VALUE. `undated_lot` is settled before any rate is looked up, so a row that has both an undated piece and a missing rate reports the undated piece: it is the one cause no backfill will ever close, and reporting it never promises a figure that is not coming. The two `no_rate_*` values need no order between them because they cannot both arise on one row: an amount is either money that moved on the operation's own date or a basis assembled from a stored breakdown, never both, so all of its terms are dated the one way or all the other — and `assembled_from_lots` is the field that says which, published on the operation whether or not this gap is."
    OperationInBase:
      type: object
      required: [amount_minor, fee_minor, currency, rate_on, dated_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Operation.amount_minor converted into currency. The sign is preserved — a buy stays negative — and rounding is half-away-from-zero, so converting never shrinks the magnitude of an outflow" }
        fee_minor: { type: integer, format: int64, description: "Operation.fee_minor converted into currency, rounded independently of amount_minor: the two are separate figures, not terms of one total" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of an fx rate ACTUALLY used, which is `dated_on` itself or the nearest earlier date that has a rate (weekend, holiday, provider gap) — never today's date. For a 2019 operation this is a 2019 date; that is what makes this a historical conversion rather than a current valuation. For a transfer converted piece by piece (the operation's own assembled_from_lots is true — see Operation.assembled_from_lots) the figure is struck at several rates and no single date describes it: this then names the newest of them, the rate that values the most recent purchase in the parcel, and never the transfer's own date — that is the one rate deliberately not used. IT IS NOT A DATE ANYTHING HAPPENED ON, and must not be captioned as one: see `dated_on`, which is" }
        dated_on: { type: string, description: "Date YYYY-MM-DD the headline rate was asked FOR — the date this figure is dated, as against `rate_on`, the date the rate that answered actually came from. For an ordinary operation it is `occurred_on`. For a transfer converted piece by piece (assembled_from_lots true) it is the newest PURCHASE date in the parcel, named as itself instead of being read off the rate that happened to value it. IT EXISTS BECAUSE `rate_on` ALONE CANNOT BE READ AS A DATE ANYTHING HAPPENED ON. The CBR publishes nothing at weekends and holidays, so the nearest EARLIER date's rate is resolved instead: a purchase made on a Saturday is converted at Friday's rate, and a caption naming `rate_on` as the purchase date names a day nothing was bought on — roughly a third of the calendar (#80). With both dates published the two cases separate exactly: `rate_on` equal to this field means the rate is that very day's, `rate_on` earlier means it came from an earlier day, and either way the caption has the real date to name. A client that made that comparison against `occurred_on` got the right answer only for an ordinary row — on a transfer it compares a purchase date's rate against the day the paperwork moved, which answers nothing. IT SPEAKS FOR THE HEADLINE RATE ONLY, the one `fee_minor` is struck at. A transfer's amount_minor is summed over one rate per piece, and any of those may equally have come from an earlier day than the purchase it values; none of them is published, and this pair of dates makes no claim about them" }
    CreateOperationRequest:
      type: object
      required: [account_id, type, occurred_on, amount_minor, currency]
      properties:
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD. Held to both ends of a range, and past either it is a 400. NOT IN THE FUTURE, with one day of slack past the UTC day boundary: a date-only field carries no zone, so someone east of UTC must be able to record what they did this evening while the server is still on yesterday. AND NOT EARLIER THAN 1900-01-01, which is a typo guard and not a rule from anywhere — no law, no broker and no data source here names it, and it is in particular not a claim about the earliest date this server can value: an operation dated 1950 is accepted, and whether it can be shown in the base currency is a separate question about which fx rates exist. What the floor catches is a fumbled leading digit (1026 for 2026, one keystroke), which is the one date mistake that is silent rather than visible: the cost basis queue is ordered by acquisition date, so such a row sorts to the FRONT of it and the next sale releases it first, and nothing on any screen remarks on a date being old." }
        settled_on: { type: string, nullable: true }
        quantity: { type: string, nullable: true, description: "Decimal as string. Bounded from above as well as below: |quantity| must not exceed 10^13 (10000000000000) and, when a price is given too, |price × quantity| must not exceed 10^15 minor units — the same cap amount_minor carries, because it is the same money. Past either, 400. The bound is the money cap read as a count of units, one whole major unit apiece, and it is set there so that what the write accepts the positions screen can still value: at 10^13 units a quote of up to ~9223 per unit still fits in an int64 of minor units, which is above an ordinary share, bond or ETF. More than 10^13 units of something worth less than a whole rouble apiece is refused, deliberately — a figure no ordinary price can value is better refused as a field than discovered later by the screen that cannot render it. Rows written before the bound existed are untouched and are still returned as they stand." }
        price: { type: string, nullable: true, description: "Decimal as string: money per unit, in MAJOR currency units. |price| must not exceed 10^13 (10000000000000) — one unit may not cost more than a whole operation is allowed to be for — and see quantity for the bound on the two multiplied together. Past either, 400." }
        amount_minor:
          type: integer
          format: int64
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: "The operation's own amount in `currency`, sign preserved: an outflow is negative. Which sign is required depends on the type — a buy and a withdrawal must be negative, a deposit and a dividend positive, a split exactly 0, a conversion either way — and the wrong one is a 400 naming the type. Bounded at ±10^15 minor units, ten trillion whole roubles or dollars: the SAME cap SetBalanceRequest.amount_minor carries, because it is the same money in the same currency on the same screen — the accounts list sums balances, the journal sums amounts, and both are multiplied by an fx rate before anything is published. Past it, 400. The bound is on the MAGNITUDE, so an outflow is refused at the same size an inflow is. Rows written before the bound existed are untouched and are still returned as they stand."
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400."
        fee_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "What this operation cost to make, in `currency`, as a POSITIVE figure whichever way `amount_minor` went — it is money charged, never money returned. That is why the floor here is 0 rather than the -10^15 the amount gets: a negative fee is refused by a rule of its own. Omitted or 0 means no fee. The ceiling is the same 10^15 minor units the amount stops at, for the same reason — it is money in the same currency on the same row. Past either end, 400."
        note: { type: string }
        split_ratio: { type: string, nullable: true, description: "Decimal as string: how many units one unit becomes. Must be positive and strictly less than 10^10 (10000000000) — the first value the column cannot hold — or 400. A split multiplies the whole position's quantity, so a ratio that is a mis-scaled field rather than a corporate action carries an ordinary holding past what any screen can value; the bound refuses it by name instead of letting the database answer with an overflow." }
    TransferRequest:
      type: object
      required: [from_account_id, to_account_id, instrument_id, quantity, occurred_on]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string. |quantity| must not exceed 10^13 (10000000000000), as on an operation — this writes the same column, on two rows. A position CAN hold more than that, having grown one accepted operation at a time; such a holding has to be moved in several transfers." }
        occurred_on: { type: string, description: "Date YYYY-MM-DD. Held to both ends of a range, and past either it is a 400. NOT IN THE FUTURE, with one day of slack past the UTC day boundary: a date-only field carries no zone, so someone east of UTC must be able to record what they did this evening while the server is still on yesterday. AND NOT EARLIER THAN 1900-01-01, which is a typo guard and not a rule from anywhere — no law, no broker and no data source here names it, and it is in particular not a claim about the earliest date this server can value: an operation dated 1950 is accepted, and whether it can be shown in the base currency is a separate question about which fx rates exist. What the floor catches is a fumbled leading digit (1026 for 2026, one keystroke), which is the one date mistake that is silent rather than visible: the cost basis queue is ordered by acquisition date, so such a row sorts to the FRONT of it and the next sale releases it first, and nothing on any screen remarks on a date being old." }
        cost_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000000000
          description: "Cost basis override; default is FIFO carryover from the source account. A basis is what the shares COST, so it is never negative: the floor is 0 and not the -10^15 an amount gets, and the ceiling is the same 10^15 minor units every other money field here is written against. Past either end, 400. Sending one has a second consequence that is not about its size: a basis given by hand replaces the parcel of purchases the queue would have released, so the shares arrive knowing no acquisition date at all — see Operation.has_undated_lots, which is what such a transfer then reports for good. AND A THIRD, WHICH IS THE ONE TO UNDERSTAND BEFORE SENDING IT: this number is what the shares arrive with, not what departs. The source account still releases its own earliest purchases for the quantity moved and gives up THAT basis, whatever it is; both recorded legs carry the number sent here, so the departing leg's `amount_minor` states the parcel's declared worth rather than the basis the source lost. The two are not reconciled and the family's total basis moves by the difference — which is the point of the field (a parcel arriving from a broker that reported a total and nothing else), and the reason to leave it unset whenever the source's own history is the truth."
        note: { type: string }
    OperationsResponse:
      type: object
      required: [operations, has_more]
      description: "One page of an account's journal. It used to be the bare array `operations` still is, which left a reader no way to tell a complete journal from a truncated one: the server clamped `limit` to its ceiling without saying so, and a client that asked for 250 and counted 200 back concluded there was nothing more. At exactly the ceiling the journal therefore presented itself as whole while hiding everything older, and the interface offered no other route to those rows (#86). The clamp itself is gone as of #118 — an over-large `limit` is now refused with 400 — so that particular short page can no longer be produced at all; this envelope stays, because it answers a question a page of the RIGHT length still cannot."
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
          description: "The page itself, newest first, at most `limit` long. Shorter than `limit` only at the end of the journal: an over-large `limit` is refused rather than clamped (#118), so a short page has one meaning — which it did not have when this field was written."
        has_more:
          type: boolean
          description: "Whether the journal holds at least one more entry beyond this page — i.e. at `offset + len(operations)` and later. THE ONLY HONEST ANSWER TO «is that all», and it is the server's to give. The page's own length cannot answer it: not because a short page is ambiguous — since #118 it is not, a limit past the ceiling being refused rather than clamped — but because a FULL page says nothing either way, and that is the case a «показать ещё» control has to decide. A FLAG RATHER THAN A TOTAL OR A CURSOR. A total would cost a second count of a table the page has already been read from, publish a number no screen shows, and could disagree with the very page it travels with if a row were written in between; the question a reader is actually asking is binary. A cursor would be a second way of saying where to continue beside the `offset` this endpoint already takes and this client already sends, and it would still have to answer this same question separately. It is derived where the decision is made — one row beyond the page is fetched and its arrival IS this answer, after which a statement of its own trims that row away so nothing downstream can mistake it for part of the page — never by comparing the page's length against anything afterwards. False on an empty page, which is the end of the journal (or past it)."
    TransferResponse:
      type: object
      required: [out, in]
      properties:
        out: { $ref: "#/components/schemas/Operation" }
        in: { $ref: "#/components/schemas/Operation" }
    PositionCurrencyIncome:
      type: object
      required: [currency, income_minor]
      description: "One currency's worth of a position's income (see Position.income_by_currency, which is the list of these)."
      properties:
        currency: { type: string, description: "ISO-4217 of the currency these payments ARRIVED in. Not necessarily the position's own `currency`, which is what its cost and quantity are denominated in — a paper bought for yuan may be paid in rubles." }
        income_minor: { type: integer, format: int64, description: "Income received in `currency`'s minor units: the dividends and coupons paid in it, less the taxes withheld in it. An exact sum — every term is an int64 of minor units of this one currency, so nothing is converted and nothing is rounded here. May be 0 (a coupon and the tax withheld from it cancelling to the minor unit) or negative (a tax withheld in a currency no payment of this position arrived in, or one on a payment older than this journal); neither is a defect, and neither says the same thing as having no entry at all." }
    Position:
      type: object
      required: [instrument, quantity, cost_minor, realized_pnl_minor, settled_minor, total_minor, income_minor, income_by_currency, fees_minor, currency, has_undated_lots, has_undated_realizations, in_base_gap, market_value_gap]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        quantity: { type: string, description: "Decimal as string" }
        cost_minor: { type: integer, format: int64 }
        realized_pnl_minor:
          type: integer
          format: int64
          nullable: true
          description: "Realized profit or loss in the position's own `currency`. NULL EXACTLY WHEN A DISPOSAL SETTLED IN ANOTHER CURRENCY THAN THE BASIS IT RETIRED, and then there is no figure to publish in any currency at all: a yuan bond redeemed for rubles has proceeds in rubles and a basis in yuan, and the difference between them is a quantity of neither — striking it needs an fx rate, which the calculating core holds none of by design. That null is therefore NOT the news that something is unknown or that a rate is missing: every term is present and dated, and it is the single-currency ANSWER that does not exist. It has exactly one cause, so no companion field names it. This is the one thing the money kept per currency (`income_by_currency`, and the fee total) does not have an equivalent of: income in a second currency is still income in that currency and can be listed, while a result whose two ends are in different currencies belongs to neither list. THE RESULT IS NOT LOST WITH THE FIGURE: `in_base.realized_pnl_minor` converts each disposal's proceeds, fee and every retired parcel at that term's own date AND out of that term's own currency, so a row carrying that object publishes the whole result as one number — and a position whose own currency already IS the base currency but which sold into a third one carries that object for this reason alone. `RealizedTotal.by_currency` applies the same rule one level up: a currency whose bucket contains such a position publishes a null rather than the sum of the rest of it."
        settled_minor:
          type: integer
          format: int64
          nullable: true
          description: "WHAT THE POSITION HAS LOCKED IN, in its own `currency`: `realized_pnl_minor` plus `income_minor`. Both halves are past events with dates of their own, so this figure never moves again — which is why it is published apart from `total_minor`, whose other half changes every day. It is also the figure a tax base is built from, though it is NOT that base: no tax is subtracted here (see AccountPositions.tax_withheld_minor for the tax that was actually taken, and why it cannot be attributed to a position). NULL WHENEVER A TERM IS MISSING RATHER THAN SUMMED WITHOUT IT, and there are two ways that happens: `realized_pnl_minor` may not exist at all (a disposal that settled in another currency), and `income_minor` is only the part of the income denominated in `currency` — a yuan bond paid in rubles has income this sum cannot see, and publishing the visible part under a name that says «everything» is the failure this null exists against. `in_base.settled_minor` is the same figure with every term converted at its own date, and it exists on rows where this one does not."
        total_minor:
          type: integer
          format: int64
          nullable: true
          description: "WHAT THE POSITION HAS COME TO, in its own `currency`: `settled_minor` plus `unrealized_pnl_minor`. It deliberately mixes two kinds of certainty — the settled half is final, the unrealized half is a valuation that moves with the market — and that is why `settled_minor` stays published beside it instead of being folded away: a reader who needs the number that will not change has to be able to see it. Null whenever either half is null, for those halves' own reasons (no valuation, a valuation in another currency, or no settled figure)."
        income_minor:
          type: integer
          format: int64
          description: "Income denominated in the position's own `currency`, AND ONLY THAT: the dividends and coupons that arrived in `currency`, less the taxes withheld in `currency`. IT IS ONE TERM OF `income_by_currency` — that list's entry for `currency`, and 0 when the list holds no entry for it — never a summary of the list, and a reader who takes this field for «the position's income» is shown an incomplete answer on every position paid in more than one currency. It is published beside `currency` and rendered under that sign, which is the whole reason it can carry nothing else: adding another currency's minor units into it would denominate the result in nothing, and converting them needs a rate this object neither has nor publishes. A paper's payments need not arrive in the currency it was bought in — a yuan bond's coupons and a dollar share's dividend, tax included, routinely come in rubles from a Russian broker — so on such a position this field is a plain 0: true to the minor unit, and by itself indistinguishable on screen from a paper that has never paid anything. `income_by_currency` beside it is the complete answer with nothing converted; `in_base.income_minor` is the complete answer as ONE number, every payment converted at the rate of its own date, and it exists only where that object does."
        income_by_currency:
          type: array
          items: { $ref: "#/components/schemas/PositionCurrencyIncome" }
          description: "The position's income KEPT PER CURRENCY, and the complete answer to what this paper has paid: one entry per currency the payments actually arrived in, ordered by currency code. NOTHING IS CONVERTED AND NO TWO ENTRIES ARE EVER ADDED — the calculating core holds no fx rates by design (see portfolio.Position.IncomeByCurrency), and one integer made of kopecks and fen is denominated in nothing; `in_base.income_minor` is where this becomes a single figure, each payment converted at the rate of its own date. The order is the server's own and is a property of the money rather than of the journal: two accounts holding the same payments recorded in a different order publish the same list. `income_minor` above is this list's entry for `currency` alone — one of these terms, not their sum. EMPTY EXACTLY WHEN THE POSITION HAS RECEIVED NO INCOME AT ALL, which is what tells that apart from an entry of 0: a coupon and its tax cancelling exactly is not the statement that nothing was ever paid."
        fees_minor: { type: integer, format: int64, description: "Commissions charged on this position IN THE POSITION'S OWN `currency`, and only those — the same rule `income_minor` states, applied to the fee total. A commission need not be denominated like the paper: selling a yuan bond settles in rubles and the broker charges its commission in rubles too, and such a charge is NOT in this figure. Unlike the income there is no `fees_by_currency` beside it, so that charge is not published anywhere in this payload; it is stated here rather than left for a reader to discover from a total that does not add up against the operations. Commissions on a PURCHASE never appear here at all in the first place — they are capitalized into the lot's cost and are part of `cost_minor` (and a purchase must be denominated in `currency`, so they raise no second-currency question)." }
        currency: { type: string }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Market value in market_value_currency; always the same currency as the position's own `currency` when a conversion rate was available, so it's directly comparable to cost_minor. For a bond whose raw valuation is in the face value's currency (not the quote's) and that currency differs from the position's, this is the value converted into the position's currency at today's fx rate; if no rate is available it falls back to the raw (unconverted) value. Null when there is no valuation at all, which is three different pieces of news — no quote stored yet, a type this program has no valuation model for, or a bond with no face value recorded — and `market_value_gap` is what says which, so a reader never has to take a null here as \"no quote\"." }
        market_value_currency: { type: string, nullable: true, description: "Currency of market_value_minor. Equal to `currency` (the position's own currency) whenever a conversion happened; otherwise the raw valuation currency (the quote's currency for share/etf, the instrument's face_currency for bond). Null exactly when market_value_minor is null." }
        market_value_source_currency: { type: string, nullable: true, description: "Set only when market_value_minor was converted from a different currency (see market_value_minor): the original, unconverted valuation currency (e.g. a bond's face_currency). Null when no conversion happened, including when one was needed but no fx rate was available." }
        market_value_source_minor: { type: integer, format: int64, nullable: true, description: "Set only when market_value_minor was converted from a different currency: the original, unconverted valuation amount in market_value_source_currency. It is what a client should name when it discloses where the converted figure came from (\"converted from 1 000,00 €\"), and — since it is also what in_base.market_value_minor is struck from, at the rate of THIS currency rather than the position's — that disclosure is true of the base-currency figure as well as of market_value_minor. Null when no conversion happened." }
        price: { type: string, nullable: true, description: "Decimal as string; latest quote price used for the valuation. What it MEANS depends on instrument.type: for share/etf it is money per unit, in the currency the QUOTE is denominated in — normally the position's own `currency`, but nothing in the model requires the two to agree: a quote carries a currency of its own, and where it differs the server converts the VALUATION into the position's currency (see market_value_minor) while this field stays exactly as quoted. That currency is therefore `market_value_source_currency` when that field is set, and `market_value_currency` otherwise. For a BOND it is instead a PERCENTAGE OF FACE VALUE (e.g. \"95.20\" meaning 95.20% of face, the MOEX convention) — not money, and not in any currency itself — so market_value_minor for a bond is instrument.face_value_minor × price/100 × quantity, denominated in instrument.face_currency rather than in this field's own unit." }
        price_money_minor: { type: integer, format: int64, nullable: true, description: "What ONE unit of this instrument costs in money, at the quoted price. Published ONLY FOR A BOND, whose `price` is a percentage of face value rather than money, and whose reader was otherwise left multiplying by the face value in their head to compare the quote against a cost or a valuation that are both money. It is instrument.face_value_minor x price/100, denominated in instrument.face_currency (the same currency market_value_minor is struck in before any conversion — it is the same product that valuation is built from, with the quantity left out, struck and rounded ONCE on its own rather than divided out of the valuation, which would round a second time). Null for every other instrument type, where `price` is already money and this field would restate it; null too whenever there is no valuation at all, exactly like `price`. It carries the face value's drift: that snapshot is taken when the paper is catalogued and is not refreshed, so on an amortizing bond both this figure and the market valuation age together." }
        price_on: { type: string, nullable: true, description: "Date YYYY-MM-DD of the trading session the quote's SOURCE attaches this price to — never the day the server fetched it; a source asked at any hour of one day may answer with an earlier day's price, dated as that earlier day. Not a guarantee that the instrument traded on this date: a source can publish a price for a paper that did not trade at all in a given session. Not necessarily the most recent session either — that depends on how current the source's own data is, which this field does not describe." }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor, i.e. the position's unrealized profit or loss; both are already in the same currency (market_value_minor is converted into the position's currency when needed, see above), so this is a plain integer subtraction. Null when there is no market_value_minor, or when market_value_currency still differs from currency (a conversion was needed but no fx rate was available)." }
        market_value_gap:
          nullable: true
          description: "Why this row's market valuation cell is not the figure a reader expects: either there is no valuation at all and this says what is missing, or there is one that could not be brought into the position's own currency and so carries no base-currency figure either. Null when the valuation exists and reached the position's currency (or was born in it and needed no conversion) — nothing about THIS cell went wrong then. IT WAS ONCE NULL ON A ROW WITH NO VALUATION TOO, on the ground that there was no cell to caption, and that was wrong twice over: there IS a cell, it renders a dash, and the screen captioned every one of them «Нет котировки» — including the rows where a perfectly good quote exists and this program simply computes no value for the instrument's type, which sent the reader off to wait for data that was not missing (#78). The three no-valuation causes are now named here, so the client reads a cause instead of inferring one from an absent figure. It is still null in one case where the base-currency figure IS missing and nothing about this cell failed: the valuation converted into the position's own currency normally (or needed no conversion), yet `in_base` is absent because `in_base_gap` withholds the WHOLE object, this figure included — which ANY of that field's four values does, not just the ones about the position's own terms. Three of them are about those (an undated lot, or a missing historical rate for a lot's or an income payment's own date); the fourth, `no_rate_today`, is about the valuation itself — it stops on today's rate for the currency the VALUATION is denominated in, the very rate the base-currency valuation would have been struck at — and it is STILL not this field's to report, because this field answers only for the conversion into the POSITION's currency, and on such a row that conversion succeeded or was never needed. A null `market_value_gap` therefore never by itself means this cell carries a base-currency figure — check `in_base`/`in_base_gap` for that. Every value is set at the point that DECIDES it — the one function that values a position (marketValue in internal/portfolio/http.go) answers with the cause instead of a bare \"could not\", and the conversion branch names its own — never by reading the payload back afterwards and comparing `market_value_currency` with `currency`, or `market_value_minor` with null. THAT IS ALSO WHY THESE THREE ARE VALUES OF THIS FIELD AND NOT A FOURTH FIELD BESIDE IT: a field would be a second answer to the question this one already answers about this one cell, the two would have to agree forever, and the day they did not the row would carry two causes for one dash. All four values are mutually exclusive by construction — a valuation either exists or does not — so one field can hold them, unlike `in_base_gap` and this field, which describe different cells and are routinely both set at once. `market_value_minor` says which half of the enum a row is in without a client having to know the values: null for the first three, present for the fourth. When THIS field is the reason the base-currency figure is missing, the server's own decision to withhold `in_base.market_value_minor` reads this same answer, so on that path the flag and the missing figure cannot come apart; they CAN come apart in the row-level case just described, where `in_base_gap` withholds the figure without this field ever having a cause of its own to report. It is published even when `in_base` is absent altogether, and even when `currency` already equals the base currency: the valuation cell is unconverted for a reason of its own whatever else the row is or is not missing. A SECOND FIELD rather than one more value of `in_base_gap`, because the two answer for different cells of the same row and can be true at once — a position whose basis holds a dateless lot AND whose valuation is stuck in a third currency publishes `in_base_gap: undated_lot`, which is true of the cost, the income and the profit — and, since it withholds the whole object, of the missing valuation too — together with `market_value_gap: no_rate_valuation_currency`, which is the NEARER, cell-specific cause of that same missing valuation, not the only one that is true of it. A single field would have to pick one, and either pick would caption half the row with something false. See PositionInBase.market_value_minor for why the absent base-currency valuation is an absence rather than something kept back."
          allOf:
            - $ref: "#/components/schemas/MarketValueGap"
        in_base_gap:
          nullable: true
          description: "Which term stopped `in_base`, or null when nothing did. Null therefore covers two situations and `currency` tells them apart: either `in_base` is present, or `currency` already equals the space's base currency and there was nothing to convert in the first place — the position's own figures ARE the base-currency ones and no «not converted» caption belongs over them at all. Non-null exactly when `in_base` is null and `currency` differs from the base currency. It speaks for the OBJECT, not for the figures inside it: `in_base.market_value_minor` and `in_base.unrealized_pnl_minor` can be null while the object stands (`market_value_gap` says why), and `in_base.realized_pnl_minor` can be null on its own (`has_undated_realizations` says whether an unrecorded purchase date or a missing rate stopped that one). Published so that a client never re-derives it: only the server knows which term it stopped on, and the four causes are four different sentences to the person reading the row — one of them about a figure that is never coming. Before this field existed the screen said «Нет курса» over all four, which is false about a dateless lot, and false again over a market valuation on a row whose today-rate is present and whose basis failed on a purchase date (#66)."
          allOf:
            - $ref: "#/components/schemas/InBaseGap"
        has_undated_lots:
          type: boolean
          description: "True when at least one of the lots still held does not know when it was acquired — it arrived by a transfer whose per-lot breakdown was never recorded (a basis given by hand, or a transfer predating breakdowns), so no purchase date exists for it anywhere. Always present, never inferred by the reader from `in_base` being null: both an undated lot and a missing fx rate null the whole in_base object, but they are not the same condition and must not be explained to a person the same way. A missing rate is a gap the fx backfill closes on its own and the figure appears later; an unrecorded purchase date never resolves, because nobody wrote it down and nothing can recover it. A client that says \"no rate\" over the second case states something false about a permanent condition. False changes nothing about the figures: an unknown date costs no money and no shares, and every amount in the position's own currency is published exactly as usual either way. It speaks only about lots still HELD; `has_undated_realizations` is the identical question asked about disposals already made — a piece already sold is not among these lots and this flag says nothing about it. `in_base_gap` is the sharper twin for the conversion itself: this field is a standing fact about the position, published whether or not there was ever anything to convert, while that one names the term the base-currency object actually stopped on — and it is the one to caption a row with, since a dateless lot is only the FIRST thing that can stop the object."
        has_undated_realizations:
          type: boolean
          description: "True when at least one disposal already made (a sale, or a covered amortization — see Position.Realizations) retired a piece of basis that does not know when it was acquired: it reached this account by a transfer whose per-lot breakdown was never recorded, so no purchase date exists for it anywhere and none ever will. This is the symmetric twin of `has_undated_lots`, asked about the realized side instead of the held one, and it exists for the identical reason: `in_base.realized_pnl_minor` being null has two causes, and they are not the same news to the person reading the row. A missing fx rate is a gap the backfill job closes on its own and the figure appears later; an unrecorded purchase date never resolves. `has_undated_lots` cannot answer this by itself — it speaks only about lots still HELD, and the piece that stopped `realized_pnl_minor` has by definition already been sold, so it is never among them; a client reading `has_undated_lots` as false and reporting \"no rate\" over a null realized figure would name a cause that will never be the true one. Always present, never inferred by the reader from `in_base.realized_pnl_minor` being null. False changes nothing about the figures: an unknown purchase date costs no money and no shares, and `realized_pnl_minor` in the position's own currency (this object's own field, not `in_base`'s) is published exactly as usual either way."
        in_base:
          nullable: true
          description: "The position's amounts in the space's base currency, each valued at the fx rate that answers its own question: cost_minor sums the FIFO lots still held, every lot converted at the rate of the day IT was acquired; income_minor sums the income operations, each at the rate of the day it occurred; realized_pnl_minor sums the disposals already made, each one's proceeds and fee at the rate of its own day and each parcel of basis it retired at the rate of the day that parcel was bought; market_value_minor uses TODAY's rate, because that is what the holding is worth now, and takes it for the currency the valuation is actually denominated in rather than the position's — one conversion, not two (see its own description); unrealized_pnl_minor is the difference of those last two. Base-currency profit therefore INCLUDES the currency's own move against the base currency, and may differ from the position-currency profit in magnitude and even in sign — that is the intended answer, not a rounding artefact. Null when `currency` already equals the base currency (nothing to convert), any single rate the OBJECT AS A WHOLE needs is missing (one lot's, one income operation's, and today's ONLY when there is a valuation for today's rate to convert — a position with no usable quote publishes cost and income without ever asking for it, and carries a null `rate_on` to say so), or one of the FIFO lots still held does not know when it was acquired — a transfer's basis given by hand, or one recorded before breakdowns were kept, produces a lot with no purchase date, and no rate answers for a date nobody recorded. That null is a rule about a VALUE, not about the position: a value in this payload never publishes half-struck, and goes null exactly when at least one term it sums could not be resolved, rather than a total quietly missing that term. Applied to `in_base` itself, its terms are a lot's acquisition date, a lot's rate, an income operation's rate and today's rate for the valuation — in that order, which is the order the server checks them in — and `in_base_gap` names the one it stopped on, so a reader never has to guess which; the position that owns this `in_base` is published regardless, with every other figure it has. Inside the object, market_value_minor and unrealized_pnl_minor can still be null on their own when the valuation isn't in the position's currency, and realized_pnl_minor on its own when a disposal's rate or a retired parcel's purchase date is missing (`has_undated_realizations` says which, for that figure) — the identical rule applied to a smaller value, whose own terms are its disposals' rather than cost_minor's, and whose failure is confined to itself and leaves the rest of the object standing (see their descriptions). fees_minor is intentionally not carried into this object (owner feedback)."
          allOf:
            - $ref: "#/components/schemas/PositionInBase"
    PositionInBase:
      type: object
      required: [cost_minor, income_minor, settled_minor, total_minor, currency, rate_on]
      properties:
        settled_minor:
          type: integer
          format: int64
          nullable: true
          description: "`realized_pnl_minor` plus `income_minor`, both already converted here — each term at the rate of its own date and out of the currency it actually arrived in. It is Position.settled_minor's answer for a row that has none: a position whose disposal settled in a third currency, or whose income arrived in one, cannot state this figure in its own currency and can state it here. Null exactly when `realized_pnl_minor` is null, which is the only term of the two that can be missing."
        total_minor:
          type: integer
          format: int64
          nullable: true
          description: "`settled_minor` plus `unrealized_pnl_minor`, in currency. Null when either is. Note what this mixes and Position.total_minor mixes too: a settled half struck at the rates of the days it happened on, and an unrealized half struck at today's — which is correct for both questions and is why the two halves stay separately published."
        cost_minor: { type: integer, format: int64, description: "Remaining cost basis in currency: every FIFO lot still held, converted at the fx rate of ITS OWN acquisition date, summed as decimals and rounded once at the end. Deliberately NOT Position.cost_minor times today's rate — that would price the basis as if everything had been bought today and would strip the currency's move out of unrealized_pnl_minor below" }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "The position's market valuation in currency at TODAY's fx rate — the one figure in this object that is current rather than historical, since it answers what the holding is worth now. IT IS CONVERTED ONCE, OUT OF THE CURRENCY THE VALUATION IS REALLY DENOMINATED IN: Position.market_value_source_minor at the rate of Position.market_value_source_currency when the row had one to convert (a bond priced off a foreign face value), and Position.market_value_minor at the rate of the position's own currency otherwise. IT IS THEREFORE NOT Position.market_value_minor TIMES THIS OBJECT'S RATE whenever those source fields are set: that figure had already been rounded to a whole minor unit of a currency this answer does not mention, and multiplying it again carried the rounding error along — 1 000,00 € reaching the dollar as 111 111 ¢ and the ruble as 9 999 990 kopecks, where the euro rate of 100 alone gives 10 000 000. THAT IDENTITY IS GONE AND CANNOT BE REBUILT FROM THIS PAYLOAD, so a reader should take this figure as it stands rather than check it against a product. The rate behind it is the valuation currency's against the base one, and no field publishes that rate — `rate_on` names only its date. NEITHER RATE REBUILDS THIS FIGURE FROM Position.market_value_minor, and the two miss it differently. The position currency's own rate — the rate of the currency that figure IS denominated in — only comes close: it is applied to an amount that was rounded to a whole minor unit first, and that lost fraction arrives multiplied, so 111 111 (the position-currency figure above) at USD->RUB 90 gives 9 999 990 kopecks where this field holds 10 000 000, ten kopecks short; elsewhere the miss is at most about half a minor unit carried through that rate plus the final rounding, some 45 kopecks at that same USD->RUB 90. And the rate this figure WAS struck at is not the one to apply to that figure either, since it belongs to the valuation's currency rather than the position's: 111 111 at the euro rate of 100 is 11 111 100 kopecks, a dollar amount multiplied by a euro rate. The money is this figure, struck from one multiplication and one rounding. Never fabricated: null when Position.market_value_minor itself is null — no valuation was struck at all, and Position.market_value_gap says which of the three reasons it was (no quote stored yet, a type this program does not price, a bond with no face value recorded) — AND null whenever market_value_currency differs from the position's own currency — a valuation that could not be brought into the position's currency is not carried into the base one either. Position.market_value_gap is that second case published as a cause, set where the conversion failed rather than inferred afterwards from the two currency codes, and this field is withheld from every row that carries it; it is null on rows with no valuation at all too, whose gap is one of the three that say no valuation was struck rather than that one was kept back. THAT LAST RULE WITHHOLDS NOTHING A READER COULD OTHERWISE HAVE BEEN GIVEN: every fx rate this program stores is quoted in RUB, so a valuation that could not reach the position's currency has no route to the base one either. Reaching the position's currency fails only for want of the valuation currency's RUB rate or of the position currency's, and the second has already nulled this whole object, cost_minor with it — except on a position that holds no lot and has received no income, which has no sum to strike and no rate to miss, and whose withheld valuation is the zero of a closed row. The rule is stated in its own right rather than left to that argument, because the argument is about the rate table rather than about this field: the day a rate quoted in something other than RUB is stored — a direct GBP/USD, which nothing in this program can currently produce — such a valuation does become expressible in the base currency, and this field will then have to say whether it publishes it. Asymmetry between this object and the position's own figures is ordinary and this rule neither creates nor prevents it: realized_pnl_minor here goes null while Position.realized_pnl_minor is published either way, and one undated lot nulls this whole object while every figure in the position's own currency stays. It is the only figure here that today's rate values, so `rate_on` — the date of that rate — is null whenever this is" }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor. Both are already in currency, so this is exact integer subtraction and nothing is rounded a second time. Since the basis is historical and the valuation is current, this INCLUDES the fx revaluation of the position: it is NOT Position.unrealized_pnl_minor times a rate, and a holding can be in profit in its own currency while at a loss in the base currency (or the reverse). Null exactly when market_value_minor above is null — the P&L is derived from the valuation and cannot outlive it" }
        income_minor: { type: integer, format: int64, description: "Income in currency: every income operation of the position (dividend, coupon, tax) converted at the fx rate of the date it occurred, summed as decimals and rounded once at the end — not Position.income_minor times today's rate. EVERY operation means every one, whatever currency it arrived in: a payment is converted out of the currency it was actually paid in, so this figure covers the whole of Position.income_by_currency in one number, while Position.income_minor beside it carries only the entry already denominated in the position's own currency. This is the only single figure that answers for all of them, and it exists only where this object does" }
        realized_pnl_minor: { type: integer, format: int64, nullable: true, description: "Realized profit or loss in currency, and the only figure in this object that is FINAL: both of its ends are past events with dates of their own, so unlike unrealized_pnl_minor it will never move again. Every disposal the position has made contributes its proceeds and its fee at the fx rate of the day THAT disposal happened, and every parcel of basis it retired at the rate of the day THAT parcel was bought (НК РФ ст. 210 п. 5); all of those terms are summed as decimals and the position's figure is rounded once, at the end. It is therefore NOT Position.realized_pnl_minor times any single rate — neither today's nor the sale day's — and it carries the currency's own move between purchase and sale, so a deal can be a profit in the position's currency and a loss here, or the reverse; that is the intended answer, not a rounding artefact. An amortization is one of these disposals: a covered return of principal is exactly neutral in the position's own currency, yet the principal comes back at the rate of its own day while the basis it retires was struck at the rates of the purchase days, and that difference is as real a result as any sale's. A transfer between the family's own accounts is NOT one — it is a disposal in none of the jurisdictions this was researched against, and the leaving leg has no proceeds. Null when any single date this sum needs has no fx rate, or when a retired parcel does not know when it was bought (a transfer's basis given by hand, or one recorded before per-lot breakdowns were kept) — a realized total missing one of its terms is an invented number, smaller or larger than the truth and indistinguishable from a real one on screen. Null here nulls nothing else: cost_minor, income_minor and the valuation answer their own questions from their own dates and are published exactly as usual. `has_undated_lots` does NOT explain this null — it speaks about the lots still HELD, while the parcel that stopped this sum has already been sold and is no longer among them; `Position.has_undated_realizations` is the flag that does, for the identical reason `has_undated_lots` exists for cost_minor and the object above" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on:
          type: string
          nullable: true
          description: "Date YYYY-MM-DD of the fx rate ACTUALLY APPLIED to market_value_minor: today's rate for the pair that figure was struck from — the valuation's own currency against the base one — or the nearest earlier date the rate table holds for it. On a row whose valuation came out in a bond's face currency that is the face currency's rate, not the position currency's, and the two can carry different dates in one and the same response. It does NOT describe cost_minor, income_minor or realized_pnl_minor — those use one rate per lot, per payment and per disposal date, so no single date could name them. NULL WHENEVER NO SINGLE RATE STANDS BEHIND market_value_minor, which is two cases and not one. First: there is no market_value_minor at all (no valuation was struck — see Position.market_value_gap for which of the three reasons — or one the object may not convert) — this is the date OF that figure, and a filled-in date would name the day of a value the object does not contain. Second: the valuation was already denominated in the base currency (a ruble-face bond in a dollar account of a ruble space), so it IS the base-currency answer to the kopeck and no rate was resolved for it — the figure is present and the date is null, because inventing one would disclose a staleness that does not exist. Nothing else in the object goes with it — cost_minor, income_minor and realized_pnl_minor are struck from their own dates and are published exactly as usual. Always present as a key: an explicit null says \"nothing here was struck at a single named rate\", which is a statement, not an omission. Because it is null in the first case, today's rate is asked for only when there is a valuation to convert: a position with no usable quote publishes this object without ever needing a rate for today (see Position.in_base)"
    InBaseGap:
      type: string
      enum: [undated_lot, no_rate_lot_date, no_rate_income_date, no_rate_today]
      description: "Which TERM the server could not value, and so why Position.in_base — the whole object — is absent. It names the term rather than the kind of gap, unlike RealizedGap: that one sums many positions, where no single term exists to point at, while here there is exactly one position and its terms are the very figures that stand side by side in one row. `undated_lot`: one of the lots still HELD does not know when it was acquired (the same condition Position.has_undated_lots reports), so there is no date to ask the fx table about. `no_rate_lot_date`: every lot has an acquisition date, but the fx table holds no rate for at least one of those dates nor for any earlier day. `no_rate_income_date`: the same, for the day one of the position's income operations (dividend, coupon, tax) occurred. `no_rate_today`: no rate for today, nor any earlier day, for the pair the market valuation needs — the currency THAT VALUATION is denominated in against the base currency. That currency is the quote's for a share or an ETF and the face value's for a bond: on most rows it is the position's own, on a bond priced off a foreign face value it is not, and one screen can therefore ask EUR->RUB for one row and USD->RUB for the next. It CAN also be the base currency itself — a ruble-face bond in a dollar account of a ruble space — and then no rate is resolved for it at all and this value cannot arise on that row (PositionInBase.rate_on describes it and is null there). Only a position that has a valuation to convert ever needs that rate, so this value never appears on a row that has no valuation — whatever `market_value_gap` says stopped it: such a row publishes its cost and its income without asking for it. EXACTLY ONE VALUE IS PUBLISHED, AND THERE IS NO COMBINED VALUE. The server stops at the first term it cannot value, in the order listed above, so each value also says that everything before it succeeded. That order puts the one permanent cause first: `undated_lot` never resolves — nobody wrote the date down and nothing can recover it — while all three `no_rate_*` gaps are ones the fx backfill closes on its own, after which the figure appears. A row that has both therefore says `undated_lot` and never promises a figure that is not coming. Among the three temporary ones the named one is true, and closing it names the next, so the caption converges instead of ever claiming more than the server knows. RealizedTotal.in_base_gap needs its `both` value for the opposite reason: it sums MANY positions, so a permanent gap in one and a temporary gap in another are both true of that single total at once."
    MarketValueGap:
      type: string
      enum: [type_not_priced, no_face_value, no_quote, no_rate_valuation_currency]
      description: "Why a row's market valuation cell is not the figure a reader expects — see Position.market_value_gap, the one field that publishes it. The values split in two, and `market_value_minor` tells the halves apart without ambiguity. THE FIRST THREE SAY THERE IS NO VALUATION AT ALL, and on a row carrying one of them market_value_minor, market_value_currency, price, price_on and unrealized_pnl_minor are all null. `type_not_priced`: this program computes no value for the instrument's type. It prices share, etf and bond, and nothing else — currency, crypto, metal and custom have no valuation model, and neither has any type added to InstrumentType without one. A QUOTE MAY WELL EXIST FOR SUCH A ROW and changes nothing, which is the whole reason this value exists: a client captioning it «no quote» would send the reader off to wait for data that is not missing (#78). Nothing is coming here — no decision to write such a model has been taken — so this value must never be captioned as a gap that will close. `no_face_value`: the instrument is a bond and the catalog records no face value for it. A bond's quote is a PERCENTAGE of face value rather than money (see Position.price), so with no face value there is nothing to take the percentage of, and an arriving quote closes nothing. face_value_minor and face_currency are stored both-or-neither (a CHECK constraint since migration 0012), so one value answers for both halves. `no_quote`: this program does price the instrument, its catalog row holds everything the valuation needs, and no price has been stored for it yet. THIS IS THE ONLY ONE OF THE THREE A QUOTE CLOSES, and that is exactly what it means. THE FOURTH SAYS THERE IS A VALUATION AND IT COULD NOT TRAVEL. `no_rate_valuation_currency`: the fx table could not convert the valuation out of the currency it is denominated in, so it stayed in market_value_currency instead of reaching the position's own `currency` (which is where market_value_minor is normally brought, so that the row can compare it with cost_minor), and on any row that publishes a PositionInBase at all, its market_value_minor is null with its unrealized_pnl_minor behind it. Here market_value_minor is NOT null — the raw, unconverted figure is published rather than hidden. EXACTLY ONE VALUE IS PUBLISHED, and the order above is the order the server decides in — the same rule InBaseGap follows, for the same reason: a cause an arriving quote would not close is reported ahead of one it would, so a crypto row with no quote says `type_not_priced` and a face-value-less bond with no quote says `no_face_value`, neither of them promising that a quote is what is missing. `no_quote` is therefore a positive statement and not a leftover: reaching it means the type is priced and the catalog row is complete."
    RealizedGap:
      type: string
      enum: [undated, no_rate, both]
      description: "Why RealizedTotal.in_base could not be struck. Published so that a client never re-derives it from the positions' own flags: the two kinds of gap are not the same news to the person reading the screen, and the server is the only party that knows which one actually stopped the sum. `undated`: at least one position retired a parcel of basis that does not know when it was bought (see Position.has_undated_realizations), so no rate answers for it and no figure will ever appear. `no_rate`: every date the sum needs is known, but the fx table has no rate for at least one of them yet — the backfill closes that gap on its own and the figure shows up later. `both`: different positions were stopped by different gaps, and a screen that named only one of them would promise the whole total is coming when half of it never is."
    RealizedCurrencyTotal:
      type: object
      required: [currency, realized_pnl_minor]
      properties:
        currency: { type: string, description: "ISO-4217 of the positions this figure adds up — their own currency, not the base one" }
        realized_pnl_minor: { type: integer, format: int64, nullable: true, description: "Sum of Position.realized_pnl_minor over every position denominated in `currency`. Exact: the terms are int64 minor units of one and the same currency, so nothing is converted and nothing is rounded here. NULL WHEN ANY POSITION IN THE BUCKET HAS NO SUCH FIGURE — one that sold into another currency, see Position.realized_pnl_minor — because a sum quietly missing one of its terms is an invented number, smaller or larger than the truth and indistinguishable from a real one on the same screen. The bucket is still listed: the currency has positions and the reader should see it, with a null where a total would be a lie. `in_base` is unaffected and normally still present, since a disposal in another currency converts perfectly well term by term." }
    CurrencyAmount:
      type: object
      required: [currency, amount_minor]
      description: "One amount in one currency. Used where a figure cannot be added across currencies and is published per currency instead."
      properties:
        currency: { type: string, description: "ISO-4217" }
        amount_minor: { type: integer, format: int64, description: "Minor units, sign preserved" }
    RealizedTotal:
      type: object
      required: [by_currency, base_currency, in_base, in_base_gap, tax_withheld_by_currency]
      description: "What an account's closed deals have locked in, added up over all its positions — the account-level twin of Position.realized_pnl_minor and Position.in_base.realized_pnl_minor. The server adds it rather than the client for the same reason it adds the balances on the accounts screen: a figure the interface shows is computed in one place, so the policy behind it (what rounds, what a gap suppresses, which positions count) can change in one place and every reader agrees on the answer. Both forms are always published, because the client cannot know which one a screen is about to show and the choice is a display preference, not a fact about the money."
      properties:
        tax_withheld_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyAmount" }
          description: "Tax the broker took FROM THE ACCOUNT rather than from a payment, per currency, sign preserved (negative — money left). THIS IS THE TAX NO POSITION CAN SEE, and that is the whole reason it is published here. A withholding attributed to a security is already inside that position's income_minor, subtracted where it belongs; what is left is the tax charged against the account itself — in Russia, withheld when money is taken out, against the year's accumulated base rather than against any one disposal. On the owner's own account 20 of 21 such withholdings fall on the same day as a withdrawal, and three of them have no disposal in the preceding month at all. IT IS NOT SPLIT ACROSS POSITIONS AND MUST NOT BE: no tax authority computes a per-position share, and any division of it would be an invented number wearing a real one's name. A reader may subtract it from the account's realized total; a reader may not attribute it to a row. Empty when the account has no such withholding. Not converted to the base currency: it is money charged in the currency it was charged in, and no term of it is dated per payment the way in_base's are."
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/RealizedCurrencyTotal" }
          description: "One entry per currency the account's positions are denominated in, ordered by currency code, each one an exact sum within that currency. Amounts in different currencies are never added together: a single integer made of dollars and euros is denominated in nothing. Never has a gap — Position.realized_pnl_minor is published unconditionally, since an unrecorded purchase date costs no money and no shares — so a reader in this mode always has a complete answer. Empty exactly when the account has no positions at all, which is also how a client tells 'nothing to say here' apart from a genuine zero."
        base_currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency: the currency of in_base, carried here so a client formatting the total need not go back to the session for it" }
        in_base:
          type: integer
          format: int64
          nullable: true
          description: "The same result in the space's base currency: the sum of every position's realized figure in that currency — the converted one (Position.in_base.realized_pnl_minor, each rounded once for its own position) for positions denominated in some other currency, and the position's own realized_pnl_minor for those already in the base currency, which have nothing to convert and would otherwise be silently dropped. THE ROUNDED PER-POSITION FIGURES ARE WHAT IS ADDED, not the raw terms behind them re-summed and rounded once for the account. Rounding once per account would be the more accurate single number and is deliberately not what this is: each position's figure is itself published in this same response, this total is defined as their sum, and a header that disagreed by a minor unit with the rows one field away would be a number nobody could check. The residual is at most half a minor unit per position, and it errs the way НК РФ ст. 210 п. 5 does — a base is struck per disposal and the disposals are summed, not the reverse. Null when at least one position's figure could not be struck; `in_base_gap` then says which kind of gap stopped it. Never a partial sum: a total quietly missing one of its terms reads as a smaller (or larger) result, not as a gap, and is indistinguishable from a real figure on screen. A position contributes here whenever its own realized result could be valued, INCLUDING when its `in_base` object as a whole is absent for reasons that have nothing to do with disposals already made — no rate for today behind a quote the position does have, no rate for the day a lot still held was bought, a lot still HELD that does not know when it was bought at all. Those null the object this figure would have travelled in; they do not make a settled result unknowable, and suppressing the account's total over them would be silence about something the server knows."
        in_base_gap:
          nullable: true
          description: "Which kind of gap stopped `in_base`, or null when there is a figure. Both of them can be true of one account at once, hence `both`."
          allOf:
            - $ref: "#/components/schemas/RealizedGap"
    AccountCurrencyTotal:
      type: object
      required: [currency, amount_minor]
      properties:
        currency: { type: string }
        amount_minor:
          type: integer
          format: int64
          nullable: true
          description: "The account's result in this currency, or null when one of its terms has no figure in this currency at all — a position that realized into another currency, or one paid in another, has no own-currency total to add (see Position.total_minor). A bucket short one term is published as null rather than as the sum of the rest: a total quietly missing a term reads as a smaller result, not as a gap, and is indistinguishable from a real figure on screen."
    AccountTotal:
      type: object
      required: [by_currency, base_currency, in_base, in_base_gap, zero_valued_positions, zero_valued_cost_by_currency, unknown_cost_positions]
      description: "WHAT THE ACCOUNT HAS MADE, ALL IN — the account-level twin of Position.total_minor, plus the money no position can see. It is the sum of every position's total (realized result + income + unrealized revaluation) and, beside it, the account's own charges: interest credited on the cash, every commission booked as an operation of its own, and the tax the broker took from the account rather than from a payment. Deposits and withdrawals are NOT in it — putting money in is not earning it — and neither is the revaluation of idle cash, which no position covers and which this figure therefore does not claim. Both forms are always published, because the client cannot know which one a screen is about to show and the choice is a display preference, not a fact about the money."
      properties:
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/AccountCurrencyTotal" }
          description: "One entry per currency the account has a result in, ordered by currency code, each an exact sum within that currency. Amounts in different currencies are never added together: a single integer made of rubles and yuan is denominated in nothing. Empty exactly when the account has no positions and no charges of its own."
        base_currency: { type: string, description: "The space's base currency (ISO-4217), carried here so a client formatting the total need not go back to the session for it" }
        in_base:
          type: integer
          format: int64
          nullable: true
          description: "The same result as ONE figure in the space's base currency, and the only form in which an account holding several currencies has a single answer. Each position contributes the total its own in_base object carries — every term struck at the rate of its own date, the valuation at today's — and each of the account's own charges is converted at the rate of the day it was charged. THE ROUNDED PER-POSITION FIGURES ARE WHAT IS ADDED, for the reason RealizedTotal.in_base states at length: this total is defined as the sum of figures published in the same response, and a header disagreeing by a minor unit with the rows one field away would be a number nobody could check. Null when at least one term could not be valued; `in_base_gap` then says which kind of gap stopped it, and nothing partial is published in its place."
        in_base_gap:
          nullable: true
          description: "Which kind of gap stopped `in_base`, or null when there is a figure. Both can be true of one account at once, hence `both`."
          allOf:
            - $ref: "#/components/schemas/RealizedGap"
        zero_valued_positions:
          type: integer
          description: "HOW MANY HOLDINGS WENT INTO THIS TOTAL AT A VALUE OF NOUGHT because nothing prices them — no quote stored, a bond with no face value recorded, a type this program has no valuation model for (Position.market_value_gap names which, row by row). Their money is counted as spent and nothing is counted as held, so the total is lower than the truth by whatever those papers are actually worth. This is a deliberate answer to a real question — a frozen fund nobody can sell is worth nothing to its holder today — and it is NOT a claim that those papers are worthless: it is the most conservative reading, and it is published as a count precisely so a reader can see the figure rests on it. 0 when every holding was priced, which is when the total needs no such caveat. Their basis is in zero_valued_cost_by_currency, so the size of the assumption is a number rather than an adjective."
        zero_valued_cost_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyAmount" }
          description: "What the holdings counted at nought actually cost, per currency — the exact amount by which this total understates, since each of them contributes minus its own basis. Empty exactly when zero_valued_positions is 0."
        unknown_cost_positions:
          type: integer
          description: "HOW MANY HOLDINGS THE ACCOUNT CANNOT SAY THE PRICE OF: still held, and carrying a basis of nought — shares that arrived by a transfer the broker sent without a cost attached. Their whole market value counts as profit here, so the total is HIGHER than the truth by whatever was really paid for them, on an account that never recorded it. The opposite direction to zero_valued_positions, and published for the same reason: a reader is told what the figure rests on rather than left to discover it. 0 when every holding knows what it cost."
    PositionsResponse:
      type: object
      required: [positions, cost_basis_rules, realized_total, account_total]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        cost_basis_rules:
          description: "Whether the cost basis behind every figure above is the one the owner's country requires (see CostBasisRules). It travels with the numbers rather than only in the session because this is the payload a reader takes the numbers from: a client that renders positions without ever reading the session must still be unable to show cost_minor, unrealized_pnl_minor and realized_pnl_minor as if they were a tax basis when they are not. It describes the whole computation, not one row, so it sits on the response rather than being repeated identically inside every Position. This is the ONLY repetition of it, and the line is drawn here on purpose: the journal publishes a cost basis too (a transfer's Operation.amount_minor) and carries no copy — not for want of an envelope, which OperationsResponse has had since #86, but because one statement living in three payloads is two extra places to forget. The statement belongs to the space, not to a payload — SessionInfo.cost_basis_rules is where a reader of any other figure takes it from."
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
        account_total:
          description: "What this account has made all in, across the positions above and its own charges beside them. It sits on the response for the same reasons realized_total does: it is an aggregate of exactly these rows, it arrives in the round trip the screen already makes, and the addition happens once on the server so every reader agrees on the answer. Present even for an account with no positions, where by_currency is empty and in_base is a plain zero."
          allOf:
            - $ref: "#/components/schemas/AccountTotal"
        realized_total:
          description: "What this account's closed deals have locked in, across all of the positions above. It sits on the response rather than being computed by the reader from `positions`, and rather than living on its own endpoint: it is an aggregate of exactly these rows, arrives with them in the one round trip the screen already makes, and — like cost_basis_rules — describes the whole list rather than any one row. Present even for an account with no positions, where by_currency is empty and in_base is a plain zero."
          allOf:
            - $ref: "#/components/schemas/RealizedTotal"
    TinvestConnectionStatus:
      type: string
      description: "Where a connection to T-Invest stands. `active`: the token works as far as anyone knows, and the hourly schedule syncs this connection. `token_revoked`: the broker refused the stored token, and only a new one fixes it — THE SERVER'S OWN VERDICT, reached by asking the broker, which is why UpdateTinvestConnectionRequest.status will not accept it. `disabled`: the owner switched the connection off; the mirror of what the broker already said stays exactly as it is, and the scheduler passes it by."
      enum: [active, token_revoked, disabled]
    TinvestSyncTrigger:
      type: string
      description: "What caused a sync run. `initial`: the first import, queued by the request that created the connection. `schedule`: the hourly job. `manual`: the owner asked for one (POST .../sync)."
      enum: [schedule, manual, initial]
    TinvestSyncRunStatus:
      type: string
      description: "Where one sync run stands. `running`: it started and has not reported back — a run left in this state for good is a process that died mid-sync, which is visible as such rather than as nothing having happened. `ok`: it finished. `failed`: it stopped on an error, which TinvestSyncRun.error names."
      enum: [running, ok, failed]
    TinvestReconcileStatus:
      type: string
      description: "What the check against the broker said about a run. `not_checked` is NOT `matched`, and the difference is the reason this enum has three values rather than a boolean: a run that was never reconciled — because it failed, or because our own side could not be computed — makes no claim at all, and a screen that could not tell the two apart would draw a tick over a check that never happened. `matched`: every security's quantity and every currency's balance agreed, and the broker named no asset this program cannot hold. `mismatched`: at least one did not, and the mismatch list says which."
      enum: [not_checked, matched, mismatched]
    TinvestReconcileMismatchKind:
      type: string
      description: "What kind of difference the check found. `instrument`: a security's quantity differs, or one side names a security the other does not — which usually means some of the broker's operations did not become journal entries, so the unparsed list is where to look. `currency`: a cash balance in one currency differs. `unsupported`: the broker holds an asset of a kind this program does not account for at all (a future, an option), which no amount of re-importing will change — a separate value precisely so it is not read as the first one and does not send a reader hunting for missing operations."
      enum: [instrument, currency, unsupported]
    TinvestUnparsedReason:
      type: string
      description: >-
        Why one broker operation did not become journal entries — a code, never
        prose: the wording the owner reads is the interface's to translate, and
        naming the wrong cause beside a right figure is the failure this whole
        list exists to prevent. `unsupported_type`: the broker's operation type
        is not one this program accounts for. `unrepresentable_amount`: the sum
        carries a fraction finer than a minor unit. `amount_out_of_bounds`: the
        sum is beyond what the journal can hold — a different accident from the
        previous one, and not to be captioned as it. `unrepresentable_quantity`:
        the number of units is finer than the journal's quantity scale.
        `trade_without_filled_quantity`: a purchase or sale that does not say
        how much of its order was executed — the broker reports the order's
        size and the executed part separately, and only the second one is the
        trade. `transfer_direction_unknown`: a move between the owner's own accounts
        whose direction this program could not tell. `instrument_unresolved`:
        the operation names a security and no catalog row was matched to it —
        distinct from `unsupported_type`, which is about the OPERATION rather
        than about the security. `engine_refused`: the journal itself would not
        take the operation. `redemption_without_quantity`: a full bond
        redemption that said nothing about how many bonds were redeemed — NO
        LONGER PRODUCED, since such a redemption now takes its count from the
        journal (the position it closes); it is declared because rows ruled
        before that change carry it until their connection is next rebuilt.
        `redemption_nothing_held`: a full bond redemption on an account whose
        journal holds none of that bond by the day it happened, so there is
        nothing to close — a different fault from the previous one, and a
        different thing to go looking for: there the broker said nothing, here
        the purchase is missing from this program's own journal.
        `currency_trade`: a purchase or sale of currency. `commission_refund`: a
        negative commission on the operation, i.e. money coming back.
        `tax_refund`: a tax operation whose amount is positive.
        `projection_incomplete`: this program has a rule for the broker's
        operation type and the rule produced nothing — a gap in this program,
        stated as one. `broker_fee_parent_missing`: a commission charged as an
        operation of its own, naming a trade that is not among the operations
        this connection imported — so whether the trade already carries that
        same commission cannot be told, and neither dropping nor keeping the
        charge would be an answer.
      enum:
        - unsupported_type
        - unrepresentable_amount
        - amount_out_of_bounds
        - unrepresentable_quantity
        - trade_without_filled_quantity
        - transfer_direction_unknown
        - instrument_unresolved
        - engine_refused
        - redemption_without_quantity
        - redemption_nothing_held
        - currency_trade
        - commission_refund
        - tax_refund
        - projection_incomplete
        - broker_fee_parent_missing
    TinvestTokenCheckRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: "A read-only T-Invest API token. Sent to the broker and dropped; nothing about it is stored by this endpoint. Only its emptiness is checked here — its length, shape and alphabet are the broker's to judge, and this server holds no pattern it could honestly check them against. It appears in this request schema and in the two write requests below, and in NO RESPONSE SCHEMA ANYWHERE — the same way `password` does."
    TinvestBrokerAccount:
      type: object
      required: [broker_account_id, name, type]
      description: "One T-Invest account a token can see, as the broker describes it. Only the kinds this program can import are listed — a regular brokerage account and an ИИС; savings, card and «инвесткопилка» accounts are left out, because nothing here knows how to read them. Accounts are listed WHATEVER their status, closed ones included: a closed account's history is exactly as real as an open one's, and its settled results are the part of it worth importing."
      properties:
        broker_account_id: { type: string, description: "The broker's own id for the account. Sent back in CreateTinvestConnectionRequest to say which accounts to import." }
        name: { type: string, description: "What the broker calls the account. Shown so the owner can tell one of their accounts from another; nothing is looked up by it." }
        type: { type: string, description: "The broker's own account-type word, verbatim (e.g. ACCOUNT_TYPE_TINKOFF, ACCOUNT_TYPE_TINKOFF_IIS). Passed through rather than translated into a vocabulary of ours: it is the broker's classification and this program keeps it as evidence of what was connected." }
        opened_on: { type: string, nullable: true, description: "Date YYYY-MM-DD the broker says the account was opened, or null when it sent none. It is where the first import starts reading history from." }
    TinvestTokenCheckResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TinvestBrokerAccount" }
          description: "The importable accounts, in the order the broker listed them. Empty means the token works and there is nothing to import through it — which is a different answer from a refused token (400) and must not be shown as one."
    TinvestAccountPick:
      type: object
      required: [broker_account_id, account_name]
      properties:
        broker_account_id: { type: string, minLength: 1, description: "One `broker_account_id` from the token check. It must be among the accounts the token can see AND be one of the importable kinds; anything else is a 422 (NOT a 400 — a 400 here means the token itself was refused), so a client cannot connect an account this program cannot read. The two are separate because the account list can change between the token check and this call, and a client that blames the token for that sends its owner to re-issue a working credential." }
        account_name: { type: string, minLength: 1, description: "What to call the NEW babki account this broker account is imported into. A new account every time — never an existing one — so imported history is never mixed into anything hand-entered." }
    CreateTinvestConnectionRequest:
      type: object
      required: [token, accounts]
      properties:
        token:
          type: string
          minLength: 1
          description: "A read-only T-Invest API token. Checked against the broker before anything is written, then stored encrypted; only its last characters are ever published again (TinvestConnection.token_last4)."
        accounts:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TinvestAccountPick" }
          description: "Which broker accounts to import, and what to call each one here. At least one — a connection that imports nothing would sync forever and produce nothing. Naming one broker account twice in one request is a 400."
    UpdateTinvestConnectionRequest:
      type: object
      description: "Partial update of the connection. Both fields are optional and an omitted one is left unchanged, but at least one must be present — an empty body is refused rather than answered with an unchanged connection and a 200 that looks like success. minProperties states that in the schema itself, as UpdateSpaceRequest does."
      minProperties: 1
      properties:
        token:
          type: string
          minLength: 1
          description: "A replacement read-only token, checked against the broker before it is stored. A connection sitting at `token_revoked` returns to `active` when the broker accepts it — unless this request also names a `status`, which wins."
        status:
          description: "Switch the connection on or off. Only `active` and `disabled` are accepted here; `token_revoked` is refused with a 400, because it is a statement about what the broker said and a client saying it would be stating something nobody checked."
          allOf:
            - $ref: "#/components/schemas/TinvestConnectionStatus"
    TinvestLinkedAccount:
      type: object
      required: [link_id, account_id, broker_account_id, broker_account_name, broker_account_type]
      description: "One broker account tied to the one babki account it is imported into."
      properties:
        link_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid, description: "The babki account this import feeds. It outlives the connection: deleting the connection leaves it, and its operations, alone." }
        broker_account_id: { type: string }
        broker_account_name: { type: string, description: "What the broker called the account WHEN THE LINK WAS MADE — a label kept as it was, not re-read on every sync, so it can differ from what the broker calls it today." }
        broker_account_type: { type: string, description: "The broker's own account-type word as it was at that same moment (e.g. ACCOUNT_TYPE_TINKOFF)." }
        opened_on: { type: string, nullable: true, description: "Date YYYY-MM-DD the broker said the account was opened, or null when it sent none — in which case history is read from a fixed floor instead." }
    TinvestReconcileMismatch:
      type: object
      required: [kind, label, broker, journal]
      description: "One thing the broker and this program's journal disagree about, carrying BOTH figures rather than their difference: a reader who sees only the gap cannot tell which side to go and look at."
      properties:
        kind: { $ref: "#/components/schemas/TinvestReconcileMismatchKind" }
        instrument_id: { type: string, format: uuid, nullable: true, description: "The catalog instrument this row is about, or null when there is none to name: a currency row, an asset kind this program does not hold, and a security the broker named that nothing of ours matched. That last null is itself the news." }
        label: { type: string, description: "What a person reads: our instrument's ticker or name when the row is about one of ours, the broker's own naming when it is about a position that is not, and a currency code on a currency row." }
        broker: { type: string, description: "Decimal as string — what the broker says is there. Units of the security, or an amount of the currency." }
        journal: { type: string, description: "Decimal as string — what this program's journal computes for the same thing, in the same units." }
    TinvestAccountReconcile:
      type: object
      required: [link_id, account_id, broker_account_name, at, status, mismatches, currency_trades_unparsed]
      description: "The most recent check against the broker FOR ONE LINKED BROKER ACCOUNT. A sync run is made for the pair (connection, link) and the reconciliation is made inside it, so a verdict is a statement about ONE broker account and about no other. A connection importing two of them therefore has two verdicts which can differ and can be reached at different moments; publishing whichever of them is newest as the connection's own would draw one account's tick over the other account's difference, and the older account's verdict would never be seen at all. Nothing here is a connection-wide claim: a client that wants one derives it from all of these."
      properties:
        link_id: { type: string, format: uuid, description: "Which link this verdict belongs to — the same id as the matching TinvestLinkedAccount.link_id, and the same one a run carries." }
        account_id: { type: string, format: uuid, description: "The babki account behind that link, so a reader can be sent to it without joining anything." }
        broker_account_name: { type: string, description: "What the broker called the account WHEN THE LINK WAS MADE, the same frozen label TinvestLinkedAccount carries and read from the same link row in the same query — the two cannot disagree, and a reader of a verdict needs to be told whose it is without looking it up." }
        at:
          type: string
          format: date-time
          nullable: true
          description: "When that check was made. Null exactly when `status` is `not_checked` — both are written by the same statement that closes a run (see Store.FinishRun), so a time without a verdict, or a verdict without a time, cannot arrive."
        status:
          description: "All three values occur here, and `not_checked` is the one this shape exists to keep sayable: it is what an account carries when NO run of it ever reconciled — a fresh link, or one whose every run failed. It is not «сходится» and not «расхождений нет»."
          allOf:
            - $ref: "#/components/schemas/TinvestReconcileStatus"
        mismatches:
          type: array
          items: { $ref: "#/components/schemas/TinvestReconcileMismatch" }
          description: "What differed for THIS account. Empty when `status` is `matched` — the verdict is derived from this list and never kept beside it — and empty again when `status` is `not_checked`, where it means nobody looked. `status` is what tells those two apart."
        currency_trades_unparsed:
          type: integer
          description: "How many of this broker account's currency purchases and sales this program does not import (unparsed reason `currency_trade`). IT IS PUBLISHED TO EXPLAIN A CASH DIFFERENCE THAT CANNOT CLOSE: each such operation is money that left one currency and arrived in another with the journal recording neither half, so the account's money comparison against the broker is off by their whole sum — rubles too high, the bought currencies negative — and stays off however many times the sync is re-run. Without this figure that difference stands beside the securities ones as if it were the same kind of news, and a difference that never resolves teaches a reader to stop reading the whole verdict. IT SPEAKS FOR THE MONEY ROWS ONLY, and a client must not caption a securities row with it: a currency trade moves no shares, so a difference in units of a paper has nothing to do with this number. Present on every verdict including `not_checked` and `matched` — it is a fact about the account rather than about the comparison, and 0 is the answer that says a cash difference has to be looked for elsewhere. Counted from the mirror as it stands rather than frozen into the run, so a rebuild that reads more of them is reflected at once."
    TinvestConnection:
      type: object
      required: [id, status, token_last4, accounts, reconciles]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TinvestConnectionStatus" }
        token_last4: { type: string, description: "The last characters of the stored token — at most four, and fewer only if the token itself is shorter — so the owner can tell one token from another. THE TOKEN ITSELF IS NEVER PUBLISHED, by this field or any other: it appears in request schemas only, the way `password` does." }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TinvestLinkedAccount" }
          description: "The broker accounts this connection imports, in the order they were linked."
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
          description: "When this connection's last successful run STARTED, or null if it never had one. Two things about it are easy to assume the other way round and are not: it is the run's start rather than its finish, so it is not the moment the mirror became current; and it is keyed by the connection while runs are made per account, so for a connection with several broker accounts it means at least one of them synced then, never all of them."
        reconciles:
          type: array
          items: { $ref: "#/components/schemas/TinvestAccountReconcile" }
          description: "The last check against the broker FOR EACH of the accounts above — one entry per entry in `accounts`, in the same order, and never fewer: an account no run ever reconciled is present here saying `not_checked` rather than being left out, because a missing entry and a checked-and-agreed one look the same to a reader counting ticks. Each entry survives a later failed run of its own account: a sync that died before reconciling does not erase what the previous check of that account found. THERE IS NO CONNECTION-WIDE VERDICT IN THIS RESPONSE, and that absence is deliberate — «this connection agrees with the broker» is true only when every one of these says `matched`, so it is derived from all of them by whoever needs it and never guessed from the newest one."
    TinvestConnectionsResponse:
      type: object
      required: [connections]
      description: "Every connection of the space, whole. An envelope with no `has_more` and no paging, unlike the run log and the unparsed list beneath it: a space holds a handful of connections and this list is never truncated, so there is no question for a flag to answer. The envelope is kept all the same — it costs one key and leaves somewhere to put a fact about the list itself, which a bare array (the shape the members list still has) has nowhere to carry."
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/TinvestConnection" }
    TinvestSyncAcceptedResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: >-
            True when this request put a sync into the queue. FALSE MEANS ONE
            WAS ALREADY THERE — and «there» is wider than «running right now».
            A sync that failed and is waiting out its backoff occupies the same
            slot, and that backoff grows into the hours, so a client that turned
            `false` into «синхронизация уже идёт» would be saying something
            false for as long as the wait lasts. «Уже запланирована» is true in
            both cases, which is the sentence to write.
    TinvestSyncRun:
      type: object
      required: [id, link_id, trigger, status, started_at, read_count, added_count,
                 disappeared_count, unparsed_count, error, reconcile_status, mismatches]
      description: "One attempt to bring ONE broker account up to date. A connection importing two broker accounts produces two runs per sync, one each."
      properties:
        id: { type: string, format: uuid }
        link_id: { type: string, format: uuid, description: "Which of the connection's links this run was for — join it against TinvestConnection.accounts to name the broker account and the babki account behind it. THE LINK RATHER THAN THE ACCOUNT, so that this figure is read off the run's own row and never assembled from a second query whose answer could have moved on between the two." }
        trigger: { $ref: "#/components/schemas/TinvestSyncTrigger" }
        status: { $ref: "#/components/schemas/TinvestSyncRunStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true, description: "Null while the run is `running`, and permanently null for a run whose process died mid-sync." }
        read_count: { type: integer, description: "How many operations the broker returned for this account." }
        added_count: { type: integer, description: "How many of them the mirror had never seen before." }
        disappeared_count: { type: integer, description: "How many mirror rows the broker stopped returning. Not a deletion: the row stays and is marked, because the broker rewriting its own history is a fact worth keeping." }
        unparsed_count: { type: integer, description: "How many of THIS account's mirror rows the projection could not read, counted after this run — the account's own figure, not the connection's." }
        error: { type: string, description: "What went wrong, empty on a run that did not fail. Prose for a person, never something a client branches on." }
        reconcile_status: { $ref: "#/components/schemas/TinvestReconcileStatus" }
        reconciled_at: { type: string, format: date-time, nullable: true, description: "When the check against the broker was made, or null when `reconcile_status` is `not_checked`." }
        mismatches:
          type: array
          items: { $ref: "#/components/schemas/TinvestReconcileMismatch" }
          description: "What that check found. EMPTY IN TWO DIFFERENT SITUATIONS — the check found nothing, and no check was made — and `reconcile_status` is what tells them apart. It is not restated here as a nullable list, because one fact published in two fields is one fact that can eventually disagree with itself."
    TinvestSyncRunsResponse:
      type: object
      required: [runs, has_more]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/TinvestSyncRun" }
          description: "The page itself, newest first, at most `limit` long."
        has_more: { type: boolean, description: "Whether the log holds at least one more run beyond this page. The server's to answer: the page's own length cannot, and here it especially cannot be inferred from a short page, since an over-large `limit` is refused rather than clamped. Fetched — one row beyond the page is asked for and its arrival IS this answer — never derived by comparing lengths afterwards." }
    TinvestUnparsedOperation:
      type: object
      required: [id, occurred_at, op_type, payment, currency, description, reason, detail, raw]
      description: "One broker operation the projection could not turn into journal entries. Rows the broker has since stopped returning stay on this list: they are still operations this program could not read, and dropping them would be the silence the list exists to replace."
      properties:
        id: { type: string, format: uuid, description: "The mirror row's id — this program's own, not the broker's, whose operation ids are documented to change over time and are an attribute here rather than a key." }
        occurred_at: { type: string, format: date-time, description: "When the broker says the operation happened." }
        op_type: { type: string, description: "The broker's own operation-type word, verbatim (e.g. OPERATION_TYPE_BUY)." }
        payment: { type: string, description: "Decimal as string — the broker's own amount, exactly as it arrived, unconverted and unrounded. Not minor units: an amount too fine or too large for this program's money is one of the reasons a row lands on this list, and rendering it in minor units would be impossible for exactly those rows." }
        currency: { type: string, description: "ISO-4217, upper case." }
        description: { type: string, description: "The broker's own free-text description of the operation, empty when it sent none." }
        reason: { $ref: "#/components/schemas/TinvestUnparsedReason" }
        detail:
          type: string
          description: >-
            What refused this operation said about THIS row, in its own words —
            free text written for a person and NOT FOR A PARSER. `reason` above
            is what a client decides anything by: the sentence the owner reads
            is chosen from that code and from nothing else, and matching on a
            phrase in here would be exactly the dependency on unpromised wording
            that this contract refuses to make elsewhere. Show it, do not read
            it.


            IT IS NOT TRANSLATED and is not promised to be in any one language.
            The server writes these in English and may quote the broker inside
            them, so a client that displays it displays it verbatim, the way it
            already does with `op_type` and `raw`. Neither is a message a client
            may compose a Russian sentence out of.


            MAY BE EMPTY, AND EMPTY IS NOT AN ERROR — it means "nothing more
            was written down", never "the operation was fine": a row is on this
            list because it was refused, and `reason` says so on its own. What
            is empty today are the rows refused before the server kept details
            at all; those are not re-explained after the fact, because the words
            that would go here are gone. Every refusal the server makes now does
            write one, and that is deliberately NOT promised here: a client that
            treated an empty detail as a fault would break on the first refusal
            that has nothing to add.


            The words come from this program's own journal, its instrument
            resolver or its projection rules, so they may name internal things
            — an operation type, an account's own balance, a catalog row. They
            never carry a credential: the broker token travels as a request
            header and appears in no message this program builds.
        raw: { description: "The broker's own JSON element for this operation, as it arrived — every field, including the ones this program does not model. Untyped on purpose: it is evidence for a person asking what the broker actually sent, and nothing here computes from it." }
    TinvestUnparsedResponse:
      type: object
      required: [operations, has_more]
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/TinvestUnparsedOperation" }
          description: "The page itself, newest first, at most `limit` long."
        has_more: { type: boolean, description: "Whether there is at least one more unparsed operation beyond this page. Fetched rather than inferred, for the reason TinvestSyncRunsResponse.has_more gives." }
