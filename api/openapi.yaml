openapi: 3.0.3
info:
  title: babki.my API
  version: 0.1.0
paths:
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /api/v1/setup:
    post:
      operationId: performSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Instance initialized, caller signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/space:
    patch:
      operationId: updateSpace
      description: Updates the space's base currency (owner-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberInfo" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberRequest" }
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/members/{userId}:
    patch:
      operationId: updateMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      responses:
        "200":
          description: Accounts with latest balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountWithBalance" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}:
    patch:
      operationId: updateAccount
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveAccount
      description: Archives the account (soft delete).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archived }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/balance:
    put:
      operationId: setAccountBalance
      description: Sets a manual balance mark for a date (upsert per account+date).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBalanceRequest" }
      responses:
        "200":
          description: Account with the new latest balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Per-currency totals over active accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments:
    get:
      operationId: searchInstruments
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Matching instruments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Instrument" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstrumentRequest" }
      responses:
        "201":
          description: Created instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}:
    patch:
      operationId: updateInstrument
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInstrumentRequest" }
      responses:
        "200":
          description: Updated instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/operations:
    get:
      operationId: listAccountOperations
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Account operations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Operation" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operations:
    post:
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/transfer:
    post:
      operationId: createTransfer
      description: Creates a linked transfer_out/transfer_in pair moving instrument quantity between accounts with FIFO cost-basis carryover.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Created pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}:
    delete:
      operationId: deleteOperation
      description: Deletes the operation (whole pair for transfers). Rejected if the remaining journal becomes inconsistent (oversell).
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/positions:
    get:
      operationId: listAccountPositions
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Open positions computed from the journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SetupStatus:
      type: object
      required: [setup_needed]
      properties:
        setup_needed: { type: boolean }
    SetupRequest:
      type: object
      required: [space_name, username, display_name, password]
      properties:
        space_name: { type: string }
        username: { type: string }
        display_name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    UserInfo:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SessionInfo:
      type: object
      required: [user, role, space_id, space_name, base_currency]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        role: { $ref: "#/components/schemas/Role" }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        base_currency: { type: string, description: "ISO-4217, e.g. RUB" }
    UpdateSpaceRequest:
      type: object
      required: [base_currency]
      properties:
        base_currency: { type: string, description: "ISO-4217 uppercase, e.g. RUB" }
    Role:
      type: string
      enum: [owner, editor, viewer]
    MemberInfo:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    CreateMemberRequest:
      type: object
      required: [username, display_name, password, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AccountType:
      type: string
      enum: [brokerage, checking, savings, deposit, credit_card, loan, cash]
    AccountStatus:
      type: string
      enum: [active, archived]
    AccountWithBalance:
      type: object
      required: [id, name, type, currency, institution, status, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string }
        institution: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        created_at: { type: string, format: date-time }
        balance: { $ref: "#/components/schemas/BalancePoint" }
        balance_in_base:
          nullable: true
          description: "Account's balance converted into the space's base currency at today's fx rate. Null when the account has no balance, its currency already equals base_currency (nothing to convert), or no fx rate could be resolved."
          allOf:
            - $ref: "#/components/schemas/MoneyInBase"
    BalancePoint:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    MoneyInBase:
      type: object
      required: [amount_minor, currency, rate_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Amount in the base currency's minor units" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the fx rate actually used for this conversion" }
    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string, description: "ISO-4217, e.g. RUB" }
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
    UpdateAccountRequest:
      type: object
      properties:
        name: { type: string }
        institution: { type: string }
        owner_user_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AccountStatus" }
    SetBalanceRequest:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    CurrencyTotal:
      type: object
      required: [currency, assets_minor, liabilities_minor, net_minor]
      properties:
        currency: { type: string }
        assets_minor: { type: integer, format: int64 }
        liabilities_minor: { type: integer, format: int64, description: "Negative or zero" }
        net_minor: { type: integer, format: int64 }
    Summary:
      type: object
      required: [totals, base_currency, unconverted]
      properties:
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        base_currency: { type: string, description: "ISO-4217, from the space; e.g. RUB" }
        total_in_base_minor:
          type: integer
          format: int64
          nullable: true
          description: "Sum of totals[].net_minor converted using the latest FX rate on or before today; null only if none of the currencies could be converted"
        unconverted:
          type: array
          items: { type: string }
          description: "Currencies from totals that had no fx rate available and were excluded from total_in_base_minor; empty if all converted"
        rates_on:
          type: string
          nullable: true
          description: "Oldest FX rate date used for the conversion; null if nothing was converted"
    InstrumentType:
      type: string
      enum: [share, bond, etf, currency, crypto, metal, custom]
    Instrument:
      type: object
      required: [id, type, name, ticker, isin, figi, currency, frozen]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
        frozen: { type: boolean }
    CreateInstrumentRequest:
      type: object
      required: [type, name, currency]
      properties:
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
    UpdateInstrumentRequest:
      type: object
      properties:
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        frozen: { type: boolean }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
    OperationType:
      type: string
      enum: [buy, sell, deposit, withdrawal, dividend, coupon, amortization, fee, tax, transfer_in, transfer_out, split, interest, conversion]
    Operation:
      type: object
      required: [id, account_id, type, occurred_on, amount_minor, currency, fee_minor, note, source, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true, description: "Date YYYY-MM-DD" }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price: { type: string, nullable: true, description: "Decimal as string" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        transfer_group_id: { type: string, format: uuid, nullable: true }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
        source: { type: string }
        created_at: { type: string, format: date-time }
    CreateOperationRequest:
      type: object
      required: [account_id, type, occurred_on, amount_minor, currency]
      properties:
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price: { type: string, nullable: true, description: "Decimal as string" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
    TransferRequest:
      type: object
      required: [from_account_id, to_account_id, instrument_id, quantity, occurred_on]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        cost_minor: { type: integer, format: int64, nullable: true, description: "Cost basis override; default is FIFO carryover from the source account" }
        note: { type: string }
    TransferResponse:
      type: object
      required: [out, in]
      properties:
        out: { $ref: "#/components/schemas/Operation" }
        in: { $ref: "#/components/schemas/Operation" }
    Position:
      type: object
      required: [instrument, quantity, cost_minor, realized_pnl_minor, income_minor, fees_minor, currency]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        quantity: { type: string, description: "Decimal as string" }
        cost_minor: { type: integer, format: int64 }
        realized_pnl_minor: { type: integer, format: int64 }
        income_minor: { type: integer, format: int64 }
        fees_minor: { type: integer, format: int64 }
        currency: { type: string }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Market value in market_value_currency; always the same currency as the position's own `currency` when a conversion rate was available, so it's directly comparable to cost_minor. For a bond whose raw valuation is in the face value's currency (not the quote's) and that currency differs from the position's, this is the value converted into the position's currency at today's fx rate; if no rate is available it falls back to the raw (unconverted) value. Null if no usable quote." }
        market_value_currency: { type: string, nullable: true, description: "Currency of market_value_minor. Equal to `currency` (the position's own currency) whenever a conversion happened; otherwise the raw valuation currency (the quote's currency for share/etf, the instrument's face_currency for bond). Null exactly when market_value_minor is null." }
        market_value_source_currency: { type: string, nullable: true, description: "Set only when market_value_minor was converted from a different currency (see market_value_minor): the original, unconverted valuation currency (e.g. a bond's face_currency). Null when no conversion happened, including when one was needed but no fx rate was available." }
        market_value_source_minor: { type: integer, format: int64, nullable: true, description: "Set only when market_value_minor was converted from a different currency: the original, unconverted valuation amount in market_value_source_currency, kept for transparency (e.g. shown in a tooltip). Null when no conversion happened." }
        price: { type: string, nullable: true, description: "Decimal as string; latest quote price used for the valuation" }
        price_on: { type: string, nullable: true, description: "Date YYYY-MM-DD of the quote used for the valuation" }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor, i.e. the position's unrealized profit or loss; both are already in the same currency (market_value_minor is converted into the position's currency when needed, see above), so this is a plain integer subtraction. Null when there is no market_value_minor, or when market_value_currency still differs from currency (a conversion was needed but no fx rate was available)." }
    PositionsResponse:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
