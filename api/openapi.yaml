openapi: 3.0.3
info:
  title: babki.my API
  version: 0.1.0
tags:
  - { name: family, description: "Setup, sign-in and sessions, the space, its members and roles (internal/family)." }
  - { name: accounts, description: "Accounts, balance marks, the family's total and capital (internal/account)." }
  - { name: instruments, description: "The catalog of papers (internal/instrument)." }
  - { name: corporate-actions, description: "The registry of splits, conversions and spin-offs (internal/corporateaction)." }
  - { name: journal, description: "Operations: entry, edit, delete, transfers, arrivals (internal/operation)." }
  - { name: portfolio, description: "Positions, a paper's page and returns, computed from the journal (internal/portfolio)." }
  - { name: table-import, description: "Loading a table into an account and exporting its journal as one (internal/importer/table)." }
  - { name: tinvest, description: "The T-Invest connection: sync, unparsed operations, explanations (internal/importer/tinvest)." }
  - { name: service, description: "The whole space's export and the state of background data sources." }
  - { name: categories, description: "A family's categories of money going out and coming in (internal/category)." }
  - { name: cashflow, description: "The family's money over a period: income and spending by category and month (internal/cashflow)." }
  - { name: structure, description: "The family's worth taken apart by kind of asset, currency, account and country (internal/structure)." }
  - { name: payouts, description: "What the family's papers will pay: coupons, repayments, redemptions, dividends (internal/payouts)." }
  - { name: recurring, description: "The family's regular payments found in the journal (internal/recurring)." }
  - { name: forecast, description: "The family's everyday money over the coming months (internal/forecast)." }
  - { name: credit-cards, description: "A credit card's terms and what is due on it (internal/creditcard)." }
  - { name: push, description: "Reminders pushed to the family's devices (internal/notify)." }
  - { name: loans, description: "A loan's terms, its schedule and its payments (internal/loan)." }
paths:
  /api/v1/structure:
    get:
      tags: [structure]
      operationId: getStructure
      description: >-
        The family total of GET /summary taken apart, in the base currency at today's rates: by kind
        of asset, by currency, by account and by the country a paper was issued in (its ISIN's
        prefix; a depositary receipt is the depositary's country). Each account is counted the way
        the total counts it — by its journal (papers at the chosen valuation and the money its
        operations leave) or by its last balance, which is then one piece of its account's kind.
        Each breakdown adds up to `assets_minor`; anything below zero is a debt, in `debts_minor`.
      parameters:
        - { name: valuation, in: query, required: false, schema: { type: string, enum: [liquid, full] }, description: "Papers at the liquid (when absent) or the full valuation (decision Р-11)" }
      responses:
        "200":
          description: The structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Structure" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/loan:
    get:
      tags: [loans]
      operationId: getLoan
      description: >-
        A loan account's terms and the schedule worked out from them: each month's payment, the
        interest in it and the debt it repays, the first a month after the loan was issued; and,
        as of today, the debt the schedule leaves and the next payment due. 404 until terms are
        stated.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The loan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [loans]
      operationId: setLoanTerms
      description: States or restates a loan account's terms; anything other than a loan account is a 400.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanTerms" }
      responses:
        "200":
          description: The loan with its schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [loans]
      operationId: deleteLoanTerms
      description: Forgets the terms; the journal keeps what was paid.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/loan/prepayments:
    post:
      tags: [loans]
      operationId: recordLoanPrepayment
      description: >-
        Pays debt ahead of the schedule (#429) from another account of the loan's currency: a transfer to
        the loan's account, as the debt part of a payment, and a note that reshapes the schedule — the
        payment worked out anew for the months left (mode payment) or kept, ending the loan sooner (term).
        Should the note be refused, the transfer is taken back.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanPrepaymentRequest" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoanPrepayment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/loan/prepayments/{prepaymentId}:
    delete:
      tags: [loans]
      operationId: deleteLoanPrepayment
      description: Forgets a prepayment for the schedule; the transfer stays in the journal until deleted there.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: prepaymentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/loan/payments:
    post:
      tags: [loans]
      operationId: recordLoanPayment
      description: >-
        Records a payment on the loan from another account of the same currency, the way decision
        Р-24 counts it: the interest is a spending from the paying account (under «Проценты по
        кредитам» when the family has that category), the rest a transfer to the loan's account,
        which brings the debt down. Should the transfer be refused, the interest is taken back.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanPaymentRequest" }
      responses:
        "201": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/payouts:
    get:
      tags: [payouts]
      operationId: getPayouts
      description: >-
        What the papers the journals hold today will pay from today to the end of the month
        `months` ahead: bond coupons, partial repayments, redemptions and offers from the
        exchange's schedules, and the dividends issuers declared (by their payment day, else
        their record day). Today's holdings carried forward — a sale or a purchase before the day
        changes it. Amounts are before tax; a floating coupon not yet set, and an offer, have no
        amount. The base currency figures are at today's rate.
      parameters:
        - { name: months, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 24, default: 12 } }
        - { name: account_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Only this account's; absent, every active account of the family" }
        - { name: instrument_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Only this paper's" }
      responses:
        "200":
          description: The forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutsForecast" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/return/benchmarks:
    get:
      tags: [accounts]
      operationId: getReturnBenchmarks
      description: >-
        The family's return of GET /return weighed against total-return indices (#401): for each, a model
        portfolio that put the same money into the index on the same days — the worth at `from`, every
        contribution and withdrawal — valued at `to`, and its money-weighted annual rate, in the base currency
        (an index in another currency at each day's rate). MCFTR and RGBITR from the exchange, SP500TR (the
        S&P 500 with dividends, in dollars) from the foreign feed. `complete` is false when the index has no
        close within a week of a day it needed one, or when the family took out more than the model would
        have held (the model would owe the index); the end and the rate are then null.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The benchmarks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Benchmarks" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/payouts/received:
    get:
      tags: [payouts]
      operationId: getPayoutsReceived
      description: >-
        Whether the payouts due in the last `days` came (#424): each coupon, partial repayment, redemption
        and declared dividend of a paper an account held at the end of the day before its record day (the
        day before the payment, when the source gives none), against the journal's rows of its kind for
        that paper from 5 days before its day to 10 days after (45 for a dividend), each row counted once.
        `received`; `short` — it came, but less than two thirds of the gross due, more than tax would take;
        `missing` — nothing, and the window has passed; `awaited` — nothing yet. Most recent first.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 366 }, description: "How far back; 90 when absent" }
        - { name: account_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: instrument_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The payouts due and what came
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PayoutCheck" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/credit-card:
    get:
      tags: [credit-cards]
      operationId: getCreditCard
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      description: >-
        A credit card's terms and where it stands today (decision Р-26). Counted by its journal, the
        card's withdrawals are its purchases — free of interest until their deadline: the payment date of
        their statement (grace_kind `statement`), or grace_days from the start of their statement period
        (`long`) — and its payments clear the oldest debt first; money moved off the card, fees and
        interest charged owe interest from their day. Counted by its last balance, only the debt, the
        limit left and an estimated minimum can be told. 404 while no terms are stated.
      responses:
        "200":
          description: The card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditCard" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [credit-cards]
      operationId: setCreditCard
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      description: States or restates the card's terms; only a credit card account takes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditCardTerms" }
      responses:
        "200":
          description: The card with its terms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditCard" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [credit-cards]
      operationId: deleteCreditCard
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      description: Forgets the card's terms; its journal stays.
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/credit-cards:
    get:
      tags: [credit-cards]
      operationId: listCreditCards
      description: Every active credit card with terms, where each stands today — for the reminders.
      responses:
        "200":
          description: The cards
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CreditCardSummary" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/push/key:
    get:
      tags: [push]
      operationId: getPushKey
      description: The server's public push key (VAPID) a browser subscribes with (decision Р-27). 503 when the process has no encryption key to derive it from.
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushKey" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/push/subscriptions:
    put:
      tags: [push]
      operationId: subscribePush
      description: >-
        Turns reminders on for the member's device: the address and keys its browser's push service gave.
        Only an https address of a known push service (Google, Mozilla, Apple, Microsoft) is taken — the
        server sends to it on its own. The same address again moves the device to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "204": { description: Turned on }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [push]
      operationId: unsubscribePush
      description: Turns reminders off for one of the member's devices.
      parameters:
        - { name: endpoint, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Turned off }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/push/test:
    post:
      tags: [push]
      operationId: testPush
      description: Pushes a sample to the member's devices now, so they see it works.
      responses:
        "200":
          description: How many devices there are and how many took it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushTestResult" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/recurring/hidden:
    put:
      tags: [recurring]
      operationId: hideRecurring
      description: Says a regular payment is not regular — three trips to one shop a month apart are not a subscription. It stays in GET /recurring with hidden true, and leaves the forecast.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringKey" }
      responses:
        "204": { description: Hidden }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [recurring]
      operationId: showRecurring
      description: Takes a hidden payment back among the regular ones.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringKey" }
      responses:
        "204": { description: Shown again }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/forecast:
    get:
      tags: [forecast]
      operationId: getForecast
      description: >-
        The family's money to live on — active cards, current and savings accounts and cash, each
        counted the way the total counts it (by its journal or by its last balance) — today and day by
        day ahead, in the base currency at today's rates: the regular payments of GET /recurring on
        those accounts on their pace (an overdue one today, unless the account is counted by a balance
        marked on or after its day, which holds it already), and every loan's scheduled payments
        (a regular payment named as a loan account is its interest and is left to the schedule).
        Deposits, brokers' accounts and loans' own balances are not in it. Twice a month from one
        payee (a salary and its advance) counts as two monthly payments.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 7, maximum: 366 }, description: "How far ahead, in days; 90 when absent" }
      responses:
        "200":
          description: The forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forecast" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/recurring:
    get:
      tags: [recurring]
      operationId: listRecurring
      description: >-
        The regular payments the journals of the family's everyday accounts show: money going to or
        coming from one counterparty (or, without one, one note) at a steady pace — weekly, monthly,
        quarterly, yearly — and a steady amount, still going today. Trailing words with digits (a
        shop's number, a card's tail) do not split a payee. The soonest due first; a payment whose
        day has passed within the slack its pace allows is `overdue`. Nothing is stored: a
        payment that stops drops out.
      responses:
        "200":
          description: The regular payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecurringPayment" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cashflow:
    get:
      tags: [cashflow]
      operationId: getCashflow
      description: >-
        What came in and went out between `from` and `to` (both included), in the base currency
        at the rate of each row's day. A row filed under a category counts as income or spending
        by it, on any account. An unfiled row on a brokerage account, and any dividend or coupon,
        goes to `investments` — money between the family and its brokers, neither earned nor
        spent. An unfiled row on any other account: interest earns and a fee or a tax spends
        under a group of its own (`group`), and a deposit or a withdrawal waits in `unfiled_in` /
        `unfiled_out`. A fee charged on a row spends under `fee`, or is an investment cost on a
        broker's account. Transfers between the family's accounts are not read. Spending is
        counted positive. A row whose day has no rate is left out (`missing_rates`, `left_out`).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "First day, YYYY-MM-DD" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "Last day, YYYY-MM-DD; at most 120 months after `from`'s month" }
        - name: member
          in: query
          required: false
          description: "A member's id: only what is theirs — rows they are named on (Operation.member_id), and rows naming nobody on the accounts personal to them. `shared`: rows naming nobody on the shared accounts. Absent: the whole family."
          schema: { type: string }
      responses:
        "200":
          description: The period's money
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashflowReport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      description: >-
        The family's categories, spending before earning, each level in its order. A family
        that never had categories gets the default set the first time it asks; a family that
        removed them does not get them back.
      responses:
        "200":
          description: Every category of the family's, archived ones too
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [categories]
      operationId: createCategory
      description: >-
        A new category, last among its siblings. Under a parent it must be of the parent's kind,
        and the parent on the top level: the tree is two deep. 400 for a name taken at that place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: The category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/category-rules:
    get:
      tags: [categories]
      operationId: listCategoryRules
      description: The family's filing rules in the order they are tried; the first that fits a row wins.
      responses:
        "200":
          description: Every rule of the family's
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryRule" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [categories]
      operationId: createCategoryRule
      description: >-
        Adds a rule after the others: a row whose `field` holds `pattern` — letter case aside,
        «ё» read as «е» — goes under `category_id`. A rule only files a row of its category's
        direction (an income category, a deposit or interest; an expense one, a withdrawal, fee
        or tax), and never into an archived category.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRuleRequest" }
      responses:
        "201":
          description: The rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/category-rules/order:
    put:
      tags: [categories]
      operationId: reorderCategoryRules
      description: Puts the rules in the order given; it must name each of the family's rules once, or 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderCategoryRulesRequest" }
      responses:
        "204": { description: Reordered }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/category-rules/{ruleId}:
    patch:
      tags: [categories]
      operationId: updateCategoryRule
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategoryRuleRequest" }
      responses:
        "200":
          description: The rule as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryRule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [categories]
      operationId: deleteCategoryRule
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/categories/{categoryId}:
    patch:
      tags: [categories]
      operationId: updateCategory
      description: >-
        Rename, move, reorder or archive a category; absent fields stay. `parent_id: null` moves it
        to the top level. Archiving a category archives the ones under it; an archived category
        keeps its operations and leaves the lists a new entry picks from.
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCategoryRequest" }
      responses:
        "200":
          description: The category as changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [categories]
      operationId: deleteCategory
      description: >-
        Remove a category nothing refers to. 400 when categories sit under it or an operation
        names it — archive it instead.
      parameters:
        - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/setup/status:
    get:
      tags: [family]
      operationId: getSetupStatus
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /api/v1/setup:
    post:
      tags: [family]
      operationId: performSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Instance initialized, caller signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      tags: [family]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "429":
          description: >-
            Too many wrong passwords for this username from this address. Five
            in a row lock the pair for a minute, each further one doubles the
            lock up to fifteen minutes. Nothing is looked up while the lock
            stands, so the right password is refused too. `Retry-After` says how
            many seconds remain.
          headers:
            Retry-After:
              description: Whole seconds until the next attempt will be looked at.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/auth/logout:
    post:
      tags: [family]
      operationId: logout
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/password:
    post:
      tags: [family]
      operationId: changePassword
      description: >-
        Replaces the caller's password once the current one is given. Every other session of the
        caller ends; this one is renewed and goes on. 400 for a wrong current password (counted
        against the same lock as sign-in, 429 once it closes) or a new one outside the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/v1/auth/sign-out-elsewhere:
    post:
      tags: [family]
      operationId: signOutElsewhere
      description: Ends every session of the caller but this one, which is renewed and goes on.
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/me:
    get:
      tags: [family]
      operationId: getMe
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/tax-residencies:
    get:
      tags: [family]
      operationId: listTaxResidencies
      description: >-
        Every country this application has cost basis rules for, with the rules
        themselves, sorted by country code. This is the list a client offers the
        owner to choose from, and it is served rather than hardcoded so the
        countries and their consequences live in exactly one place — a client
        that shipped its own copy would eventually offer a country the server
        rejects, or promise rules the server does not follow.
      responses:
        "200":
          description: Selectable tax residencies and what each implies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostBasisRules" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/space:
    patch:
      tags: [family]
      operationId: updateSpace
      description: Updates the space's base currency and/or the owner's country of tax residency (owner-only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSpaceRequest" }
      responses:
        "200":
          description: Updated session info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/members:
    get:
      tags: [family]
      operationId: listMembers
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberInfo" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [family]
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberRequest" }
      responses:
        "201":
          description: Member created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/members/{userId}:
    patch:
      tags: [family]
      operationId: updateMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRequest" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [family]
      operationId: deleteMember
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      responses:
        "200":
          description: Accounts with latest balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountWithBalance" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}:
    patch:
      tags: [accounts]
      operationId: updateAccount
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAccountRequest" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [accounts]
      operationId: archiveAccount
      description: Archives the account (soft delete).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Archived }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/balance:
    put:
      tags: [accounts]
      operationId: setAccountBalance
      description: Sets a manual balance mark for a date (upsert per account+date).
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBalanceRequest" }
      responses:
        "200":
          description: Account with the new latest balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWithBalance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/imports/preview:
    post:
      tags: [table-import]
      operationId: previewTableImport
      description: >-
        Reads a CSV table of operations for the account and says, row by row, what importing it
        would do — and writes nothing. Without `mapping` the columns and the type values are
        guessed from the header; the answer carries the mapping it used, for the person to correct
        and send back. Rows already imported from a table (the same content, see
        ImportRow.verdict) are duplicates. The journal is asked about the new rows exactly as an
        import would ask it. 400 for a table that cannot be read at all or a mapping naming an
        operation type a table may not hold; 404 for an account not in this space.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportPreviewRequest" }
      responses:
        "200":
          description: What importing the table would do
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/imports:
    get:
      tags: [table-import]
      operationId: listTableImports
      description: The account's table imports, newest first, rolled back ones included.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The imports
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TableImport" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [table-import]
      operationId: importTable
      description: >-
        Imports a CSV table into the account with the mapping given (see POST .../imports/preview,
        whose answer carries one to start from). The rows the journal takes are written in one
        transaction with the record of the import; duplicates are skipped; the rest of the verdicts
        are the journal's at the moment of writing. An import that writes nothing is not recorded
        and comes back with `import` null.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportTableRequest" }
      responses:
        "200":
          description: What the import did
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportTableResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/journal.csv:
    get:
      tags: [table-import]
      operationId: exportJournal
      description: >-
        The account's journal as a CSV table, oldest first: `;` between cells, decimal commas, a
        byte-order mark, a header in the words the table import recognizes — so the same file
        reads back through POST .../imports (buys, sells, money and payments; transfers and
        corporate actions are written for the reader and not read back). Amounts are signed as
        the journal keeps them; the paper is named by its ISIN, or its ticker without one.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The table
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/imports/papers:
    post:
      tags: [table-import]
      operationId: addImportPapers
      description: >-
        Looks the papers a table names but the catalog does not hold — by ticker or ISIN — up on
        the Moscow Exchange, and files the ones traded on a board this program prices (shares,
        funds, ruble bonds) in the catalog. A code already in the catalog is `known`; one the
        exchange does not have there is `not_found` and has to be entered by hand. At most 200
        codes. 502 when the exchange does not answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codes]
              properties:
                codes: { type: array, items: { type: string }, maxItems: 200 }
      responses:
        "200":
          description: What the lookup came to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPapersResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/imports/{importId}:
    delete:
      tags: [table-import]
      operationId: rollBackTableImport
      description: >-
        Takes every operation the import wrote, and still in the journal, out of it, and marks
        the import rolled back. 409, with the engine's reason, when the journal would not replay
        without them — a later sale resting on an imported purchase, say. 400 when already
        rolled back.
      parameters:
        - { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The import, rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TableImport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/return:
    get:
      tags: [portfolio]
      operationId: getAccountReturn
      description: >-
        What an account earned over a period, by its journal: its worth at the end of `from`
        and of `to` (holdings at those days' closes, cash, those days' rates), the money
        that crossed its edge in between (deposits and withdrawals at their day's rate,
        units arriving or leaving at that day's close), the profit and the money-weighted
        annual rate (XIRR). Income, fees and taxes are not flows. `complete` is false when a
        figure could not be had; the figures then leave it out. 400 for dates out of order
        or in the future.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD: the period starts after its end" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD, at most today" }
      responses:
        "200":
          description: The period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodReturn" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/return:
    get:
      tags: [accounts]
      operationId: getFamilyReturn
      description: >-
        GET /api/v1/accounts/{accountId}/return over the family's brokerage accounts that the
        total counts by their journal (AccountWithBalance.counted_by `journal`): their worth
        added up at both ends, their flows together — a move of shares between two of them
        cancelling out, as both legs are valued on one day at one price — and the rate over all
        of it. Deposits, cards,
        cash and loans have balances and no record of what crossed their edge, and are not in it.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyReturn" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}/holdings:
    get:
      tags: [portfolio]
      operationId: getInstrumentHoldings
      description: >-
        One paper across the family: its catalog row, and its position on every account whose
        journal names it — exactly the row GET /accounts/{accountId}/positions shows for it there,
        closed positions included. Archived accounts are included; the account list says which
        they are. `total` adds the accounts up only where that needs no conversion: when every
        position is kept in one currency; otherwise it is null. 404 for an unknown paper.
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The paper and its positions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentHoldings" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}/operations:
    get:
      tags: [journal]
      operationId: listInstrumentOperations
      description: >-
        One paper's rows across every account of the space, newest first, a page at a time —
        each row as the account's own journal publishes it (`account_id` says whose it is). An
        unknown paper has no rows. 400 for a page outside the bounds the account's journal takes.
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: A page of the paper's rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}/return:
    get:
      tags: [portfolio]
      operationId: getInstrumentReturn
      description: >-
        What one paper earned the family between two days across every account: its worth at
        either end, the money put in (buys with commissions) and taken out (sales, payouts,
        redemptions, less taxes), and the money-weighted annual rate, in the currency the
        paper is valued in. A move between the family's accounts is no flow; units arriving
        from outside or by a conversion count at that day's close. `complete` is false when
        an end has no price, a payout no rate, or a spin-off moved part of the worth away.
        400 as on the account's return; 404 for an unknown paper.
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD, the day before the period" }
        - { name: to, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD, the period's last day" }
      responses:
        "200":
          description: The period's return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodReturn" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}/prices:
    get:
      tags: [portfolio]
      operationId: getInstrumentPrices
      description: >-
        The paper's closing prices, one a day, from `from` to today, oldest first — the
        exchange's, the broker's, or stated by hand, whichever the day has. A price is money per
        unit in `currency`, or for a bond a percentage of face value, as quotes are. At most ten
        years; 400 for a `from` that is malformed, in the future or further back than that; 404
        for an unknown paper.
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD" }
      responses:
        "200":
          description: The prices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DayPrice" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [portfolio]
      operationId: stateInstrumentPrice
      description: >-
        States a paper's price on a day by hand — for a paper no exchange or broker quotes: a
        frozen fund at its net asset value, an over-the-counter estimate. It is stored like any
        quote and values every holding of the paper from that day on, until a later price (from
        any source) takes over; the position says the price was stated by hand. A second statement
        for the same day replaces the first. `price` is money per unit, or for a bond a percentage
        of face value, as quotes are. 400 for a price that is not positive, a date in the future
        or a malformed one; 404 for an unknown paper.
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on, price]
              properties:
                on: { type: string, description: "Date YYYY-MM-DD" }
                price: { type: string, description: "Decimal as string: money per unit in the paper's currency, or percent of face for a bond" }
      responses:
        "204": { description: Stated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/export:
    get:
      tags: [service]
      operationId: exportSpace
      description: >-
        Everything the family has entered, as one JSON document to keep or to take elsewhere:
        the space, its members (names and roles, never passwords), every account with its
        balance marks and its journal as stored (each move between accounts with the purchases
        it carried), the papers the journals name, the registry's events about those papers,
        and the prices stated by hand. Exchange prices and rates are not in it: they are the
        exchange's and are fetched again. Owner only; sent as a download.
      responses:
        "200":
          description: The space, whole
          headers:
            Content-Disposition:
              schema: { type: string }
              description: "attachment; filename=babki-export-YYYY-MM-DD.json"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpaceExport" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/data-sources:
    get:
      tags: [service]
      operationId: listDataSources
      description: >-
        How the background jobs that fetch outside data last ended — the exchange's prices and
        their history, the central bank's rates, the broker's operations and prices, the
        exchange's splits: when each last succeeded, and when and how it last failed. `stale` is
        true when a source has not succeeded for three of its intervals, or never has while it
        has failed.
      responses:
        "200":
          description: The sources, in a fixed order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataSource" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/background-tasks:
    get:
      tags: [service]
      operationId: listBackgroundTasks
      description: >-
        The background jobs running now that change what the screens show — the broker
        import and what catches up the rates, prices and corporate-action registry it needs —
        for the caller's space and for the whole instance, oldest first. A task disappears
        when its job ends; one whose process died stops being listed two minutes after it
        last reported.
      responses:
        "200":
          description: The running tasks; empty when nothing runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackgroundTask" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/capital:
    get:
      tags: [accounts]
      operationId: getCapital
      description: >-
        What the family's active accounts were worth at the end of each of a run of days, in
        the base currency: a brokerage account with operations by its journal as of that
        day, every other account by its latest balance mark on or before it. Days are weekly
        (`step=week`) or month ends (`step=month`) from `from`, plus today; at most 120
        points (400 beyond, or for a future `from`).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string }, description: "Date YYYY-MM-DD the series starts on" }
        - { name: step, in: query, required: false, schema: { type: string, enum: [week, month] }, description: "month when omitted" }
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapitalSeries" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/summary:
    get:
      tags: [accounts]
      operationId: getSummary
      responses:
        "200":
          description: Per-currency totals over active accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/instruments:
    get:
      tags: [instruments]
      operationId: searchInstruments
      description: >-
        The instrument catalog, ordered by name then id, one page at a time. An empty
        `query` lists everything; otherwise rows whose name, ticker or ISIN contains it,
        case-insensitively. A `limit` above the maximum is a 400, not reduced.
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the catalog, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [instruments]
      operationId: createInstrument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstrumentRequest" }
      responses:
        "201":
          description: Created instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/instruments/{instrumentId}:
    patch:
      tags: [instruments]
      operationId: updateInstrument
      parameters:
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInstrumentRequest" }
      responses:
        "200":
          description: Updated instrument
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instrument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/instrument-events:
    get:
      tags: [corporate-actions]
      operationId: listInstrumentEvents
      description: >-
        The corporate-actions registry, newest effective date first: splits, conversions and
        spin-offs keyed by the ISIN they happened to. Not paged — the registry is small.
      responses:
        "200":
          description: Every recorded corporate action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentEventsResponse" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [corporate-actions]
      operationId: createInstrumentEvent
      description: >-
        Record a corporate action by hand. It is stored and carried into every account that
        held the paper before the response, which says what changed. 400 for any rule of the
        registry (a 1:1 split, a ratio that rounds to zero, a conversion into the same
        paper, a duplicate paper, kind and date).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInstrumentEventRequest" }
      responses:
        "201":
          description: The recorded event, and what materializing it changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentEventWritten" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/instrument-events/{eventId}:
    delete:
      tags: [corporate-actions]
      operationId: deleteInstrumentEvent
      description: >-
        Remove a hand-recorded event, and with it the journal rows it put into
        every account — the same materialization runs, finds the registry no
        longer asks for those rows, and takes them out before this responds.


        AN EXCHANGE ROW IS REFUSED WITH 400, not silently kept: the job that
        wrote it reads the exchange's table on every run and would write it back,
        so a deletion would last until the next run and no longer. The message
        names the source, so a reader is not left to guess why a row on their own
        screen would not go.
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The removed event, and what un-materializing it changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentEventWritten" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/operations:
    get:
      tags: [journal]
      operationId: listAccountOperations
      description: >-
        One account's journal, newest first, one page at a time. A `limit` or `offset`
        outside the bounds is a 400, not replaced; the ceiling itself is accepted.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
        - name: type
          in: query
          required: false
          description: "Only operations of these types (repeat the parameter for several); 400 for a type that does not exist"
          schema: { type: array, items: { $ref: "#/components/schemas/OperationType" } }
        - { name: instrument_id, in: query, required: false, schema: { type: string, format: uuid }, description: "Only operations naming this paper" }
        - { name: from, in: query, required: false, schema: { type: string }, description: "Only operations on or after this date, YYYY-MM-DD" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "Only operations on or before this date, YYYY-MM-DD" }
        - name: category
          in: query
          required: false
          description: "A category's id: only rows filed under it or under a category inside it; 400 when the family has no such category. `none`: only the rows that can take a category (Operation.categorizable) and have none."
          schema: { type: string }
      responses:
        "200":
          description: One page of the account's journal, newest first, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operations:
    post:
      tags: [journal]
      operationId: createOperation
      description: >-
        Records one journal entry. The account's whole journal is replayed with the new row
        and the row is kept only if it computes.

        400 also for an entry that cannot happen to its paper's kind (decision Р-17), on an
        edit too: a buy or sell of a `currency` paper; a redemption other than of a bond, a
        fund or a `custom` paper; a dividend other than on a share, a fund or a `custom`
        paper; a coupon or an amortization other than on a bond or a `custom` paper. A
        broker's import is not held to it.

        409 says the replay refused, nothing finer: an oversell, a currency the position is
        not kept in, a transfer breakdown the history no longer matches, an overflow — and
        the refused row need not be the one posted. A client must not caption it with a
        cause; the body's English text is for a log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "201":
          description: Created operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/arrivals:
    post:
      tags: [journal]
      operationId: createArrival
      description: >-
        Records shares arriving from another broker on an account — a transfer_in with no
        sibling, for an account no importer feeds. A move between two of the owner's accounts
        is POST /api/v1/operations/transfer instead. Without `purchases` the shares arrive
        bought for nothing (Position.has_unknown_cost) and can be given them later with
        PUT /api/v1/operations/{operationId}/purchases; with them, the same rules apply here.
        409 when the account's journal cannot take the arrival — a position already held in
        another currency, say.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateArrivalRequest" }
      responses:
        "201":
          description: The arrival as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/instruments/{instrumentId}/arrivals:
    get:
      tags: [journal]
      operationId: listArrivals
      description: >-
        Every occasion on which shares of this paper reached this account by a transfer, oldest
        first, each with the purchases recorded behind it. It is what a screen asking for the
        price of shares that arrived without one reads: an arrival from another broker can be
        given its purchases here; one moved from another of the owner's accounts names that
        account, which is where its purchases are to be stated.
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The arrivals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArrivalsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/operations/transfer:
    post:
      tags: [journal]
      operationId: createTransfer
      description: >-
        Creates a linked transfer_out/transfer_in pair moving instrument quantity between
        accounts with FIFO cost-basis carryover. Both accounts' journals are replayed, and its
        409 means what POST /api/v1/operations' does — that a replay refused, with no way to
        tell which of that status's several causes it was, nor which account's row.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Created pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/money-transfer:
    post:
      tags: [journal]
      operationId: createMoneyTransfer
      description: >-
        Moves money between two of the family's accounts: a withdrawal of `amount_minor` in
        `currency` from one and a deposit into the other, linked as one transfer
        (`transfer_group_id`), so that deleting either deletes both. The money arrives as it
        left unless `received_minor` and `received_currency` say otherwise — a transfer
        converted on the way. Both accounts' journals are replayed, as for any entry; 400 for
        the same account twice, an archived account, an amount that is not positive or past
        the bound every amount has, a malformed currency or date; 409 when a journal refuses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoneyTransferRequest" }
      responses:
        "201":
          description: Created pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}:
    put:
      tags: [journal]
      operationId: updateOperation
      description: >-
        Rewrites an operation entered by hand, in place: the body is the one POST
        /api/v1/operations takes, and account_id and type must be the operation's own (400
        otherwise). The row keeps its id and its place among the operations of its day. 409, with
        the engine's reason, when the journal no longer replays with the edit. 400 when the
        operation is not editable: `source` is neither `manual` nor `csv` (a broker or the registry owns it), or it is one
        leg of a transfer, conversion or spin-off, or shares that arrived from another broker —
        those are deleted and entered again.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOperationRequest" }
      responses:
        "200":
          description: The operation as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [journal]
      operationId: deleteOperation
      description: >-
        Deletes the operation (both halves of a transfer). 409 when the remaining journal no
        longer replays. Only a `manual` or `csv` row can be deleted: a broker's or the
        registry's would be written back; a `csv` row returns if the same table is loaded
        again.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}/purchases:
    put:
      tags: [journal]
      operationId: statePurchases
      description: >-
        States what units that arrived from another broker cost and when they were bought.
        Only on a transfer_in with no sibling (`transfer_group_id` null); 400 otherwise. The
        purchases become the arrival's breakdown and amount_minor their sum, replacing
        earlier ones; an import keeps them across syncs. Units moved on to the owner's other
        accounts with a breakdown are released again from the restated history, both legs of
        each move rewritten in the same transaction; a basis given by hand stays. 409 with
        the engine's reason when the journal cannot take it; 400 when a move took the units
        into an archived account.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatePurchasesRequest" }
      responses:
        "200":
          description: The arrival as stored, with its new basis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operations/receipt:
    get:
      tags: [journal]
      operationId: findReceipt
      description: >-
        The space's rows whose note names this cash receipt — «ФН {fn}, ФД {fd}», as the receipt dialog
        writes it — newest first, at most five: so the dialog can warn before the same receipt is
        written twice. Empty when there are none.
      parameters:
        - { name: fn, in: query, required: true, schema: { type: string, pattern: "^[0-9]{1,20}$" }, description: "The fiscal drive's number" }
        - { name: fd, in: query, required: true, schema: { type: string, pattern: "^[0-9]{1,20}$" }, description: "The fiscal document's number" }
      responses:
        "200":
          description: The rows
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReceiptMatch" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operations/file-by-rules:
    post:
      tags: [journal]
      operationId: fileOperationsByRules
      description: >-
        Files every row that can take a category and has none — of one account, or of the whole
        family without `account_id` — under the category the first fitting rule names
        (GET /api/v1/category-rules). Rows no rule fits stay as they are; a filed row is never
        refiled. Answers how many were filed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileByRulesRequest" }
      responses:
        "200":
          description: How many rows were filed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileByRulesResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}/member:
    put:
      tags: [journal]
      operationId: setOperationMember
      description: >-
        Says whose a row is — the member who spent or earned it, on a shared card both partners
        pay with — or that it is the account owner's (null). Any row that can take a category
        (Operation.categorizable), a broker's included; a member of another family, or a row
        of another kind, is a 400. An import keeps it as it keeps a category. Nothing the
        figures are computed from changes; the money report reads it (GET /api/v1/cashflow,
        `member`).
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMemberRequest" }
      responses:
        "200":
          description: The row as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}/category:
    put:
      tags: [journal]
      operationId: setOperationCategory
      description: >-
        Files a row under a category, or takes it out of one (null). Any row that can take a
        category (Operation.categorizable), a broker's included: the category is the family's
        reading of the row, and an import keeps it — a row it leaves alone keeps its category,
        and a corrected record (same account, external id and type) takes over the category
        of the one it replaces. A deposit or interest takes an income category, a withdrawal,
        fee or tax an expense one; an archived category only where the row already has it.
        Anything else is a 400. Nothing the figures are computed from changes.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCategoryRequest" }
      responses:
        "200":
          description: The row as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/operations/{operationId}/withheld-abroad:
    put:
      tags: [journal]
      operationId: stateWithheldAbroad
      description: >-
        States the tax withheld abroad from the dividend payment this row belongs to, as the
        broker's statement gives it (decision Р-14). It takes the place of the estimate in
        Operation.withheld_abroad, whose `state` becomes `stated`. Stored per payment — account,
        paper and day — so it holds for every row of that payment and survives an import
        rewriting the row; an imported row may carry it. Only a dividend on a paper: anything
        else is a 400.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StateWithheldRequest" }
      responses:
        "204": { description: Stated }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [journal]
      operationId: clearWithheldAbroad
      description: Removes the stated tax, bringing the estimate back. Nothing stated is not an error.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cleared }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/accounts/{accountId}/positions:
    get:
      tags: [portfolio]
      operationId: listAccountPositions
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Open positions computed from the journal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/token-check:
    post:
      tags: [tinvest]
      operationId: checkTinvestToken
      description: >-
        Asks the broker which T-Invest accounts a read-only token sees, so the owner can
        pick before anything is stored; nothing is written. Owner-only (403 otherwise). 400:
        the token is empty or the broker refused it — needs another token. 502: the broker
        could not be reached or answered unusably — worth retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TinvestTokenCheckRequest" }
      responses:
        "200":
          description: The importable accounts this token can see
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestTokenCheckResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections:
    get:
      tags: [tinvest]
      operationId: listTinvestConnections
      description: >-
        Every T-Invest connection of the caller's space. Owner-only.
      responses:
        "200":
          description: The space's connections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnectionsResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [tinvest]
      operationId: createTinvestConnection
      description: >-
        Connects a broker token and starts the first import. Owner-only. For each picked
        broker account it creates a new ruble brokerage account at «Т-Банк» (never an
        existing one), links them and queues the first sync; the run log shows the import.
        400: the broker refused the token (nothing is created). 409: a picked broker account
        is already imported by another connection of this space. 422: a picked account is
        not in the list the broker returns now, or is of a kind this program does not
        import.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTinvestConnectionRequest" }
      responses:
        "201":
          description: The connection, its linked accounts, and a queued first sync
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}:
    get:
      tags: [tinvest]
      operationId: getTinvestConnection
      description: One connection of the caller's space. Owner-only.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [tinvest]
      operationId: updateTinvestConnection
      description: >-
        Replaces the connection's token, switches it on or off, or both. Owner-only. A new
        token is checked with the broker before it is stored, and a `token_revoked`
        connection becomes `active` on a token the broker accepts — unless the same request
        sends `status`. `status` takes only `active` and `disabled`; `token_revoked` is the
        server's own verdict.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTinvestConnectionRequest" }
      responses:
        "200":
          description: The updated connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [tinvest]
      operationId: deleteTinvestConnection
      description: >-
        Withdraws the connection. Owner-only. The token, links, mirror, instrument map and
        run log go; the accounts and the journal operations the import wrote stay, and stop
        being updated.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Disconnected; the accounts and their operations remain }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/sync:
    post:
      tags: [tinvest]
      operationId: syncTinvestConnection
      description: >-
        Asks for this connection to be synced now. Owner-only.


        202 AND NOT 200: the sync is queued, not performed. The same queue and
        the same uniqueness the hourly schedule uses, so a manual request and a
        scheduled one can never run over one connection at the same time — see
        TinvestSyncAcceptedResponse.queued for what happens when one is already
        there.


        409 when the connection is not `active`: a disabled connection is
        skipped by the scheduler too, and one at `token_revoked` has no working
        token to sync with. Both need an act from the owner (PATCH) rather than
        a retry.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Queued, or already in the queue — see `queued`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestSyncAcceptedResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/runs:
    get:
      tags: [tinvest]
      operationId: listTinvestSyncRuns
      description: >-
        The connection's sync log, newest first, one page at a time.
        Owner-only.


        A LIMIT ABOVE THE `maximum` BELOW IS REFUSED WITH 400, NOT QUIETLY
        REDUCED. A ceiling the document states and the server does not apply is
        not a rule at all (#118): the request would be answered as if it had
        asked for something else, with nothing in the answer saying that the
        number it sent was not the number applied.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the run log, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestSyncRunsResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/connections/{connectionId}/unparsed:
    get:
      tags: [tinvest]
      operationId: listTinvestUnparsedOperations
      description: >-
        The connection's broker operations that this program could not turn into
        journal entries, newest first, one page at a time. Owner-only.


        THEY ARE NOT LOST AND NOT HIDDEN: each carries the broker's own record
        of the operation, including the raw element it sent, and a code saying
        why the projection refused it. A limit above the maximum is refused with
        400, for the reason the run log gives.
      parameters:
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: One page of the unparsed operations, saying whether there is more behind it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestUnparsedResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/links/{linkId}/explanations:
    post:
      tags: [tinvest]
      operationId: explainTinvestRows
      description: >-
        Accounts for one or more of this linked account's broker rows with one hand-written
        journal operation — how the owner says what an event the broker sent as plain money
        rows was (a fund's partial redemption, a conversion). Owner-only. The rows stop
        being projected and stop counting as unparsed; journal entries they had produced are
        removed in the same transaction, so the operation is judged against the journal it
        leaves. The operation is validated and replayed like any hand entry: 400 for a
        malformed one, 409 with the engine's sentence when the journal cannot hold it; 404
        for a content key not of this link; 409 for a row already explained.
      parameters:
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TinvestExplainRequest" }
      responses:
        "201":
          description: The manual operation was created and the rows are accounted for by it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestExplanationResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/tinvest/explanations/{explanationId}:
    delete:
      tags: [tinvest]
      operationId: deleteTinvestExplanation
      description: >-
        Take back an explanation. Owner-only.


        THE MANUAL OPERATION GOES WITH IT — that is the action, not a side
        effect: the operation is deleted from the journal and the explanation
        rows naming it follow through the table's own foreign key, so nothing
        can be left pointing at an operation that is gone. Every row the
        operation was accounting for is projected again on the next sync, and
        lands back on the unparsed list if that is what it was.


        Deleting the operation from the journal screen instead does exactly the
        same thing, by the same key. 404 when this space has no such
        explanation.
      parameters:
        - { name: explanationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The explanation and its operation are gone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TinvestExplanationRemoved" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    SetupStatus:
      type: object
      required: [setup_needed, code_required]
      properties:
        setup_needed: { type: boolean }
        code_required: { type: boolean, description: "Whether setup asks for the one-time code the server wrote to its log when it started. True on a running installation; false where the server was built without one (tests)." }
    SetupRequest:
      type: object
      description: "Creates the first user, the space and the owner membership, and only while the instance has no users at all — a second call is a 409. The four rules below are the ones internal/family/auth.go, Setup applies, and each of them is a 400."
      required: [space_name, username, display_name, password]
      properties:
        setup_code: { type: string, maxLength: 64, description: "The one-time code from the server's log (see SetupStatus.code_required). A wrong or missing code, where one is required, is a 403." }
        space_name:
          type: string
          maxLength: 100
          minLength: 1
          description: "What to call the space. Refused EMPTY or longer than 100 characters (family.MaxNameRunes, counted as Unicode code points) and nothing more: a name of one character is accepted, and so is one made of nothing but blanks — the server compares against \"\" and does not trim. The floor is declared because a client validating against this document should not have to send a request to learn that \"\" is not a name; no shape is stated because the server checks none."
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          description: "Lowercase letters, digits and underscore, three to thirty-two of them. That is the WHOLE rule (family.UsernamePattern, applied in validateCredentials), and it is applied at both doors that create a user — here and on CreateMemberRequest — so the pattern is declared at both. Anything else is a 400. Taken already is a 409 rather than a 400: the name is well formed, the conflict is with a row that exists. NOT DECLARED ON LoginRequest, which checks no shape at all — see it."
        display_name:
          type: string
          maxLength: 100
          minLength: 1
          description: "What to call the person. Same rule and same reasoning as space_name above: refused empty or past 100 characters, not trimmed, no shape."
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: "From 8 to 1024 characters, counted as Unicode code points. Not declared on LoginRequest — see it."
    CreateArrivalRequest:
      type: object
      required: [account_id, instrument_id, occurred_on, quantity, currency]
      properties:
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD the shares arrived; the same bounds as an operation's." }
        quantity: { type: string, description: "Decimal as string: positive, at most 10 decimal places." }
        currency: { type: string, pattern: "^[A-Z]{3}$", description: "The paper's currency — what its purchases were paid in." }
        note: { type: string, maxLength: 1000 }
        purchases:
          type: array
          items: { $ref: "#/components/schemas/StatedPurchase" }
          description: "The purchases behind the shares, when known — the same rules as StatePurchasesRequest. Omitted or empty: bought for nothing until stated."
    ArrivalsResponse:
      type: object
      required: [arrivals]
      properties:
        arrivals:
          type: array
          items: { $ref: "#/components/schemas/Arrival" }
    Arrival:
      type: object
      required: [operation_id, occurred_on, quantity, currency, cost_minor, source, note, from_another_broker, from_account_id, purchases]
      properties:
        operation_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD the shares arrived." }
        quantity: { type: string, description: "Decimal as string." }
        currency: { type: string }
        cost_minor: { type: integer, format: int64, description: "The arrival's basis in minor units of `currency`: 0 for shares that arrived bought for nothing." }
        source: { type: string, description: "Who wrote the row: manual, or the importer that did." }
        note: { type: string }
        from_another_broker: { type: boolean, description: "True for shares with no other half in this program — the ones PUT /api/v1/operations/{operationId}/purchases accepts." }
        from_account_id: { type: string, format: uuid, nullable: true, description: "For shares moved from another of the owner's accounts, that account: their purchases are stated where they first arrived. Null otherwise." }
        purchases:
          type: array
          items: { $ref: "#/components/schemas/ArrivalPurchase" }
          description: "The purchases recorded behind the shares, in the order they were stated or released. Empty when none are — a basis given by hand as a total, or none at all."
    ArrivalPurchase:
      type: object
      required: [quantity, cost_minor, acquired_on]
      properties:
        quantity: { type: string, description: "Decimal as string." }
        cost_minor: { type: integer, format: int64, description: "What these shares cost in all, commission included, in minor units of the arrival's currency." }
        acquired_on: { type: string, nullable: true, description: "Date YYYY-MM-DD they were bought, or null when not recorded." }
    StatePurchasesRequest:
      type: object
      required: [purchases]
      properties:
        purchases:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/StatedPurchase" }
          description: "Every purchase behind the arrival. Their quantities must add up to exactly the quantity that arrived, because they become the lots those shares are held as."
    StatedPurchase:
      type: object
      required: [quantity]
      properties:
        quantity: { type: string, description: "Decimal as string: positive, at most 10 decimal places." }
        price:
          type: string
          nullable: true
          description: "Money per share, in MAJOR units of the arrival's currency. The server strikes the cost from it, rounded as a buy's amount is, so a client never computes money. Give this or cost_minor, not both."
        cost_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000000000
          description: "What these shares cost in all, in minor units of the arrival's currency, for when only the total is known. Give this or price, not both."
        fee_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "Commission paid on the purchase, in minor units; added to its cost, as it is to every purchase's lot. 0 when omitted."
        acquired_on:
          type: string
          nullable: true
          description: "Date YYYY-MM-DD the shares were bought: not after the day they arrived. Optional — a price without its day still counts, but cannot be converted into another currency (Position.has_undated_lots)."
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 1024 }
        new_password:
          type: string
          minLength: 8
          maxLength: 1024
          description: "The same rule as SetupRequest.password: eight to 1024 characters, counted as Unicode code points."
    LoginRequest:
      type: object
      description: >-
        Neither field states the shape SetupRequest requires, on purpose: login checks no
        shape, and every failure — a malformed name, an unknown one, a wrong password — is
        the same 401, so users cannot be enumerated. A length rule here would lock out
        passwords set under an earlier rule.
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    UserInfo:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    SessionInfo:
      type: object
      required: [user, role, space_id, space_name, base_currency, tax_residency, full_valuation, cost_basis_rules]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        role: { $ref: "#/components/schemas/Role" }
        space_id: { type: string, format: uuid }
        space_name: { type: string }
        base_currency: { type: string, description: "ISO-4217, e.g. RUB" }
        full_valuation: { $ref: "#/components/schemas/FullValuation" }
        tax_residency:
          type: string
          description: "The OWNER'S country of tax residency, ISO 3166-1 alpha-2 (e.g. RU). A property of the person, not of an account: a Russian resident declares a foreign broker's account by Russian rules too, so it is set once per space and applies to every account in it. Defaults to RU."
        cost_basis_rules:
          description: >-
            What tax_residency implies for the cost basis this application computes (always
            FIFO within one account). It qualifies every cost basis the API publishes —
            positions and a transfer's amount in the journal alike — and is published here,
            once per session, and repeated on PositionsResponse; the journal does not repeat
            it.
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
    PriceSource:
      type: string
      enum: [market, manual, nav, foreign]
    FullValuation:
      type: string
      enum: [liquid, nav, nav_and_foreign]
      description: "Where the space's full valuation starts (decision Р-11). `liquid`: the full valuation equals the liquid one — a paper the market does not price now counts as nothing. `nav`: a fund is valued at its net asset value per unit where one is published. `nav_and_foreign` (the default): also a foreign share at its home exchange's close, converted at the official rate. Past those, a paper is valued at its latest price of any source, a price stated by hand included."
    UpdateSpaceRequest:
      type: object
      description: "Partial update of the space. Every field is optional and an omitted field is left unchanged, but at least one must be present — an empty body is rejected rather than silently accepted as a no-op. minProperties enforces that in the schema itself, not only in this description, so a schema-aware client can reject an empty body without a round trip."
      minProperties: 1
      properties:
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. Changing it changes the currency every converted figure in this API is published in; nothing stored is rewritten, since those figures are computed on the way out."
        full_valuation: { $ref: "#/components/schemas/FullValuation" }
        tax_residency:
          type: string
          description: "ISO 3166-1 alpha-2 uppercase, e.g. RU. Must be one of the countries this application has cost basis rules for (GET /api/v1/tax-residencies lists them); anything else is a 400. An unrecognised code is never accepted and quietly treated as Russia — that silent substitution is the exact failure this field exists to prevent."
    CostBasisMethod:
      type: string
      description: "How a jurisdiction decides WHICH of the parcels held are the ones a sale disposed of. `fifo`: the earliest acquisitions, in order. `average`: no parcels at all — one pooled average cost per instrument. `specific_lot`: the taxpayer nominates the parcel. `not_applicable`: the country does not tax an individual's capital gains, so nothing has to be matched. `unknown`: the stored country has no rules row in this application (see CostBasisNotice.unknown_country)."
      enum: [fifo, average, specific_lot, not_applicable, unknown]
    CostBasisPerimeter:
      type: string
      description: "Over WHICH holdings that queue is built. `account`: separately per account/depot. `owner`: across everything the owner holds, wherever it sits — representable here but NOT implemented; a country carrying it is reported as unsupported. `not_applicable`: no queue exists to scope (the taxpayer picks the parcel, or gains are untaxed). `unknown`: no rules row for the stored country."
      enum: [account, owner, not_applicable, unknown]
    CostBasisNotice:
      type: string
      description: "One way the computation fails to answer for the owner's country; a code the interface translates. `method_mismatch`: the country matches disposals by another method. `perimeter_mismatch`: its queue spans more than one account. `not_taxed`: it does not tax an individual's capital gains, so the figures are informational. `unknown_country`: no rules row for the stored country."
      enum: [method_mismatch, perimeter_mismatch, not_taxed, unknown_country]
    CostBasisRules:
      type: object
      description: "The cost basis rules of one country, derived from its ISO 3166-1 alpha-2 code through a single table in the server. The figures this application publishes are ALWAYS computed FIFO within one account; this object says whether that is what the country actually requires, and names every way it is not."
      required: [country, method, perimeter, supported, notices]
      properties:
        country: { type: string, description: "ISO 3166-1 alpha-2 the row was derived from" }
        method: { $ref: "#/components/schemas/CostBasisMethod" }
        perimeter: { $ref: "#/components/schemas/CostBasisPerimeter" }
        supported:
          type: boolean
          description: "True only when this country's method and perimeter are exactly what the application computes — FIFO within one account — and the country taxes capital gains at all. When false, `notices` is non-empty and says why; the figures are still returned, because a cost basis is also plainly \"what I paid\", but they must not be presented as this country's tax basis."
        notices:
          type: array
          items: { $ref: "#/components/schemas/CostBasisNotice" }
          description: "Empty exactly when `supported` is true. Several can apply at once (Britain pools by average AND across all of the owner's holdings) and all of them are listed: reporting only the first would hide a real divergence behind another one."
    Role:
      type: string
      enum: [owner, editor, viewer]
    MemberInfo:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    CreateMemberRequest:
      type: object
      description: "Adds a family member. Owner-only (403 otherwise). The three rules below are the second door user credentials are written through — internal/family/auth.go, CreateMember — and each of them is the same rule Setup applies, which is why each is declared in both places."
      required: [username, display_name, password, role]
      properties:
        username:
          type: string
          pattern: "^[a-z0-9_]{3,32}$"
          description: "Same rule as SetupRequest.username — see it, including why LoginRequest carries none."
        display_name:
          type: string
          maxLength: 100
          minLength: 1
          description: "What to call the person. Refused EMPTY or longer than 100 characters (family.MaxNameRunes) and nothing more: the server compares against \"\" and does not trim, so a name of nothing but blanks is accepted here even though the member dialog's own Save button will not offer it."
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: "Same rule as SetupRequest.password — see it, including why the count is in code points and why LoginRequest carries none."
        role: { $ref: "#/components/schemas/Role" }
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AccountType:
      type: string
      enum: [brokerage, checking, savings, deposit, credit_card, loan, cash]
    AccountStatus:
      type: string
      enum: [active, archived]
    AccountWithBalance:
      type: object
      required: [id, name, type, currency, institution, status, created_at, valued_by_balance, trades_abroad, kept_by_operations, counted_by]
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        currency: { type: string }
        institution: { type: string }
        status: { $ref: "#/components/schemas/AccountStatus" }
        created_at: { type: string, format: date-time }
        balance: { $ref: "#/components/schemas/BalancePoint" }
        balance_in_base:
          nullable: true
          description: "Account's balance converted into the space's base currency at today's fx rate. Null when the account has no balance, its currency already equals base_currency (nothing to convert), or no fx rate could be resolved."
          allOf:
            - $ref: "#/components/schemas/MoneyInBase"
        valued_by_balance:
          type: boolean
          description: "The family's choice for a brokerage account kept by its operations: count it in the total by its balance rather than by its journal, while the journal's history is incomplete. False until somebody sets it (UpdateAccountRequest.valued_by_balance). On any other kind of account it is stored and means nothing — those are always counted by their balance."
        kept_by_operations:
          type: boolean
          description: "The family's choice for an everyday account — checking, savings, deposit, credit card, loan, cash: keep it by its operations, so the total counts its journal (the money its operations leave, a debt negative) reconciled with its latest balance mark, as a brokerage account is. False until somebody sets it (UpdateAccountRequest.kept_by_operations); then the account is counted by its balance, as before. Means nothing on a brokerage account."
        trades_abroad:
          type: boolean
          description: "Whether the account's broker trades on foreign exchanges (Freedom Finance Kazakhstan, Interactive Brokers): a foreign share held there sells at its home exchange's close, which then counts as its market price — in the liquid valuation and the account's total — when no market price of the broker or the Moscow Exchange is fresher (decision Р-20). False until somebody sets it; on a Russian broker's account that close stays a reference for the full valuation only, since what the depository froze does not sell at it."
        counted_by:
          type: string
          enum: [journal, balance]
          description: "Which figure GET /summary counts for this account (the owner's ruling on Р-2, 2026-10-02). `journal`: an active account with at least one operation that is a brokerage account not valued_by_balance, or an everyday account kept_by_operations — its worth is journal.amount_minor, holdings at market price plus the cash its operations leave. `balance`: everything else — the latest balance mark, as before, or nothing if there is none. Archived accounts are `balance` and counted nowhere. Only brokerage accounts enter the family's return."
        journal:
          nullable: true
          description: "What the account is worth by its journal, with the reconciliation against its balance. Present on every ACTIVE account with at least one operation, whichever figure counted_by names, so an account counted by its balance can still say what its journal comes to. Null on every other account."
          allOf:
            - $ref: "#/components/schemas/AccountJournal"
    AccountJournal:
      type: object
      required: [amount_minor, full_amount_minor, currency, unpriced_positions, not_traded_positions, missing_rates, negative_cash, reconciliation]
      properties:
        amount_minor:
          type: integer
          format: int64
          description: "THE LIQUID WORTH (decision Р-11): open holdings at the market price they can be sold at now — none for a paper that does not trade — plus each currency's cash by the journal, each currency converted once at today's rate into the base currency. The same figures the account's positions screen shows. Holdings with no price add nothing; currencies with no rate are left out (both named below)."
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        full_amount_minor: { type: integer, format: int64, description: "The same worth by the FULL valuation (decision Р-11): every holding at its full price — a fund's net asset value or a foreign share's home-exchange close where the space allows it, else its latest price of any source (Position.price_source) — plus the same cash. amount_minor is the liquid one." }
        unpriced_positions: { type: integer, description: "Open holdings amount_minor counts as nothing: no market price within a month (the paper does not trade, or nothing prices it), or a kind of paper with no valuation model." }
        not_traded_positions: { type: integer, description: "Of unpriced_positions, how many full_amount_minor still values: papers that do not trade now but have a price of another kind." }
        missing_rates:
          type: array
          items: { type: string }
          description: "Currencies held with no rate into the base currency today; what is held in them is left out of amount_minor. Sorted; empty when everything converted."
        negative_cash:
          type: array
          items: { type: string }
          description: "Currencies whose cash by the journal is below zero: money spent that the journal never saw arrive, usually a deposit nobody recorded. Sorted; empty when none."
        reconciliation:
          nullable: true
          description: "The journal's figure against the account's latest balance mark. Null when there is no balance mark, or the mark cannot be put into the base currency for want of a rate."
          allOf:
            - $ref: "#/components/schemas/AccountReconciliation"
    AccountReconciliation:
      type: object
      required: [status, balance_as_of, compared_on, balance_in_base_minor, difference_minor]
      properties:
        status:
          type: string
          enum: [agrees, close, differs, stale]
          description: "`agrees`: within 1% of the balance. `close`: within 5% — the expected gap between a broker's figure, struck at the last trade, and this program's, struck at a session's close. `differs`: further apart than that — most likely operations missing from the journal. `stale`: no verdict — the balance mark is more than 3 days old and the journal could not be valued whole on its day (no operations by then, a paper with no closing price that day, a currency with no rate); the figures are still published. The thresholds are this program's own (see internal/account/valuation.go)."
        balance_as_of: { type: string, description: "Date YYYY-MM-DD of the balance mark compared against" }
        compared_on: { type: string, description: "Date YYYY-MM-DD the journal is valued on for the comparison: today for a mark at most 3 days old, the mark's own day for an older one" }
        balance_in_base_minor: { type: integer, format: int64, description: "That balance in the base currency at the rate of compared_on (the balance itself when the account is in the base currency)" }
        difference_minor: { type: integer, format: int64, description: "The journal's worth on compared_on minus balance_in_base_minor: negative when the journal comes to less than the balance. On compared_on today the journal's worth is AccountJournal.amount_minor." }
    BalancePoint:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    MoneyInBase:
      type: object
      required: [amount_minor, currency, rate_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Amount in the base currency's minor units" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the fx rate actually used for this conversion" }
    CreateAccountRequest:
      type: object
      required: [name, type, currency]
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: "What to call the account. Refused EMPTY or longer than 100 characters (account.MaxNameRunes, counted as Unicode code points) and nothing more (internal/account/http.go, handleCreate): the server compares against \"\" and does not trim, so a name of nothing but blanks is accepted. The floor is stated because a client validating against this document should not need a round trip to learn that \"\" is not a name; no shape is stated because the server checks none."
        type: { $ref: "#/components/schemas/AccountType" }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. It cannot be changed afterwards — UpdateAccountRequest carries no currency — because the balance marks recorded against the account carry no currency of their own and are denominated in this one."
        institution: { type: string, maxLength: 100 }
        owner_user_id: { type: string, format: uuid, nullable: true }
        trades_abroad: { type: boolean, description: "See AccountWithBalance.trades_abroad. Omitted, false." }
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          description: "Same rule as on creation — refused empty or past 100 characters, not trimmed (internal/account/http.go, handleUpdate). OMITTING the field leaves the name as it stands; that is what a PATCH does with a field it does not carry, and it is a different thing from sending \"\", which is the refusal this floor states."
        institution: { type: string, maxLength: 100 }
        owner_user_id: { type: string, format: uuid, nullable: true }
        status: { $ref: "#/components/schemas/AccountStatus" }
        valued_by_balance: { type: boolean, description: "See AccountWithBalance.valued_by_balance. Omitted, it stays as it is." }
        trades_abroad: { type: boolean, description: "See AccountWithBalance.trades_abroad. Omitted, it stays as it is." }
        kept_by_operations: { type: boolean, description: "See AccountWithBalance.kept_by_operations. Omitted, it stays as it is." }
    SetBalanceRequest:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor:
          type: integer
          format: int64
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: "Negative for a debt (a card, a loan). Within ±10^15 minor units, the cap every amount in this API carries; past it, 400. Rows written before the bound are returned as they stand."
    TradingModeKind:
      type: string
      nullable: true
      enum: [order_book, negotiated, off_exchange, unknown]
      description: >-
        What kind of trading mode `trading_mode` is. `order_book`: an exchange's anonymous
        («безадресная») mode. `negotiated`: an exchange's addressed («адресная») mode — a
        named counterparty, still on the exchange. `off_exchange`: away from an exchange
        ("FINEX_OTC"). `unknown`: a code with no source here (the Saint Petersburg boards
        among them); the client shows the code itself. Moscow Exchange boards are classified
        by the exchange's own board titles (see internal/importer/tinvest/tradingmode.go).
        Evidence, not a tax verdict: whether a security is «обращающаяся» (НК РФ ст. 214.1
        п. 9) is a property of the security, not of one deal's venue. Null exactly when
        `trading_mode` is.
    CurrencyTotal:
      type: object
      required: [currency, assets_minor, liabilities_minor, net_minor]
      properties:
        currency: { type: string }
        assets_minor: { type: integer, format: int64 }
        liabilities_minor: { type: integer, format: int64, description: "Negative or zero" }
        net_minor: { type: integer, format: int64 }
    ImportField:
      type: string
      enum: [date, type, instrument, quantity, price, amount, currency, fee, note, counterparty, category]
      description: "`counterparty`: who the money went to or came from. `category`: a category of the family's by its name, or «Родитель / Дочерняя» as the export writes it; a name that fits none, or more than one, leaves the row unfiled."
    ImportMapping:
      type: object
      required: [has_header, columns, types]
      properties:
        has_header: { type: boolean, description: "Whether the table's first line is a header rather than an operation" }
        columns:
          type: object
          description: "Field name → 0-based column index. A field with no column is absent. `instrument` takes an ISIN or a ticker; a trade with no `amount` has it worked out from quantity × price."
          additionalProperties: { type: integer, minimum: 0 }
        types:
          type: object
          description: "Value of the type column (compared ignoring case and surrounding blanks) → operation type. Only buy, sell, deposit, withdrawal, dividend, coupon, interest, tax, fee and amortization. With no type column — a bank's statement has none — the amount's sign says: minus is a withdrawal, plus a deposit, and a zero amount is not read."
          additionalProperties: { $ref: "#/components/schemas/OperationType" }
    ImportPreviewRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, description: "The CSV text. ';', ',' or a tab between cells; at most 5000 rows." }
        mapping: { $ref: "#/components/schemas/ImportMapping" }
    ImportedOperation:
      type: object
      required: [type, occurred_on, amount_minor, currency, fee_minor, note, counterparty, category_id]
      properties:
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        instrument_id: { type: string, format: uuid, nullable: true }
        quantity: { type: string, nullable: true }
        price: { type: string, nullable: true }
        amount_minor: { type: integer, format: int64, description: "Signed as the journal records the type: negative for buy, withdrawal, fee and tax" }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        counterparty: { type: string }
        category_id: { type: string, format: uuid, nullable: true, description: "The family's category the row will be filed under: named by the table, or found by the family's rules (an everyday account only); null when neither" }
    ImportRow:
      type: object
      required: [line, cells, verdict]
      properties:
        line: { type: integer, description: "The row's line in the file, from 1" }
        cells: { type: array, items: { type: string } }
        verdict:
          type: string
          enum: [new, duplicate, unparsed, refused]
          description: "`new`: would be recorded. `duplicate`: a row with the same content was imported from a table before (the nth identical row of a file matches the nth). `unparsed`: cannot be read — `reason` says why. `refused`: read, but the journal would not take it — `reason.code` is `engine_refused` and `reason.value` the journal's own words."
        reason:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImportRowReason"
        operation:
          nullable: true
          description: "What the row reads as; null when it is unparsed"
          allOf:
            - $ref: "#/components/schemas/ImportedOperation"
    ImportRowReason:
      type: object
      required: [code, field, value]
      description: "Why a row is not imported: a code for the screen to word, the field it stopped on and the cell's own text, untranslated — or, for engine_refused, the journal's words."
      properties:
        code:
          type: string
          enum: [no_type, type_not_mapped, no_date, bad_date, no_paper, paper_not_found, bad_currency, no_number, bad_number, too_precise, too_large, engine_refused]
        field:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImportField"
        value: { type: string }
    ImportPreview:
      type: object
      required: [mapping, header, rows]
      properties:
        mapping: { $ref: "#/components/schemas/ImportMapping" }
        header: { type: array, items: { type: string }, description: "The header's cells; empty when the table has none" }
        rows: { type: array, items: { $ref: "#/components/schemas/ImportRow" } }
    ImportAddedPaper:
      type: object
      required: [code, instrument_id, name, ticker]
      properties:
        code: { type: string, description: "The code as the table named the paper" }
        instrument_id: { type: string, format: uuid }
        name: { type: string }
        ticker: { type: string }
    ImportPapersResult:
      type: object
      required: [added, known, not_found]
      properties:
        added: { type: array, items: { $ref: "#/components/schemas/ImportAddedPaper" } }
        known: { type: array, items: { type: string } }
        not_found: { type: array, items: { type: string } }
    ImportTableRequest:
      type: object
      required: [content, mapping]
      properties:
        content: { type: string, description: "The CSV text, as for the preview" }
        mapping: { $ref: "#/components/schemas/ImportMapping" }
        file_name: { type: string, description: "The file's name, kept with the import for the person's own reference" }
    TableImport:
      type: object
      required: [id, account_id, file_name, mapping, rows_written, rows_duplicate, rows_unparsed, rows_refused, created_at, rolled_back_at, operations_left]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        file_name: { type: string }
        mapping: { $ref: "#/components/schemas/ImportMapping" }
        rows_written: { type: integer }
        rows_duplicate: { type: integer }
        rows_unparsed: { type: integer }
        rows_refused: { type: integer }
        created_at: { type: string, format: date-time }
        rolled_back_at: { type: string, format: date-time, nullable: true }
        operations_left: { type: integer, description: "How many of the operations it wrote are still in the journal" }
    ImportTableResult:
      type: object
      required: [import, rows]
      properties:
        import:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TableImport"
        rows: { type: array, items: { $ref: "#/components/schemas/ImportRow" } }
    InstrumentHoldings:
      type: object
      required: [instrument, holdings, total]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/InstrumentHolding" }
        total:
          allOf: [{ $ref: "#/components/schemas/InstrumentHoldingsTotal" }]
          nullable: true
          description: "The positions added up, when they are all kept in one currency; null otherwise."
    InstrumentHolding:
      type: object
      required: [account_id, position]
      properties:
        account_id: { type: string, format: uuid }
        position: { $ref: "#/components/schemas/Position" }
    InstrumentHoldingsTotal:
      type: object
      description: "A figure is null when it is null on any position, or valued in another currency."
      required: [currency, quantity, cost_minor, market_value_minor, total_minor]
      properties:
        currency: { type: string }
        quantity: { type: string, description: "Decimal as string" }
        cost_minor: { type: integer, format: int64 }
        market_value_minor: { type: integer, format: int64, nullable: true }
        total_minor: { type: integer, format: int64, nullable: true }
    DayPrice:
      type: object
      required: [on, price, currency, source]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD" }
        price: { type: string, description: "Decimal as string" }
        currency: { type: string }
        source: { type: string, description: "Where the price came from: moex, moex_history, tinvest, tinvest_history, manual, seed, …" }
    SpaceExport:
      type: object
      required: [format, version, exported_at, space, members, accounts, instruments, instrument_events, manual_prices, categories, category_rules]
      properties:
        format: { type: string, enum: [babki.my/space-export] }
        version: { type: integer, description: "1. Raised when a field changes meaning or goes away; new fields may appear without it." }
        exported_at: { type: string, format: date-time }
        space: { $ref: "#/components/schemas/ExportSpace" }
        members:
          type: array
          items: { $ref: "#/components/schemas/ExportMember" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/ExportAccount" }
        instruments:
          type: array
          items: { $ref: "#/components/schemas/ExportInstrument" }
        instrument_events:
          type: array
          items: { $ref: "#/components/schemas/ExportInstrumentEvent" }
        manual_prices:
          type: array
          items: { $ref: "#/components/schemas/ExportManualPrice" }
        categories:
          type: array
          description: "The family's categories of spending and earning, archived ones too, each parent before its children"
          items: { $ref: "#/components/schemas/ExportCategory" }
        category_rules:
          type: array
          description: "The family's filing rules in the order they are tried"
          items: { $ref: "#/components/schemas/CategoryRule" }
    ExportCategory:
      type: object
      required: [id, kind, name, parent_id, archived, position]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "expense or income" }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        archived: { type: boolean }
        position: { type: integer }
    ExportSpace:
      type: object
      required: [id, name, base_currency, tax_residency]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_currency: { type: string }
        tax_residency: { type: string }
    ExportMember:
      type: object
      required: [username, display_name, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { type: string }
    ExportManualPrice:
      type: object
      required: [instrument_id, on, price, currency]
      properties:
        instrument_id: { type: string, format: uuid }
        on: { type: string, description: "Date YYYY-MM-DD" }
        price: { type: string, description: "Decimal as string: per unit, or percent of face for a bond" }
        currency: { type: string }
    ExportAccount:
      type: object
      required: [id, name, type, currency, institution, status, owner_username, valued_by_balance, trades_abroad, kept_by_operations, created_at, balances, operations, withheld_stated, loan, loan_prepayments, credit_card]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        currency: { type: string }
        institution: { type: string }
        status: { type: string }
        owner_username: { type: string, nullable: true, description: "The member the account is personal to; null for a shared one" }
        valued_by_balance: { type: boolean }
        trades_abroad: { type: boolean }
        kept_by_operations: { type: boolean }
        created_at: { type: string, format: date-time }
        balances:
          type: array
          description: Balance marks, oldest first
          items: { $ref: "#/components/schemas/ExportBalance" }
        operations:
          type: array
          description: The journal as stored, in the order it is folded
          items: { $ref: "#/components/schemas/ExportOperation" }
        withheld_stated:
          type: array
          description: "Taxes withheld abroad stated by hand (PUT /operations/{operationId}/withheld-abroad), oldest payment first"
          items: { $ref: "#/components/schemas/ExportWithheldStated" }
        loan_prepayments:
          type: array
          description: "A loan's prepayments (POST /accounts/{accountId}/loan/prepayments), oldest first; empty on every other account"
          items: { $ref: "#/components/schemas/LoanPrepayment" }
        loan:
          nullable: true
          description: "A loan account's terms (PUT /accounts/{accountId}/loan); null on every other account"
          allOf:
            - $ref: "#/components/schemas/LoanTerms"
        credit_card:
          nullable: true
          description: "A credit card's terms (PUT /accounts/{accountId}/credit-card); null on every other account"
          allOf:
            - $ref: "#/components/schemas/CreditCardTerms"
    ExportOperation:
      type: object
      required: [id, type, occurred_on, settled_on, instrument_id, quantity, price, amount_minor, currency, fee_minor, note, trading_mode, transfer_group_id, split_ratio, face_before_minor, source, external_id, created_at, lots, category_id, counterparty, member_username]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true }
        instrument_id: { type: string, format: uuid, nullable: true }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price: { type: string, nullable: true, description: "Decimal as string" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        trading_mode: { type: string, nullable: true }
        transfer_group_id: { type: string, format: uuid, nullable: true }
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
        face_before_minor: { type: integer, format: int64, nullable: true, description: "On an amortization: the outstanding face value per unit before it, in minor units" }
        source: { type: string }
        external_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        category_id: { type: string, format: uuid, nullable: true, description: "One of the document's categories" }
        counterparty: { type: string }
        member_username: { type: string, nullable: true, description: "Whose the row is (Operation.member_id), by the member's username; null for the account owner's" }
        lots:
          type: array
          description: "The purchases a move carried — quantity, cost and day bought — when it carried any"
          items: { $ref: "#/components/schemas/ExportLot" }
    ExportWithheldStated:
      type: object
      required: [instrument_id, paid_on, tax_minor]
      properties:
        instrument_id: { type: string, format: uuid }
        paid_on: { type: string, description: "Date YYYY-MM-DD of the payment" }
        tax_minor: { type: integer, format: int64, description: "In minor units of the payment's currency" }
    ExportBalance:
      type: object
      required: [as_of, amount_minor]
      properties:
        as_of: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    ExportLot:
      type: object
      required: [quantity, cost_minor, acquired_on]
      properties:
        quantity: { type: string }
        cost_minor: { type: integer, format: int64 }
        acquired_on: { type: string, nullable: true }
    ExportInstrument:
      type: object
      required: [id, type, name, ticker, isin, figi, currency, face_value_minor, face_currency, frozen]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        face_value_minor: { type: integer, format: int64, nullable: true }
        face_currency: { type: string, nullable: true }
        frozen: { type: boolean }
    ExportInstrumentEvent:
      type: object
      required: [kind, isin, effective_on, ratio_from, ratio_to, result_isin, basis_share, source, source_ref, note]
      properties:
        kind: { type: string }
        isin: { type: string }
        effective_on: { type: string, description: "Date YYYY-MM-DD" }
        ratio_from: { type: integer, format: int64 }
        ratio_to: { type: integer, format: int64 }
        result_isin: { type: string }
        basis_share: { type: string, nullable: true }
        source: { type: string }
        source_ref: { type: string }
        note: { type: string }
    CategoryKind:
      type: string
      enum: [expense, income]
      description: "expense: money going out (a withdrawal names it); income: money coming in (a deposit names it)"
    Payout:
      type: object
      required: [on, record_on, kind, instrument_id, account_id, quantity, per_unit, amount_minor, currency, in_base_minor]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD the money is due" }
        record_on: { type: string, nullable: true, description: "Date YYYY-MM-DD of the record day, when the source gives one" }
        kind: { type: string, enum: [coupon, amortization, redemption, offer, dividend] }
        instrument_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string: what the account holds today" }
        per_unit: { type: string, nullable: true, description: "Decimal as string, per paper in `currency`; null for a floating coupon not yet set and for an offer" }
        amount_minor: { type: integer, format: int64, nullable: true, description: "per_unit × quantity in minor units of `currency`, before tax" }
        currency: { type: string }
        in_base_minor: { type: integer, format: int64, nullable: true, description: "amount_minor in the base currency at today's rate; null without an amount or a rate" }
    Benchmark:
      type: object
      required: [code, index_currency, complete, end_minor, annual_rate]
      properties:
        code: { type: string, enum: [MCFTR, RGBITR, SP500TR] }
        index_currency: { type: string }
        complete: { type: boolean }
        end_minor: { type: integer, format: int64, nullable: true, description: "What the model portfolio would be worth at `to`, in the base currency" }
        annual_rate: { type: string, nullable: true, description: "Its money-weighted annual rate, a fraction (decimal)" }
    Benchmarks:
      type: object
      required: [currency, from, to, benchmarks]
      properties:
        currency: { type: string }
        from: { type: string }
        to: { type: string }
        benchmarks: { type: array, items: { $ref: "#/components/schemas/Benchmark" } }
    PayoutCheck:
      type: object
      required: [on, record_on, kind, instrument_id, account_id, quantity, per_unit, amount_minor, currency, status, got_minor, got_currency, got_on]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD the money was due" }
        record_on: { type: string, description: "The record day held against" }
        kind: { type: string, enum: [coupon, amortization, redemption, dividend] }
        instrument_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string: what the account held the day before the record day" }
        per_unit: { type: string, nullable: true }
        amount_minor: { type: integer, format: int64, nullable: true, description: "What was due, gross, in currency; null for a floating coupon the source has no value for" }
        currency: { type: string }
        status: { type: string, enum: [received, short, missing, awaited] }
        got_minor: { type: integer, format: int64, description: "What the journal's rows come to, in got_currency; 0 when none" }
        got_currency: { type: string, nullable: true }
        got_on: { type: string, nullable: true, description: "The first row's day" }
    PayoutsForecast:
      type: object
      required: [base_currency, from, to, months, by_month, total_minor, payouts, missing_rates]
      properties:
        base_currency: { type: string }
        from: { type: string, description: "Date YYYY-MM-DD, today" }
        to: { type: string, description: "Date YYYY-MM-DD, the last day of the last month" }
        months: { type: array, items: { type: string }, description: "YYYY-MM, this month first" }
        by_month: { type: array, items: { type: integer, format: int64 }, description: "What each month's payouts come to in the base currency" }
        total_minor: { type: integer, format: int64 }
        payouts: { type: array, items: { $ref: "#/components/schemas/Payout" }, description: "Earliest first" }
        missing_rates: { type: array, items: { type: string }, description: "Currencies left out of the base figures for want of today's rate" }
    RecurringPayment:
      type: object
      required: [name, cadence, amount_minor, currency, account_id, category_id, last_on, next_on, count, overdue, hidden]
      properties:
        name: { type: string, description: "The counterparty, or the note, as last written, without trailing numbers" }
        cadence: { type: string, enum: [weekly, monthly, quarterly, yearly] }
        amount_minor: { type: integer, format: int64, description: "The usual amount, signed as the journal signs it: negative going out" }
        currency: { type: string }
        account_id: { type: string, format: uuid, description: "The account of the latest payment" }
        category_id: { type: string, format: uuid, nullable: true, description: "The latest payment's category" }
        last_on: { type: string, description: "Date YYYY-MM-DD of the latest payment" }
        next_on: { type: string, description: "Date YYYY-MM-DD the next one is due" }
        count: { type: integer, description: "How many payments the pattern rests on" }
        overdue: { type: boolean, description: "Its day has passed without it — late, or not entered yet" }
        hidden: { type: boolean, description: "The family said it is not regular (PUT /recurring/hidden): listed apart, out of the forecast" }
    RecurringKey:
      type: object
      required: [name, incoming, currency]
      properties:
        name: { type: string, maxLength: 200, description: "RecurringPayment.name; case and «ё» do not matter" }
        incoming: { type: boolean, description: "amount_minor above zero" }
        currency: { type: string }
    StructureSlice:
      type: object
      required: [key, minor]
      properties:
        key: { type: string, description: "The kind (shares, bonds, funds, currency, metals, crypto, other, broker_cash, money, deposits, broker_balance), the currency, the account's id, or the two-letter country — empty for what was not issued anywhere, «-» for a paper with no ISIN" }
        minor: { type: integer, format: int64, description: "In minor units of the base currency" }
    Structure:
      type: object
      required: [base_currency, valuation, assets_minor, debts_minor, by_class, by_currency, by_account, by_country, unpriced, missing_rates]
      properties:
        base_currency: { type: string }
        valuation: { type: string, enum: [liquid, full] }
        assets_minor: { type: integer, format: int64 }
        debts_minor: { type: integer, format: int64, description: "Negative or zero" }
        by_class: { type: array, items: { $ref: "#/components/schemas/StructureSlice" }, description: "Largest first" }
        by_currency: { type: array, items: { $ref: "#/components/schemas/StructureSlice" } }
        by_account: { type: array, items: { $ref: "#/components/schemas/StructureSlice" } }
        by_country: { type: array, items: { $ref: "#/components/schemas/StructureSlice" } }
        unpriced: { type: integer, description: "Papers left out for want of a price" }
        missing_rates: { type: array, items: { type: string }, description: "Currencies left out for want of today's rate" }
    LoanTerms:
      type: object
      required: [principal_minor, annual_rate, term_months, issued_on, kind]
      properties:
        principal_minor: { type: integer, format: int64, minimum: 1, description: "What was borrowed, in minor units of the account's currency" }
        annual_rate: { type: string, description: "Decimal as string: the yearly rate in percent, 0 to 999.9999" }
        term_months: { type: integer, minimum: 1, maximum: 600 }
        issued_on: { type: string, description: "Date YYYY-MM-DD the loan was issued; the first payment is a month later" }
        kind: { type: string, enum: [annuity, differentiated], description: "Equal payments, or an equal part of the debt plus the interest on what is left" }
    LoanRow:
      type: object
      required: [on, payment_minor, interest_minor, principal_minor, left_minor, prepaid]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD" }
        payment_minor: { type: integer, format: int64 }
        interest_minor: { type: integer, format: int64 }
        principal_minor: { type: integer, format: int64 }
        left_minor: { type: integer, format: int64, description: "The debt after this payment" }
        prepaid: { type: boolean, description: "Debt paid ahead of the schedule (LoanPrepayment), not a scheduled payment" }
    CreditCardTerms:
      type: object
      required: [limit_minor, statement_day, payment_days, grace_kind, grace_days, min_percent, min_floor_minor, annual_rate, own_rate]
      properties:
        limit_minor: { type: integer, format: int64, minimum: 0 }
        statement_day: { type: integer, minimum: 1, maximum: 31, description: "The day of the month the bank closes a statement period; a short month's last day stands for a later one" }
        payment_days: { type: integer, minimum: 0, maximum: 60, description: "Days after the statement to pay the minimum (and, for grace_kind statement, the whole statement)" }
        grace_kind: { type: string, enum: [statement, long] }
        grace_days: { type: integer, minimum: 0, maximum: 1100, description: "For grace_kind long: the days a period's purchases stay free from the period's start; 0 otherwise" }
        min_percent: { type: string, description: "The minimum payment, percent of the debt the statement shows (decimal)" }
        min_floor_minor: { type: integer, format: int64, minimum: 0, description: "The smallest minimum payment" }
        annual_rate: { type: string, description: "Percent a year charged once the grace is lost (decimal)" }
        own_rate: { type: string, nullable: true, description: "Percent a year the family's own money would earn instead, to weigh the card against (decimal); null until named" }
    CreditCardDue:
      type: object
      required: [on, amount_minor]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
    CreditCardLost:
      type: object
      required: [from, to, deadline, amount_minor, interest_minor]
      properties:
        from: { type: string, description: "The statement period's first day" }
        to: { type: string, description: "Its last day" }
        deadline: { type: string, description: "The day its purchases had to be paid by" }
        amount_minor: { type: integer, format: int64, description: "What is still owed of them" }
        interest_minor: { type: integer, format: int64, description: "Roughly the interest on it so far, at annual_rate from each purchase's day; the bank counts by its own rules" }
    CreditCardStatus:
      type: object
      required: [debt_minor, available_minor, last_statement, next_statement, minimum_minor, minimum_on, minimum_missed, minimum_estimate, grace, lost, non_grace_minor, non_grace_interest_minor]
      properties:
        debt_minor: { type: integer, format: int64, description: "Owed on the card; below zero the family's own money on it" }
        available_minor: { type: integer, format: int64, description: "What is left of the limit" }
        last_statement: { type: string, description: "The latest statement day on or before today" }
        next_statement: { type: string }
        minimum_minor: { type: integer, format: int64, description: "What is still to pay of the minimum payment due on minimum_on" }
        minimum_on: { type: string }
        minimum_missed: { type: boolean, description: "minimum_on has passed with the minimum unpaid" }
        minimum_estimate: { type: boolean, description: "The minimum is worked out from today's debt, not from a statement's" }
        grace: { type: array, items: { $ref: "#/components/schemas/CreditCardDue" }, description: "What to pay by which day so that purchases stay free of interest, soonest first; empty when counted by balance" }
        lost: { type: array, items: { $ref: "#/components/schemas/CreditCardLost" } }
        non_grace_minor: { type: integer, format: int64, description: "Money moved off the card, fees and interest charged still owed: interest from their day" }
        non_grace_interest_minor: { type: integer, format: int64 }
    CreditCardBenefit:
      type: object
      required: [from, to, own_rate_known, own_earned_minor, cashback_minor, costs_minor, pending_interest_minor, total_minor]
      properties:
        from: { type: string, description: "A year before today, or the card's first row when later" }
        to: { type: string }
        own_rate_known: { type: boolean, description: "The terms name own_rate; without it own_earned_minor is 0" }
        own_earned_minor: { type: integer, format: int64, description: "What the family's own money earned at own_rate on the debt the card carried each day" }
        cashback_minor: { type: integer, format: int64, description: "Money in under a cashback category, and interest paid to the card" }
        costs_minor: { type: integer, format: int64, description: "Fees, taxes, interest charged and rows under «Проценты по кредитам» or «Банковские комиссии», as a positive sum" }
        pending_interest_minor: { type: integer, format: int64, description: "Roughly the interest the lost grace and the money moved off the card run up (CreditCardStatus lost and non_grace), not in the journal yet" }
        total_minor: { type: integer, format: int64, description: "own_earned + cashback − costs − pending_interest; below zero the card cost more than own money would have" }
    CreditCard:
      type: object
      required: [terms, status, by_journal, benefit]
      properties:
        terms: { $ref: "#/components/schemas/CreditCardTerms" }
        status: { $ref: "#/components/schemas/CreditCardStatus" }
        by_journal: { type: boolean, description: "The status is worked out from the card's journal; false: from its last balance" }
        benefit:
          nullable: true
          description: "The card weighed against own money over the last year; null when counted by its balance"
          allOf:
            - $ref: "#/components/schemas/CreditCardBenefit"
    CreditCardSummary:
      type: object
      required: [account_id, name, currency, by_journal, status]
      properties:
        account_id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        by_journal: { type: boolean }
        status: { $ref: "#/components/schemas/CreditCardStatus" }
    PushKey:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, description: "Uncompressed P-256 point, base64url without padding" }
    PushSubscriptionRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: { type: string, maxLength: 2048 }
        p256dh: { type: string, maxLength: 256 }
        auth: { type: string, maxLength: 256 }
    PushTestResult:
      type: object
      required: [devices, delivered]
      properties:
        devices: { type: integer }
        delivered: { type: integer }
    ReceiptMatch:
      type: object
      required: [id, account_id, occurred_on, amount_minor, currency]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
    ForecastDay:
      type: object
      required: [on, balance_minor]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD" }
        balance_minor: { type: integer, format: int64, description: "The money at the end of the day, in the base currency" }
    ForecastEvent:
      type: object
      required: [on, name, kind, account_id, amount_minor, currency, in_base_minor, overdue]
      properties:
        on: { type: string, description: "Date YYYY-MM-DD" }
        name: { type: string, description: "The payee, or the loan account's name" }
        kind: { type: string, enum: [regular, loan] }
        account_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, description: "Signed as the journal signs it, in currency" }
        currency: { type: string }
        in_base_minor: { type: integer, format: int64, description: "The same in the base currency at today's rate" }
        overdue: { type: boolean, description: "A regular payment whose day has passed without it: expected today" }
    Forecast:
      type: object
      required: [base_currency, days, start_minor, accounts_counted, series, events, lowest, next_income, free_until_income_minor, missing_rates]
      properties:
        base_currency: { type: string }
        days: { type: integer }
        start_minor: { type: integer, format: int64, description: "The money today" }
        accounts_counted: { type: integer, description: "How many accounts the money is on" }
        series: { type: array, items: { $ref: "#/components/schemas/ForecastDay" }, description: "Today and each day after, `days` of them" }
        events: { type: array, items: { $ref: "#/components/schemas/ForecastEvent" } }
        lowest: { $ref: "#/components/schemas/ForecastDay" }
        next_income:
          nullable: true
          description: "The next salary: the next regular income of at least half the largest; null without one in sight"
          allOf:
            - $ref: "#/components/schemas/ForecastEvent"
        free_until_income_minor:
          type: integer
          format: int64
          nullable: true
          description: "The lowest the money gets before next_income: what can be spent until then without going below zero (below zero: what is short)"
        missing_rates: { type: array, items: { type: string }, description: "Currencies left out for want of today's rate" }
    Loan:
      type: object
      required: [terms, schedule, left_by_schedule_minor, next, total_interest_minor, prepayments]
      properties:
        terms: { $ref: "#/components/schemas/LoanTerms" }
        schedule: { type: array, items: { $ref: "#/components/schemas/LoanRow" } }
        left_by_schedule_minor: { type: integer, format: int64, description: "The debt the schedule leaves today" }
        next:
          nullable: true
          description: "The first payment due today or later; null once the schedule is through"
          allOf:
            - $ref: "#/components/schemas/LoanRow"
        total_interest_minor: { type: integer, format: int64, description: "All the interest the schedule charges" }
        prepayments: { type: array, items: { $ref: "#/components/schemas/LoanPrepayment" }, description: "Debt paid ahead of the schedule, oldest first; each reshapes it" }
    LoanPrepayment:
      type: object
      required: [id, on, amount_minor, mode]
      properties:
        id: { type: string, format: uuid }
        on: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64 }
        mode: { type: string, enum: [term, payment], description: "term: the payment stays and the loan ends sooner; payment: the end stays and the payment is lower" }
    LoanPrepaymentRequest:
      type: object
      required: [from_account_id, occurred_on, amount_minor, mode]
      properties:
        from_account_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        mode: { type: string, enum: [term, payment] }
    LoanPaymentRequest:
      type: object
      required: [from_account_id, occurred_on, principal_minor, interest_minor]
      properties:
        from_account_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        principal_minor: { type: integer, format: int64, minimum: 0 }
        interest_minor: { type: integer, format: int64, minimum: 0 }
    CashflowFlow:
      type: object
      required: [total_minor, by_month]
      properties:
        total_minor: { type: integer, format: int64, description: "Over the period, in minor units of the base currency" }
        by_month:
          type: array
          description: "One figure per month of CashflowReport.months, in its order"
          items: { type: integer, format: int64 }
    CashflowLine:
      type: object
      required: [category_id, group, total_minor, by_month, direct, children]
      properties:
        category_id: { type: string, format: uuid, nullable: true, description: "The category; null on a group" }
        group:
          type: string
          nullable: true
          enum: [interest, fee, tax]
          description: "Unfiled interest, fees or taxes off a broker's account; null on a category"
        total_minor: { type: integer, format: int64, description: "The line with everything under it" }
        by_month: { type: array, items: { type: integer, format: int64 } }
        direct: { $ref: "#/components/schemas/CashflowFlow" }
        children:
          type: array
          description: "The categories under this one that moved money, in their order; `direct` is what was filed under this one itself"
          items: { $ref: "#/components/schemas/CashflowLine" }
    CashflowSection:
      type: object
      required: [total_minor, by_month, lines]
      properties:
        total_minor: { type: integer, format: int64 }
        by_month: { type: array, items: { type: integer, format: int64 } }
        lines:
          type: array
          description: "Top-level categories that moved money, in their order, then groups"
          items: { $ref: "#/components/schemas/CashflowLine" }
    CashflowInvestments:
      type: object
      required: [deposited, withdrawn, payouts, interest, costs]
      properties:
        deposited: { $ref: "#/components/schemas/CashflowFlow" }
        withdrawn: { $ref: "#/components/schemas/CashflowFlow" }
        payouts: { $ref: "#/components/schemas/CashflowFlow" }
        interest: { $ref: "#/components/schemas/CashflowFlow" }
        costs: { $ref: "#/components/schemas/CashflowFlow" }
    CashflowReport:
      type: object
      required: [base_currency, from, to, months, income, expense, unfiled_in, unfiled_out, investments, missing_rates, left_out]
      properties:
        base_currency: { type: string }
        from: { type: string, description: "Date YYYY-MM-DD" }
        to: { type: string, description: "Date YYYY-MM-DD" }
        months: { type: array, items: { type: string }, description: "Each month the period touches, YYYY-MM, oldest first" }
        income: { $ref: "#/components/schemas/CashflowSection" }
        expense: { $ref: "#/components/schemas/CashflowSection" }
        unfiled_in: { $ref: "#/components/schemas/CashflowFlow" }
        unfiled_out: { $ref: "#/components/schemas/CashflowFlow" }
        investments: { $ref: "#/components/schemas/CashflowInvestments" }
        missing_rates: { type: array, items: { type: string }, description: "Currencies of rows left out for want of a rate on their day" }
        left_out: { type: integer, description: "How many rows were left out for want of a rate" }
    Category:
      type: object
      required: [id, kind, name, parent_id, archived, position]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        name: { type: string, maxLength: 60 }
        parent_id: { type: string, format: uuid, nullable: true, description: "The category it sits under; null on the top level" }
        archived: { type: boolean, description: "Kept for the operations naming it, out of the lists a new entry picks from" }
        position: { type: integer, description: "Its place among its siblings, smallest first" }
    CreateCategoryRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/CategoryKind" }
        name: { type: string, minLength: 1, maxLength: 60 }
        parent_id: { type: string, format: uuid, nullable: true }
    UpdateCategoryRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        parent_id: { type: string, format: uuid, nullable: true, description: "null moves it to the top level; absent leaves it" }
        archived: { type: boolean }
        position: { type: integer }
    BackgroundTask:
      type: object
      required: [id, kind, stage, done, total, account_ids, whole_instance, started_at]
      properties:
        id: { type: integer, format: int64, description: "The job's id, stable while it runs" }
        kind: { type: string, description: "The job: tinvest.sync, marketdata.backfill_fx, marketdata.backfill_gold, marketdata.backfill_quotes, tinvest.backfill_quotes, corporateaction.materialize_all" }
        stage:
          type: string
          description: "The stage it is in, empty before it says: for tinvest.sync operations (reading the broker's history, one account after another), settlements, journal (reading the rows into entries), write, registry, reconcile; rates, quotes and registry for the others"
        done: { type: integer, description: "How far through the stage; 0 when total is" }
        total: { type: integer, description: "The stage's size; 0 when it cannot be counted" }
        account_ids:
          type: array
          items: { type: string, format: uuid }
          description: "The accounts whose figures are not final until it ends; empty for a task of the whole instance"
        whole_instance: { type: boolean, description: "A job of the whole instance (rates, prices), seen by every space" }
        started_at: { type: string, format: date-time }
    DataSource:
      type: object
      required: [kind, every_seconds, last_success_at, last_failure_at, last_error, stale]
      properties:
        kind: { type: string, description: "The job: marketdata.refresh_quotes, marketdata.backfill_quotes, marketdata.refresh_fx, marketdata.backfill_fx, tinvest.sync, tinvest.refresh_quotes, tinvest.backfill_quotes, tinvest.refresh_dividends, corporateaction.refresh_moex_splits, corporateaction.refresh_foreign_splits, marketdata.refresh_reference_prices, marketdata.refresh_dividend_calendar, marketdata.refresh_crypto_prices, marketdata.refresh_bond_schedules, marketdata.refresh_indexes" }
        every_seconds: { type: integer, description: "How often it runs" }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "The last failure's text, cut to 300 characters; empty when it never failed" }
        stale: { type: boolean }
    PeriodReturn:
      type: object
      required: [currency, from, to, start_minor, end_minor, contributions_minor, profit_minor, annual_rate, complete]
      properties:
        currency: { type: string, description: "The space's base currency" }
        from: { type: string }
        to: { type: string }
        start_minor: { type: integer, format: int64 }
        end_minor: { type: integer, format: int64 }
        contributions_minor: { type: integer, format: int64, description: "Money put in net of money taken out over the period: deposits and arriving shares less withdrawals and departing ones" }
        profit_minor: { type: integer, format: int64, description: "end_minor − start_minor − contributions_minor" }
        annual_rate:
          type: string
          nullable: true
          description: "The money-weighted annual rate as a decimal fraction (0.1234 is 12.34% a year), rounded to four places; null when there is none — nothing put in, or nothing at the end"
        complete: { type: boolean }
    FamilyReturn:
      allOf:
        - $ref: "#/components/schemas/PeriodReturn"
        - type: object
          required: [accounts]
          properties:
            accounts: { type: integer, description: "How many accounts the period is reckoned over" }
    CapitalSeries:
      type: object
      required: [currency, points]
      properties:
        currency: { type: string, description: "The space's base currency" }
        points: { type: array, items: { $ref: "#/components/schemas/CapitalPoint" } }
    CapitalPoint:
      type: object
      required: [day, total_minor, complete, accounts]
      properties:
        day: { type: string, description: "Date YYYY-MM-DD" }
        total_minor: { type: integer, format: int64 }
        complete:
          type: boolean
          description: "False when some account could not be valued whole that day — a paper with no closing price, a currency with no rate — and its unvalued part is left out of total_minor"
        accounts: { type: array, items: { $ref: "#/components/schemas/CapitalAccount" } }
    CapitalAccount:
      type: object
      required: [account_id, amount_minor, counted_by, complete]
      properties:
        account_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        counted_by: { type: string, enum: [journal, balance] }
        complete: { type: boolean }
    Summary:
      type: object
      required: [totals, base_currency, unconverted, journal]
      properties:
        totals:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
          description: "Active accounts per currency. An account counted by its balance (AccountWithBalance.counted_by) adds its latest balance under its own currency, a debt among the liabilities. An account counted by its journal adds what it holds in each currency (holdings at market value plus cash) under that currency — among the assets where the account holds more than nothing in it, among the liabilities where its cash in it is below zero by more than its holdings."
        base_currency: { type: string, description: "ISO-4217, from the space; e.g. RUB" }
        total_in_base_minor:
          type: integer
          format: int64
          nullable: true
          description: "Sum of totals[].net_minor converted using the latest FX rate on or before today; null only if none of the currencies could be converted"
        unconverted:
          type: array
          items: { type: string }
          description: "Currencies from totals that had no fx rate available and were excluded from total_in_base_minor; empty if all converted"
        rates_on:
          type: string
          nullable: true
          description: "Oldest FX rate date used for the conversion; null if nothing was converted"
        journal: { $ref: "#/components/schemas/SummaryJournal" }
    SummaryJournal:
      type: object
      required: [accounts, differing, differing_difference_minor, pinned_to_balance, unpriced_positions, not_traded_positions, full_difference_minor]
      description: "What the total owes to journals rather than balances, so the total can say it."
      properties:
        accounts: { type: integer, description: "Active accounts counted by their journal" }
        differing: { type: integer, description: "Of those, how many disagree with their balance (AccountReconciliation.status `differs`)" }
        differing_difference_minor: { type: integer, format: int64, description: "The sum of difference_minor over those accounts, in the base currency: negative when the total may be short by that much, positive when it may be over" }
        pinned_to_balance: { type: integer, description: "Active brokerage accounts with operations counted by their balance by the family's choice (valued_by_balance)" }
        unpriced_positions: { type: integer, description: "Holdings with no price, counted as nothing, across the accounts counted by their journal" }
        not_traded_positions: { type: integer, description: "Of unpriced_positions, the holdings that do not trade now but have a full valuation (AccountJournal.not_traded_positions summed)" }
        full_difference_minor: { type: integer, format: int64, description: "What the full valuation adds to the total, in the base currency: the sum over the accounts counted by their journal of full_amount_minor − amount_minor. The family's full valuation is total_in_base_minor plus this (decision Р-11)." }
    InstrumentType:
      type: string
      enum: [share, bond, etf, currency, crypto, metal, custom]
    Instrument:
      type: object
      required: [id, type, name, ticker, isin, figi, currency, frozen]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/InstrumentType" }
        name: { type: string }
        ticker: { type: string }
        isin: { type: string }
        figi: { type: string }
        currency: { type: string }
        coingecko_id:
          type: string
          description: "A cryptocurrency's coin at CoinGecko, which prices it daily (decision Р-20): the price job picks the largest coin with the paper's ticker, since tickers are not unique among coins, and a person may correct it. Empty for anything else and until a coin is picked; absent from older answers."
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: "What one bond is worth at redemption, in face_currency's minor units. Null for a bond without a recorded face value and for any other type (rows written before that rule are returned as they stand; PATCH clears them). Always positive and never without face_currency — a CHECK constraint backs both for every stored row. No maximum is stated: the write's cap has no constraint behind it."
        face_currency:
          type: string
          nullable: true
          minLength: 1
          description: "The currency face_value_minor is denominated in, which need not be the instrument's own. Null exactly when face_value_minor is null; never empty (a CHECK constraint). Its ISO-4217 shape is enforced by every writer but not by the database, so no pattern is promised for stored rows."
        frozen: { type: boolean }
    InstrumentsResponse:
      type: object
      required: [instruments, has_more]
      description: "One page of the instrument catalog. It used to be a bare array, and the endpoint took no `offset` at all: past the ceiling the catalog was unreachable by any request that could be made, and a client had no way to tell a whole catalog from a clamped one either (#104). Both halves are gone — `offset` continues the listing, and `has_more` says whether there is anything to continue to."
      properties:
        instruments:
          type: array
          items: { $ref: "#/components/schemas/Instrument" }
          description: "The page itself, ordered by name, at most `limit` long. Shorter than `limit` only at the end of the catalog: an over-large `limit` is refused rather than clamped here, so a short page has one meaning."
        has_more:
          type: boolean
          description: "Whether the catalog holds at least one more instrument beyond this page — i.e. at `offset + len(instruments)` and later. The server's to answer, and fetched rather than inferred: one row beyond the page is asked for and its arrival IS this answer, after which a statement of its own trims that row away so nothing downstream can mistake it for part of the page. A flag rather than a total, for the reason OperationsResponse.has_more gives. False on an empty page, which is the end of the catalog (or past it)."
    InstrumentEventKind:
      type: string
      enum: [split, conversion, spin_off]
      description: >-
        What happened to the paper. `split`: the quantity is rewritten, nothing else — money
        spent and acquisition dates stand. `conversion`: one paper becomes another (a
        receipt into its share, a fund into its successor); basis and dates travel, nothing
        is realized (НК РФ ст. 214.1 п. 13). `spin_off`: the original stands and a second
        paper arrives beside it with `basis_share` of the basis — 0 unless the broker's tax
        records say otherwise. All three are carried into journals.
    InstrumentEventSource:
      type: string
      enum: [moex_iss, yahoo, known, manual]
      description: >-
        Where the fact came from. `moex_iss`: the exchange's own splits table,
        read by a daily job. `yahoo`: a foreign paper's split on its home
        exchange, read daily from Yahoo Finance for the foreign papers the
        journals hold. `known`: from a list this program carries, with the
        primary source in `source_ref` — a receipt the exchange replaced by a
        Russian company's share one for one (decision Р-19), which reaches only
        receipts bought for roubles, the ones Russian depositories held; or a
        fund whose blocked assets its manager moved into a new fund, one unit
        for one, with none of the cost basis. None of the three is a
        person's to remove — the job rewrites it on every run, so a deletion
        would last until the next one.
        `manual`: somebody recorded it, with a link to the evidence in
        `source_ref`.
    InstrumentEvent:
      type: object
      required: [id, kind, isin, effective_on, ratio_from, ratio_to, source, source_ref, note, materialized, created_at]
      description: "One recorded corporate action. Keyed by the ISIN of the paper it happened to rather than by a catalog row: the fact outlives any row, and the exchange job records splits of papers nobody here holds."
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/InstrumentEventKind" }
        isin:
          type: string
          description: "ISIN of the paper this happened to. The catalog's own identity since migration 0020, which is what lets one recorded fact reach every account holding the paper, however each of them came to hold it."
        effective_on:
          type: string
          format: date
          description: >-
            The first day the paper trades in the new quantity where it is held — not the
            record date, the announcement or the registrar's day. The event applies at its
            start: the holding at the previous day's close is restated, and a trade dated
            this day is already in the new quantity.
        ratio_from:
          type: integer
          format: int64
          description: "The `from` half of the ratio: one unit becomes ratio_to/ratio_from units. Whole numbers, the shape the exchange publishes, so that 1:3 is 1 and 3 rather than 0.3333333333. From 1 to 1000000000."
        ratio_to:
          type: integer
          format: int64
          description: "The `to` half. See ratio_from. A SPLIT of 1 to 1 is refused: a split has nothing but its ratio to say, so equal sides multiply every holding by one and would put a row in every holder's journal saying nothing happened. A CONVERSION or a SPIN-OFF of 1 to 1 is accepted, and is the commonest shape of both: a redomiciliation or an ISIN change moves the identity of the paper and leaves the count alone (TCS Group receipts became МКПАО «ТКС Холдинг» shares one for one on 2024-02-27), and a carve-out yields one unit of the new fund per unit of the old while a share of the basis moves across."
        result_isin:
          type: string
          nullable: true
          description: "The paper a conversion or a spin-off produces. Required on those two and refused on a split, which produces no new paper. Never equal to `isin`."
        basis_share:
          type: string
          nullable: true
          description: "Decimal as string: the fraction of the original's cost basis a spin-off moves across. At least 0 and less than 1; 0 — the new paper arrives bought for nothing and the whole basis stays on the original — is how the broker keeps a carve-out and the program's default. Required on a spin-off and refused on the other two, where the whole basis either stays or travels."
        source: { $ref: "#/components/schemas/InstrumentEventSource" }
        source_ref:
          type: string
          description: "Where the fact can be checked: the exchange's own URL for a `moex_iss` row, and for a `manual` one whatever its recorder linked to. Required on a manual event — a ratio nobody can check is a number this program would carry into every holder's journal on one person's word."
        moex_secid:
          type: string
          description: "The exchange's security code the splits job resolved this ISIN from, cached so a later run costs no second lookup. Empty on a hand-recorded event. NEVER an identity: MOEX's `T` is Т-Технологии while this catalog also holds AT&T under `T`, which is why the job resolves through the exchange's own ISIN and not through a ticker."
        note:
          type: string
          description: "Whatever the recorder wanted to say about it. Empty on an exchange row."
        materialized:
          type: boolean
          description: "Whether this program carries this kind into journals — true for all three today; published per row so a future kind can be recorded before it is applied. It says nothing about whether this event produced a row: see `not_counted_reason`."
        not_counted_reason:
          $ref: "#/components/schemas/InstrumentEventNotCountedReason"
          description: "Why this event puts nothing in any journal; omitted — not null — when nothing stands in its way. `result_not_in_catalog`: the paper it produces is not catalogued yet; cataloguing it makes the next run write the pair. An account that held none of the paper on the day gets no rows either way."
        created_at: { type: string, format: date-time }
    InstrumentEventNotCountedReason:
      type: string
      enum: [result_not_in_catalog]
      description: "Why an event of a kind this program applies still puts nothing in a journal. `result_not_in_catalog`: the conversion or spin-off produces a paper the catalog has no row for, and a journal row cannot point at a paper that is not there. Nothing is wrong and nothing was refused — the fact is recorded and waits; adding the paper to the catalog is what completes it. A split can never carry this: it produces no second paper."
    InstrumentEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/InstrumentEvent" }
          description: "The whole registry, newest effective date first. Not paged — see the endpoint."
    CreateInstrumentEventRequest:
      type: object
      required: [kind, isin, effective_on, ratio_from, ratio_to, source_ref]
      description: "A corporate action recorded by hand. Its `source` is always `manual`: the exchange's own rows are written by the job that reads the exchange, and a request claiming to be one would be a row nobody could check and the job would overwrite."
      properties:
        kind: { $ref: "#/components/schemas/InstrumentEventKind" }
        isin: { type: string, description: "ISIN (ISO 6166): two letters, nine letters or digits, one digit, e.g. US0231351067. Trimmed and upper-cased by the server before it is stored, because the catalog and the corporate-actions registry match it as a string; anything else is a 400." }
        effective_on:
          type: string
          format: date
          description: "See InstrumentEvent.effective_on — the first day the paper trades in the new quantity at the venue where it is held, NOT the record date. Refused if later than today or earlier than 1900-01-01, the floor the journal sets for the operations an event becomes."
        ratio_from: { type: integer, format: int64 }
        ratio_to: { type: integer, format: int64 }
        result_isin:
          type: string
          nullable: true
          description: "Required for a conversion and a spin-off, refused on a split. An ISIN, normalized like `isin`. See InstrumentEvent.result_isin."
        basis_share:
          type: string
          nullable: true
          description: "Decimal as string, at least 0 and less than 1. Required for a spin-off, refused on the other two. See InstrumentEvent.basis_share."
        source_ref:
          type: string
          maxLength: 500
          description: "Required: a link to the exchange's or the issuer's own announcement. See InstrumentEvent.source_ref for why this one field is not optional."
        note: { type: string, maxLength: 1000 }
    InstrumentEventWritten:
      type: object
      required: [event, rows_added, rows_removed, accounts_touched, recheck_queued]
      description: >-
        What recording or removing an event did. The event itself, and the
        journals it changed on the way — materialization runs inside the request
        rather than waiting for the daily sweep, so these figures describe a
        state the next screen will already show.
      properties:
        event: { $ref: "#/components/schemas/InstrumentEvent" }
        rows_added:
          type: integer
          description: "Journal rows written. Zero for a kind this program does not carry into journals, and zero for a paper no account held on the day — neither is a failure, and `materialized` on the event tells the first case from the second."
        rows_removed:
          type: integer
          description: "Journal rows taken out. On a delete this is what the removed event had put there; on a create it is normally 0, and non-zero only when the new event changes what an older one asked for."
        accounts_touched:
          type: integer
          description: "How many accounts' journals actually changed — not how many were looked at."
        recheck_queued:
          type: integer
          description: "How many broker connections were asked for a fresh comparison because their accounts changed. Zero when no changed account belongs to a connection, and zero when a check of that connection was already queued and will read the journal as it now stands. Not an error either way: the hourly run reconciles regardless, and this only shortens the window in which a verdict on screen describes a journal that has already moved."
    CreateInstrumentRequest:
      type: object
      required: [type, name, currency]
      properties:
        type: { $ref: "#/components/schemas/InstrumentType" }
        name:
          type: string
          maxLength: 200
          minLength: 1
          description: "What to call the instrument. Refused EMPTY or longer than 200 characters (instrument.MaxNameRunes) and nothing more (internal/instrument/http.go, handleCreate): the server compares against \"\" and does not trim. Same floor and same reasoning as CreateAccountRequest.name — see it."
        ticker: { type: string, maxLength: 32 }
        isin: { type: string, description: "ISIN (ISO 6166): two letters, nine letters or digits, one digit, e.g. US0231351067. Trimmed and upper-cased by the server before it is stored, because the catalog and the corporate-actions registry match it as a string; anything else is a 400. May be omitted or empty: an instrument need not have one." }
        figi: { type: string, maxLength: 32 }
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB: the currency the instrument's own figures are denominated in, which is not necessarily face_currency below. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400. It cannot be changed afterwards — UpdateInstrumentRequest carries no currency."
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 1000000000000000
          description: "A bond's face value in face_currency's minor units; only `type: bond` may carry one (400 otherwise). Positive, at most 10^15, and given together with face_currency — both or neither (400 otherwise). A bond without a face value is accepted but cannot be priced."
        face_currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
          description: "The currency face_value_minor is denominated in: an ISO-4217 code in uppercase, and the pattern is enforced, not merely described. An empty string is refused with 400 like any other non-code — it passes a presence check and a NOT NULL alike while denominating the face value in nothing, which leaves a bond priced as a bare number with no currency beside it. Given together with face_value_minor or not at all, and on `type: bond` alone — see it."
    UpdateInstrumentRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          description: "Same rule as on creation — refused empty or past 200 characters, not trimmed (internal/instrument/http.go, handleUpdate). Omitting the field leaves the name as it stands; see UpdateAccountRequest.name."
        ticker: { type: string, maxLength: 32 }
        isin: { type: string, description: "ISIN (ISO 6166): two letters, nine letters or digits, one digit, e.g. US0231351067. Trimmed and upper-cased by the server before it is stored, because the catalog and the corporate-actions registry match it as a string; anything else is a 400. An empty string clears it." }
        figi: { type: string, maxLength: 32 }
        frozen: { type: boolean }
        coingecko_id: { type: string, maxLength: 100, description: "See Instrument.coingecko_id. Omitted, it stays as it is; only a cryptocurrency takes one." }
        face_value_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 1000000000000000
          description: "Same rules as on creation, judged against the stored instrument's type: setting the pair on a row that is not a bond is a 400; clearing it (two nulls) is allowed on any type. To touch either half, send both — two values or two nulls; one alone is a 400 («face_value_minor and face_currency must be sent together, even to change one»). Omitting both leaves the pair as it was."
        face_currency:
          type: string
          nullable: true
          pattern: "^[A-Z]{3}$"
          description: "The currency face_value_minor is denominated in: an ISO-4217 code in uppercase, enforced as on creation — an empty string comes back 400, not stored. Sent together with face_value_minor or not at all, and set only on an instrument that is stored as a bond — see it."
    OperationType:
      type: string
      description: "What the entry is. `redemption`: a bond reaching maturity (or a fund's units redeemed, decision Р-13) — computed as a sale, named apart. `exchange_out`/`exchange_in`: the two legs of a securities conversion on one account and day (a receipt into its share, a fund reissued): the parcel travels whole with its purchase days, nothing is realized, and amount_minor is the cost basis that moved, not money. `spinoff_out`/`spinoff_in`: a spin-off — the original keeps every unit (so `spinoff_out` has no quantity) and the new paper arrives with the event's `basis_share` of the cost (0 by default) and the original purchase days. The last four are written only by the corporate-actions registry (`source: registry`) and are never created or deleted through this API."
      enum: [buy, sell, redemption, deposit, withdrawal, dividend, coupon, amortization, fee, tax, transfer_in, transfer_out, exchange_out, exchange_in, spinoff_out, spinoff_in, split, interest, conversion]
    Operation:
      type: object
      required: [id, account_id, type, occurred_on, amount_minor, currency, fee_minor, note, source, created_at, has_undated_lots, assembled_from_lots, categorizable, counterparty]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        categorizable: { type: boolean, description: "Whether the row can take a category: a deposit, withdrawal, interest, fee or tax that is not half of a transfer between the family's accounts" }
        category_id: { type: string, format: uuid, nullable: true, description: "The family's category the row is filed under (GET /api/v1/categories); null when none" }
        counterparty: { type: string, description: "Who the money came from or went to, as typed or as the source named them; empty when unknown" }
        member_id: { type: string, format: uuid, nullable: true, description: "Whose the row is when not the account owner's: the member who spent or earned it; null for the owner's, or the family's on a shared account" }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD" }
        settled_on: { type: string, nullable: true, description: "Date YYYY-MM-DD" }
        quantity: { type: string, nullable: true, description: "Decimal as string" }
        price:
          type: string
          nullable: true
          description: "Decimal as string: money per unit in the operation's own `currency`, never converted. An annotation — nothing values a trade from it — so a client names `currency` on it. A hand entry holds `price` × `quantity` to the money cap; an import takes the broker's price as given."
        amount_minor:
          type: integer
          format: int64
          description: "The operation's own amount in `currency`, sign preserved. On a transfer_in/transfer_out it is the cost basis of the units moved, from the earliest-purchases-first queue (SessionInfo.cost_basis_rules says whether that is the country's rule) — or, when the basis was given by hand (TransferRequest.cost_minor), that figure on both legs, which the source account's own queue need not match."
        currency: { type: string }
        fee_minor: { type: integer, format: int64 }
        note: { type: string }
        trading_mode:
          type: string
          nullable: true
          description: >-
            Where the operation happened, as its source reported it: an exchange board code
            ("TQBR", "TQCB") or an off-book code ("FINEX_OTC"). Never translated away;
            `trading_mode_kind` classifies it. Null when nobody reported one: hand entries
            and money movements.
          example: "FINEX_OTC"
        trading_mode_kind:
          $ref: "#/components/schemas/TradingModeKind"
        transfer_group_id: { type: string, format: uuid, nullable: true }
        counterpart_account_id: { type: string, format: uuid, nullable: true, description: "On a journal page: for one half of a move between two of the family's accounts — shares or money — the account the other half is on. Null for everything else, and absent outside the journal." }
        withheld_abroad:
          nullable: true
          description: "On a journal page, on a dividend of a FOREIGN paper (its ISIN is not Russian): the tax its issuer's country withheld before the money arrived (decision Р-14). Null on every other row, and absent outside the journal. Never part of any figure: income stays what arrived."
          allOf:
            - $ref: "#/components/schemas/WithheldAbroad"
        stated_basis_change_minor:
          type: integer
          format: int64
          nullable: true
          description: >-
            On a journal page, for each half of a move between the family's accounts whose
            basis was given by hand: how much the family's basis of those units changed, in
            `currency` — the figure given less what the departing account's queue held for
            them. Positive: it grew. Null otherwise, absent outside the journal.
        split_ratio: { type: string, nullable: true, description: "Decimal as string" }
        face_before_minor: { type: integer, format: int64, nullable: true, description: "On an amortization: the bond's outstanding face value per unit just before the repayment, in minor units of `currency`, when it is known (see CreateOperationRequest.face_before_minor). Null on every other row." }
        source:
          type: string
          enum: [manual, csv, tinvest, registry]
          description: "Who wrote the row: `manual` — a person through this API; `registry` — the corporate-actions registry; otherwise an importer. Only a `manual` row can be deleted (see deleteOperation): the writer of any other would write it back."
        created_at: { type: string, format: date-time }
        has_undated_lots:
          type: boolean
          description: "True when amount_minor is a cost basis whose purchase dates are not all known: a transfer with no per-lot breakdown (a basis given by hand, or one predating breakdowns) or with a dateless piece. The same on both legs; false for every ordinary operation. Permanent, unlike a missing rate; it changes no figure. With assembled_from_lots it says whether amount_minor is a cost basis at all: a full dated breakdown makes that one true, a missing or partial one this one, a dateless piece among dated ones both."
        assembled_from_lots:
          type: boolean
          description: "True when amount_minor is a cost basis assembled from the purchases behind it (a transfer with a stored per-lot breakdown), each on its own day, rather than money that moved on occurred_on. The same on both legs; false for ordinary operations and for a transfer with a hand-typed basis. OperationInBase.rate_on reads it."
        in_base:
          nullable: true
          description: "amount_minor and fee_minor in the space's base currency at the rate of occurred_on — what it cost then, not what it is worth now; each rounded on its own. A transfer's amount is converted piece by piece at each purchase day's rate (assembled_from_lots), and both legs publish the same figure. Null when `currency` is the base currency, when a needed rate is missing, or when a piece of a transfer has no purchase date (`in_base_gap` says which). Only on the journal listing; create and transfer responses omit it."
          allOf:
            - $ref: "#/components/schemas/OperationInBase"
        in_base_gap:
          nullable: true
          description: "Which term stopped `in_base`. Set exactly when `in_base` is null and `currency` differs from the base currency; null when `in_base` is present or there was nothing to convert. Published wherever `in_base` is: on the journal listing only."
          allOf:
            - $ref: "#/components/schemas/OperationInBaseGap"
    StateWithheldRequest:
      type: object
      required: [tax_minor]
      properties:
        tax_minor: { type: integer, format: int64, minimum: 0, maximum: 1000000000000000, description: "The tax withheld abroad, in minor units of the payment's currency; 0 states that nothing was." }
    WithheldAbroad:
      type: object
      required: [state, currency, received_minor, broker_tax]
      description: "The tax withheld abroad from one foreign dividend. A broker reports only what arrived, so the figure is an ESTIMATE from the broker's dividend calendar: the declared dividend per share times the shares the account held when the right was fixed is the gross, and the gross less what arrived is the tax. A reader must show it as an estimate (≈) to be checked against the broker's statement. Where it cannot be estimated honestly, `state` says so and `unknown_reason` why."
      properties:
        state:
          type: string
          enum: [estimated, stated, unknown, reported]
          description: "`estimated`: gross, tax and rate below are the estimate. `stated`: a person stated the tax from the broker's statement (PUT .../withheld-abroad); tax_minor is that figure, gross_minor is what arrived plus it, and per_share and shares are null. `unknown`: no honest estimate, see `unknown_reason`. `reported`: the broker sent the payment whole and the tax as its own row (`broker_tax`), which is the withholding as reported; nothing is estimated."
        unknown_reason:
          type: string
          nullable: true
          enum: [no_calendar, not_in_calendar, another_currency, no_holding, implausible]
          description: "Why there is no estimate: no calendar is stored for the paper; no declared dividend in it matches this payment; the payment arrived in another currency than the dividend was declared in, at a rate nobody reported; the account held no shares when the right was fixed; or the arithmetic gives a tax below zero or above half the gross, which says the inputs do not describe this payment. Null unless `state` is `unknown`."
        currency: { type: string, description: "The payment's currency, which every amount here is in, broker_tax and tax_in_base excepted." }
        received_minor: { type: integer, format: int64, description: "What arrived for this dividend, every row of the journal that pays it summed (a payment may come in parts)." }
        gross_minor: { type: integer, format: int64, nullable: true, description: "The dividend before withholding: ≈ per_share × shares, rounded to a minor unit, when `estimated`; received_minor + tax_minor when `stated`." }
        tax_minor: { type: integer, format: int64, nullable: true, description: "The tax taken, positive: ≈ gross_minor − received_minor when `estimated`; the stated figure when `stated`." }
        rate_percent: { type: string, nullable: true, description: "tax_minor ÷ gross_minor as a percentage with one decimal, e.g. \"10.0\", when `estimated` or `stated`." }
        per_share: { type: string, nullable: true, description: "The declared dividend per share, from the calendar, in `currency`'s major units. Only when `state` is `estimated`." }
        shares: { type: string, nullable: true, description: "The shares the account held at the end of the last day a purchase still carried the right (the record date's eve when the calendar does not say). Only when `state` is `estimated`." }
        record_date: { type: string, nullable: true, description: "Date YYYY-MM-DD: the matched dividend's record date. Set whenever a calendar entry was matched." }
        tax_in_base:
          nullable: true
          description: "tax_minor in the space's base currency at the official rate of the payment's day, as a guide; null without a tax_minor, when the payment is already in the base currency, or when that day has no rate."
          allOf:
            - $ref: "#/components/schemas/CurrencyAmount"
        broker_tax:
          type: array
          description: "Tax the broker reported as its own rows on this paper on the payment's day, per currency, sign preserved (negative). Those rows stay in the journal as they are; this repeats them beside the payment they belong to. Empty when there are none."
          items: { $ref: "#/components/schemas/CurrencyAmount" }
    OperationInBaseGap:
      type: string
      enum: [undated_lot, no_rate_operation_date, no_rate_lot_date]
      description: "Which term stopped Operation.in_base. `undated_lot`: a piece of a transferred parcel has no purchase date — permanent, decided first. `no_rate_operation_date`: no rate for occurred_on or earlier. `no_rate_lot_date`: no rate for a purchase day of a dated breakdown or earlier. The last two cannot both arise: an amount is either money moved on its own day or an assembled basis (assembled_from_lots)."
    OperationInBase:
      type: object
      required: [amount_minor, fee_minor, currency, rate_on, dated_on]
      properties:
        amount_minor: { type: integer, format: int64, description: "Operation.amount_minor converted into currency. The sign is preserved — a buy stays negative — and rounding is half-away-from-zero, so converting never shrinks the magnitude of an outflow" }
        fee_minor: { type: integer, format: int64, description: "Operation.fee_minor converted into currency, rounded independently of amount_minor: the two are separate figures, not terms of one total" }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on: { type: string, description: "Date YYYY-MM-DD of the rate actually used: `dated_on` or the nearest earlier date with a rate (weekends, holidays, gaps) — never today. On a transfer converted piece by piece, the newest of its rates. Not a date anything happened on: see `dated_on`." }
        dated_on: { type: string, description: "Date YYYY-MM-DD the headline rate was asked for: occurred_on, or on a transfer converted piece by piece the newest purchase date. `rate_on` equal to it means that day's rate; earlier means an earlier day's (a weekend purchase is converted at Friday's). Speaks for the headline rate only, the one fee_minor is struck at." }
    CreateOperationRequest:
      type: object
      required: [account_id, type, occurred_on, currency]
      properties:
        account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid, nullable: true }
        type: { $ref: "#/components/schemas/OperationType" }
        occurred_on: { type: string, description: "Date YYYY-MM-DD, from 1900-01-01 (a typo guard, not a valuation limit) to today with one day of slack past the UTC boundary for zones east of it; outside the range, 400." }
        settled_on: { type: string, nullable: true, description: "Date YYYY-MM-DD. Not earlier than occurred_on and not more than a year after it; anything else is a 400." }
        quantity: { type: string, nullable: true, description: "Decimal as string, positive where the type takes one. |quantity| at most 10^13, and with a price |price × quantity| at most 10^15 minor units — the cap amount_minor carries; past either, 400. Rows written before the bound are returned as they stand." }
        price: { type: string, nullable: true, description: "Decimal as string: money per unit, in MAJOR currency units. |price| must not exceed 10^13 (10000000000000) — one unit may not cost more than a whole operation is allowed to be for — and see quantity for the bound on the two multiplied together. Past either, 400." }
        amount_minor:
          type: integer
          format: int64
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: "The operation's amount in `currency`, sign preserved. May be omitted on a buy or a sell that gives both quantity and price: the server then records quantity × price rounded half away from zero, negative for a buy. Given, it is taken as is (a total with accrued interest stays). The sign the type requires — negative for a buy and a withdrawal, positive for a deposit and a dividend, 0 for a split, either way for a conversion — and |amount| at most 10^15 are enforced with a 400."
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: "ISO-4217 uppercase, e.g. RUB. Three uppercase letters is the SHAPE of a code and it is the whole of what the server checks: it holds no register, so a well-formed code it has never met is accepted, and a lowercase spelling or a currency's name is a 400."
        fee_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: "What this operation cost to make, in `currency`, as a POSITIVE figure whichever way `amount_minor` went — it is money charged, never money returned. That is why the floor here is 0 rather than the -10^15 the amount gets: a negative fee is refused by a rule of its own. Omitted or 0 means no fee. The ceiling is the same 10^15 minor units the amount stops at, for the same reason — it is money in the same currency on the same row. Past either end, 400."
        note: { type: string, maxLength: 1000 }
        category_id: { type: string, format: uuid, nullable: true, description: "A category of the family's, on a row that can take one (Operation.categorizable): an income category on a deposit or interest, an expense one on a withdrawal, fee or tax; not an archived one unless the row already has it. On an update, omitting it takes the row out of its category." }
        counterparty: { type: string, maxLength: 200, description: "Who the money came from or went to. On an update, omitting it clears it." }
        member_id: { type: string, format: uuid, nullable: true, description: "Whose the row is (Operation.member_id): a member of the family, on a row that can take a category. On an update, omitting it clears it." }
        split_ratio: { type: string, nullable: true, description: "Decimal as string: how many units one unit becomes. Must be positive and strictly less than 10^10 (10000000000) — the first value the column cannot hold — or 400. A split multiplies the whole position's quantity, so a ratio that is a mis-scaled field rather than a corporate action carries an ordinary holding past what any screen can value; the bound refuses it by name instead of letting the database answer with an overflow." }
        face_before_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 1000000000000000
          description: "On an amortization only: the bond's outstanding face value per unit just before this repayment, in minor units of `currency`. With it the repayment retires the cost basis in the share of principal it returns — amount ÷ (face before × units held), at most all of it — as НК РФ ст. 214.1 п. 13 has it (decision Р-4), and only the excess over that share is a result; without it the repayment retires basis equal to its own amount. Refused on any other type. On an update it replaces the stored value, and omitting it clears it."
    FileByRulesRequest:
      type: object
      properties:
        account_id: { type: string, format: uuid, nullable: true, description: "Only this account's rows; absent or null, the whole family's" }
    FileByRulesResponse:
      type: object
      required: [filed]
      properties:
        filed: { type: integer, description: "Rows filed" }
    CategoryRuleField:
      type: string
      enum: [counterparty, note, any]
      description: "Where the rule looks: the counterparty, the note, or either"
    CategoryRule:
      type: object
      required: [id, category_id, field, pattern, position]
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        field: { $ref: "#/components/schemas/CategoryRuleField" }
        pattern: { type: string, description: "The text looked for" }
        position: { type: integer, description: "Its place in the order rules are tried, smallest first" }
    CreateCategoryRuleRequest:
      type: object
      required: [category_id, field, pattern]
      properties:
        category_id: { type: string, format: uuid }
        field: { $ref: "#/components/schemas/CategoryRuleField" }
        pattern: { type: string, minLength: 1, maxLength: 200 }
    UpdateCategoryRuleRequest:
      type: object
      properties:
        category_id: { type: string, format: uuid }
        field: { $ref: "#/components/schemas/CategoryRuleField" }
        pattern: { type: string, minLength: 1, maxLength: 200 }
    ReorderCategoryRulesRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    SetMemberRequest:
      type: object
      required: [member_id]
      properties:
        member_id: { type: string, format: uuid, nullable: true, description: "The member whose the row is; null gives it back to the account's owner" }
    SetCategoryRequest:
      type: object
      required: [category_id]
      properties:
        category_id: { type: string, format: uuid, nullable: true, description: "The category to file the row under; null takes it out of its category" }
    TransferRequest:
      type: object
      required: [from_account_id, to_account_id, instrument_id, quantity, occurred_on]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        instrument_id: { type: string, format: uuid }
        quantity: { type: string, description: "Decimal as string. |quantity| must not exceed 10^13 (10000000000000), as on an operation — this writes the same column, on two rows. A position CAN hold more than that, having grown one accepted operation at a time; such a holding has to be moved in several transfers." }
        occurred_on: { type: string, description: "Date YYYY-MM-DD, from 1900-01-01 (a typo guard, not a valuation limit) to today with one day of slack past the UTC boundary for zones east of it; outside the range, 400." }
        cost_minor:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          maximum: 1000000000000000
          description: "Cost basis given by hand instead of the FIFO carryover from the source account: from 0 to 10^15 minor units, 400 outside. The units then arrive with no acquisition dates (Operation.has_undated_lots), and the figure is what they arrive with: the source still releases its own earliest purchases, both legs carry this number, and the family's total basis moves by the difference. Leave it unset when the source's history is the truth."
        note: { type: string, maxLength: 1000 }
    OperationsResponse:
      type: object
      required: [operations, has_more]
      description: "One page of an account's journal, with whether more follows."
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
          description: "The page itself, newest first, at most `limit` long. Shorter than `limit` only at the end of the journal: an over-large `limit` is refused rather than clamped (#118), so a short page has one meaning — which it did not have when this field was written."
        has_more:
          type: boolean
          description: "Whether the journal holds at least one more entry beyond this page (at `offset + len(operations)`): the server fetches one row past the page to know. False on an empty page."
    MoneyTransferRequest:
      type: object
      required: [from_account_id, to_account_id, occurred_on, amount_minor, currency]
      properties:
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        occurred_on: { type: string, description: "Date YYYY-MM-DD; the same bounds as an operation's." }
        amount_minor: { type: integer, format: int64, minimum: 1, description: "What left, in minor units of `currency`: positive, at most 10^15." }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        received_minor: { type: integer, format: int64, minimum: 1, nullable: true, description: "What arrived, when it differs — sent together with received_currency or not at all." }
        received_currency: { type: string, pattern: "^[A-Z]{3}$", nullable: true }
        note: { type: string, maxLength: 1000 }
    TransferResponse:
      type: object
      required: [out, in]
      properties:
        out: { $ref: "#/components/schemas/Operation" }
        in: { $ref: "#/components/schemas/Operation" }
    PositionCurrencyIncome:
      type: object
      required: [currency, income_minor]
      description: "One currency's worth of a position's income (see Position.income_by_currency, which is the list of these)."
      properties:
        currency: { type: string, description: "ISO-4217 of the currency these payments ARRIVED in. Not necessarily the position's own `currency`, which is what its cost and quantity are denominated in — a paper bought for yuan may be paid in rubles." }
        income_minor: { type: integer, format: int64, description: "Income in `currency`'s minor units: dividends and coupons paid in it, less the taxes and the commissions charged on the paper in it outside a trade. May be 0, or negative (a tax with no payment in this currency)." }
    Position:
      type: object
      required: [instrument, quantity, cost_minor, realized_pnl_minor, settled_minor, total_minor, income_minor, income_by_currency, fees_minor, currency, has_undated_lots, has_undated_realizations, has_unknown_cost, cost_at_sale_rate, in_base_gap, market_value_gap]
      properties:
        instrument: { $ref: "#/components/schemas/Instrument" }
        cost_at_sale_rate:
          type: boolean
          description: "True when this is a bond of Russia's external loans in a foreign currency held by a Russian tax resident, and its rouble figures count each parcel's cost in the face currency at the rate of the day of the sale or repayment — today's for what is still held — as НК РФ ст. 214.1 п. 13 has it (decision Р-21). A position held in roubles then shows that restated cost in `cost_minor` and the results built on it; one held in the face currency keeps its own figures and restates `in_base`. False when the rule does not apply or a rate it needs is missing (the ordinary figures are shown, never a mix)."
        quantity: { type: string, description: "Decimal as string" }
        cost_minor: { type: integer, format: int64 }
        realized_pnl_minor:
          type: integer
          format: int64
          nullable: true
          description: "Realized profit or loss in the position's `currency`. Null when a disposal settled in another currency than the basis it retired (a yuan bond redeemed for rubles): no single-currency figure exists then, and `in_base.realized_pnl_minor` states it in the base currency."
        settled_minor:
          type: integer
          format: int64
          nullable: true
          description: "`realized_pnl_minor` plus `income_minor`: what the position has locked in, unmoved by quotes. No tax is subtracted (see AccountPositions.tax_withheld_minor). Null when either term is missing or when income arrived in another currency than `currency`; `in_base.settled_minor` still states it then."
        total_minor:
          type: integer
          format: int64
          nullable: true
          description: "`settled_minor` plus `unrealized_pnl_minor`. Null when either is."
        income_minor:
          type: integer
          format: int64
          description: "The entry of `income_by_currency` for the position's own `currency`, 0 when there is none: dividends and coupons in it, less the taxes and the commissions charged on the paper outside a trade. Not the whole income when payments arrived in other currencies; `in_base.income_minor` converts them all."
        income_by_currency:
          type: array
          items: { $ref: "#/components/schemas/PositionCurrencyIncome" }
          description: "The position's income per currency it arrived in, ordered by currency code; nothing is converted and no two entries are added. Empty exactly when the position has received no income at all."
        fees_minor: { type: integer, format: int64, description: "Every commission charged on this position in its own `currency`: a purchase's (also in the lot's cost), a sale's (also off its realized result) and one charged outside a trade (also off `income_minor`) — a tally to read, never a term to subtract again. Commissions in another currency are not published." }
        currency: { type: string }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Market value in `market_value_currency`: the position's `currency` when the valuation was converted or needed no conversion, so it compares with cost_minor. A bond is valued in its face currency and converted at today's rate; without a rate the raw figure is published. Null when there is no valuation; `market_value_gap` says why." }
        market_value_currency: { type: string, nullable: true, description: "Currency of market_value_minor. Equal to `currency` (the position's own currency) whenever a conversion happened; otherwise the raw valuation currency (the quote's currency for share/etf, the instrument's face_currency for bond). Null exactly when market_value_minor is null." }
        market_value_source_currency: { type: string, nullable: true, description: "Set only when market_value_minor was converted from a different currency (see market_value_minor): the original, unconverted valuation currency (e.g. a bond's face_currency). Null when no conversion happened, including when one was needed but no fx rate was available." }
        market_value_source_minor: { type: integer, format: int64, nullable: true, description: "Set only when market_value_minor was converted from another currency: the unconverted valuation, in market_value_source_currency. It is also what in_base.market_value_minor is struck from. Null otherwise." }
        price: { type: string, nullable: true, description: "Decimal as string: the price the valuation used. For a share or a fund, money per unit in the quote's currency (`market_value_source_currency` when set, else `market_value_currency`). For a bond, a percentage of the face value (\"95.20\" is 95.20 %), not money." }
        price_money_minor: { type: integer, format: int64, nullable: true, description: "A bond only: one unit's price in money — face value × price/100, the face the exchange states for the valuation day or else instrument.face_value_minor — in that face's currency, rounded once. Accrued interest is not in it (see accrued_interest_minor). Null for other types and when there is no valuation." }
        accrued_interest_minor: { type: integer, format: int64, nullable: true, description: "A bond only: the coupon interest accrued on one unit, as the exchange states it for the valuation day, in the currency of price_money_minor; market_value_minor includes it. Null for other types, and when the exchange stated none in the face's currency within ten days." }
        price_source:
          nullable: true
          description: "Where `price` comes from (decision Р-11): `market` — an exchange's or a broker's quote; `manual` — stated by a person; `nav` — a fund's net asset value per unit; `foreign` — a share's close on its home exchange. The space's full_valuation decides which is taken first. Null exactly when `price` is."
          allOf:
            - $ref: "#/components/schemas/PriceSource"
        liquid_value_minor: { type: integer, format: int64, nullable: true, description: "What the holding can be sold for now (decision Р-11), in the position's `currency`: valued at its latest market price — a price stated by hand is not one — if it is no older than a month. Null when the paper does not trade (see last_traded_on), has no market price, or there is no valuation or rate." }
        liquid_value_in_base_minor: { type: integer, format: int64, nullable: true, description: "liquid_value_minor in the space's base currency, struck once from the valuation's own currency at today's rate. Null when liquid_value_minor is, or no rate." }
        last_traded_on: { type: string, nullable: true, description: "Date YYYY-MM-DD of the paper's latest market price, set only when that price is older than a month and the liquid valuation therefore counts the holding as nothing: the paper has not traded since." }
        price_by_hand: { type: boolean, description: "True when the price was stated by a person (POST /api/v1/instruments/{instrumentId}/prices) rather than taken from an exchange or a broker — an over-the-counter or net-asset-value estimate for a paper nobody quotes, say. Absent or false otherwise." }
        price_on: { type: string, nullable: true, description: "Date YYYY-MM-DD the price's source attaches it to, never the day it was fetched. Not a promise that the paper traded that day, nor that it is the latest session." }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor, in the position's `currency`. Null when there is no market_value_minor or it is still in another currency." }
        market_value_gap:
          nullable: true
          description: "Why the market value cell is not the expected figure: no valuation at all (`type_not_priced`, `no_face_value`, `no_quote`), or a valuation that could not be converted into the position's `currency` (`no_rate_valuation_currency`). Null when the valuation exists in the position's currency. A null here does not mean `in_base` has a base-currency value — `in_base_gap` answers that; the two describe different cells and can both be set."
          allOf:
            - $ref: "#/components/schemas/MarketValueGap"
        in_base_gap:
          nullable: true
          description: "Which term stopped `in_base`. Set exactly when `in_base` is null and `currency` differs from the base currency; null when `in_base` is present or there was nothing to convert. It concerns the object: figures inside a present `in_base` can be null on their own (see `market_value_gap`, `has_undated_realizations`)."
          allOf:
            - $ref: "#/components/schemas/InBaseGap"
        has_undated_lots:
          type: boolean
          description: "True when a lot still held has no acquisition date (a transfer whose per-lot breakdown was never recorded) — a permanent condition, unlike a missing rate. It changes no figure in the position's `currency` and can stop `in_base` (`in_base_gap: undated_lot`). A lot with neither date nor price counts as bought for nothing and is reported by has_unknown_cost instead."
        has_undated_realizations:
          type: boolean
          description: "True when a disposal already made retired basis with no acquisition date: it explains a null `in_base.realized_pnl_minor` that will not resolve, unlike a missing rate (has_undated_lots speaks only of lots still held). A parcel sold with neither date nor price counts as bought for nothing and is reported by has_unknown_cost instead."
        has_unknown_cost:
          type: boolean
          description: "True when some of this paper, held or sold, arrived with no purchase price (typically from another broker). Such basis counts as bought for nothing, as the broker counts it, so the profit shown is higher than the truth by what was really paid."
        in_base:
          nullable: true
          description: "The position's figures in the space's base currency, each at the rate that answers its own question: cost — each lot at the rate of its purchase's settlement day (else the purchase day); income — each payment at its day's rate; realized — each disposal's proceeds and fee at its day's rate and each retired parcel at its purchase's; market value — today's rate, out of the currency the valuation is denominated in. Base-currency profit therefore includes the currency's own move. Null when `currency` is the base currency, or when a term the object needs cannot be valued (`in_base_gap` names it). fees_minor is not carried."
          allOf:
            - $ref: "#/components/schemas/PositionInBase"
    PositionInBase:
      type: object
      required: [cost_minor, income_minor, settled_minor, total_minor, currency, rate_on]
      properties:
        settled_minor:
          type: integer
          format: int64
          nullable: true
          description: "`realized_pnl_minor` plus `income_minor`, each term converted at its own date and out of its own currency; it exists where Position.settled_minor cannot. Null exactly when `realized_pnl_minor` is."
        total_minor:
          type: integer
          format: int64
          nullable: true
          description: "`settled_minor` plus `unrealized_pnl_minor`. Null when either is."
        cost_minor: { type: integer, format: int64, description: "Remaining cost basis: each lot still held converted at the rate of its own acquisition (settlement) day, summed and rounded once — not Position.cost_minor at today's rate." }
        market_value_minor: { type: integer, format: int64, nullable: true, description: "Market value at today's rate, converted once out of the currency the valuation is denominated in (Position.market_value_source_* when set) — so not Position.market_value_minor times any published rate. Null when Position.market_value_minor is null, or when the valuation could not reach the position's currency (`market_value_gap: no_rate_valuation_currency`)." }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "market_value_minor minus cost_minor. It includes the currency's move, so it can differ in sign from Position.unrealized_pnl_minor. Null exactly when market_value_minor is." }
        income_minor: { type: integer, format: int64, description: "Every income operation of the position — dividend, coupon, tax, commission charged outside a trade — at its own day's rate and out of the currency it arrived in, summed and rounded once: the whole of Position.income_by_currency as one figure." }
        realized_pnl_minor: { type: integer, format: int64, nullable: true, description: "Realized profit or loss in the base currency: each disposal's proceeds and fee at the rate of its settlement day (else its own day), each retired parcel at the rate of its purchase's settlement day (else the purchase day) — НК РФ ст. 210 п. 5 — summed and rounded once. It includes the currency's move, so it can differ in sign from Position.realized_pnl_minor. An amortization is a disposal; a transfer between the family's own accounts is not. Null when a rate is missing or a retired parcel has no acquisition date (Position.has_undated_realizations tells which); nothing else is nulled with it." }
        currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency" }
        rate_on:
          type: string
          nullable: true
          description: "Date YYYY-MM-DD of today's rate applied to market_value_minor — the valuation currency against the base one — or of the nearest earlier rate held. It dates no other figure. Null when there is no market_value_minor, or when the valuation is already in the base currency and no rate was applied."
    InBaseGap:
      type: string
      enum: [undated_lot, no_rate_lot_date, no_rate_income_date, no_rate_today]
      description: "Which term stopped Position.in_base; the terms are checked in this order and the first failure is published. `undated_lot`: a lot still held has no acquisition date — permanent. `no_rate_lot_date`: no rate for a lot's date or earlier. `no_rate_income_date`: the same for an income payment's date. `no_rate_today`: no rate today or earlier for the currency the valuation is denominated in, asked only when there is a valuation. The `no_rate_*` gaps close by themselves once the rates are loaded."
    MarketValueGap:
      type: string
      enum: [type_not_priced, no_face_value, no_quote, no_rate_valuation_currency]
      description: "Why a row's market value is not the expected figure (Position.market_value_gap); one value, decided in this order. No valuation at all: `type_not_priced` — the type has no valuation model (only share, etf, bond and crypto are priced; a quote changes nothing); `no_face_value` — a bond with no face value; `no_quote` — a priced type with a complete catalog row and no price stored yet, the only one a quote closes. A valuation that could not travel: `no_rate_valuation_currency` — no rate to convert it into the position's `currency`; the raw figure is published."
    RealizedGap:
      type: string
      enum: [no_rate]
      description: "Why an account's base-currency total could not be struck. `no_rate`: a rate the sum needs is not loaded yet; the figure appears once it is. A parcel with no purchase date does not withhold the total: such positions are left out and counted in `undated_positions`."
    RealizedCurrencyTotal:
      type: object
      required: [currency, realized_pnl_minor]
      properties:
        currency: { type: string, description: "ISO-4217 of the positions this figure adds up — their own currency, not the base one" }
        realized_pnl_minor: { type: integer, format: int64, nullable: true, description: "Sum of Position.realized_pnl_minor over the positions in `currency`, exact. Null when any of them has no such figure (one sold into another currency); `in_base` is unaffected." }
    CurrencyAmount:
      type: object
      required: [currency, amount_minor]
      description: "One amount in one currency. Used where a figure cannot be added across currencies and is published per currency instead."
      properties:
        currency: { type: string, description: "ISO-4217" }
        amount_minor: { type: integer, format: int64, description: "Minor units, sign preserved" }
    RealizedTotal:
      type: object
      required: [by_currency, base_currency, in_base, in_base_gap, undated_positions, unknown_cost_positions, tax_withheld_by_currency]
      description: "What an account's closed deals have locked in, summed over its positions on the server, per position currency and in the base currency."
      properties:
        tax_withheld_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyAmount" }
          description: "Tax the broker took from the account rather than from a payment, per currency, negative. A tax charged on a paper is already in its position's income; this one (in Russia, withheld on a withdrawal against the year's base) belongs to no position and is not split among them. Empty when there is none; not converted."
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/RealizedCurrencyTotal" }
          description: "One entry per currency the account's positions are denominated in, ordered by currency code, each one an exact sum within that currency. Amounts in different currencies are never added together: a single integer made of dollars and euros is denominated in nothing. Never has a gap — Position.realized_pnl_minor is published unconditionally, since an unrecorded purchase date costs no money and no shares — so a reader in this mode always has a complete answer. Empty exactly when the account has no positions at all, which is also how a client tells 'nothing to say here' apart from a genuine zero."
        base_currency: { type: string, description: "The space's base currency (ISO-4217), same as Summary.base_currency: the currency of in_base, carried here so a client formatting the total need not go back to the session for it" }
        in_base:
          type: integer
          format: int64
          nullable: true
          description: "The same result in the base currency: the sum of the positions' figures — Position.in_base.realized_pnl_minor for positions in another currency, their own realized_pnl_minor for those in the base one — each already rounded per position, so the total agrees with the rows. Null when a rate the sum needs has not arrived (`in_base_gap: no_rate`). A position whose disposal released a parcel with no purchase day is left out and counted in `undated_positions`; a position whose `in_base` is absent for other reasons still contributes its realized result."
        in_base_gap:
          nullable: true
          description: "Why `in_base` is null, or null when there is a figure."
          allOf:
            - $ref: "#/components/schemas/RealizedGap"
        undated_positions:
          type: integer
          description: "How many positions were left out of `in_base` because a disposal released a parcel that HAS a cost but no purchase date — typically a transfer whose total basis was typed in by hand without dates. That cost cannot be converted at the rate of an unknown day, and never will be, so the position is left out rather than taking the whole figure down. A parcel with neither a date nor a cost is not counted here: it was sold as bought for nothing, needs no date, and is counted by unknown_cost_positions. The per-currency entries include every position in full. 0 when nothing was left out."
        unknown_cost_positions:
          type: integer
          description: "How many positions sold shares that arrived with no purchase price and are counted as bought for nothing (Position.has_unknown_cost): the whole of what they sold for is in this result as profit, in every currency, so it is HIGHER than the truth by whatever was really paid for them. 0 when every sale knew its cost."
    CashPosition:
      type: object
      required: [currency, amount_minor, overdrawn_since, in_base]
      description: "THE MONEY THE ACCOUNT HOLDS IN ONE CURRENCY, published as a holding rather than as a balance — because that is what it is. Yuan sitting on a Russian broker's account was bought at some rate and is worth another today, and the difference is real money made or lost. It is NOT the balance mark the reconciliation stores (Account.balance): that is one figure the broker named on one day, in rubles alone; this is computed from the journal, in every currency the account has touched."
      properties:
        currency: { type: string, description: "ISO-4217 code of the money this row is" }
        amount_minor:
          type: integer
          format: int64
          description: "The balance in minor units of `currency`: every cash effect the journal records, added up — amount less commission on each entry, which is the same formula the reconciliation compares against the broker. CAN BE NEGATIVE, and is published so rather than clamped: an account whose journal is missing an operation genuinely shows money spent that never arrived (the owner's own yuan, spent on bonds while some of the purchases behind it are trades the broker will not explain), and a floor at nought would hide exactly the discrepancy a reader needs."
        overdrawn_since:
          type: string
          format: date
          nullable: true
          description: "On a NEGATIVE balance only: the first day the journal took this money below zero, by the operations' own dates. An account whose journal starts after money was already there is short from that day on, and it is the date an opening balance goes on (decision Р-2, variant Б): one deposit of what the account holds now less `amount_minor`, recorded as an ordinary journal row. Null when the balance is zero or positive, even if it was negative once."
        in_base:
          $ref: "#/components/schemas/CashInBase"
    CashInBase:
      type: object
      required: [currency, value_minor, cost_minor, unrealized_pnl_minor, realized_pnl_minor, gap]
      description: "The same money in the space's base currency, which is the only form in which it has a profit at all: in its OWN currency a thousand yuan cost a thousand yuan and always will. Null figures with a named `gap` when a rate was missing — never a partial answer."
      properties:
        currency: { type: string, description: "The base currency these figures are in, carried here so a client need not go back to the session for it" }
        value_minor: { type: integer, format: int64, nullable: true, description: "What the balance is worth TODAY, at today's rate. Null when there is no rate for today, which `gap` then names." }
        cost_minor: { type: integer, format: int64, nullable: true, description: "What this money was worth when it ARRIVED: each parcel still held, struck at the rate of the day it came, and summed. The parcels are consumed oldest-first, so what remains is the newest money — the same queue every other holding here uses. Null when any parcel's day has no rate. On a NEGATIVE balance this is 0: nothing is held, so nothing was paid for it." }
        unrealized_pnl_minor: { type: integer, format: int64, nullable: true, description: "value_minor less cost_minor — the currency's own move while this money sat on the account. Null when either half is, AND null on a NEGATIVE balance whatever the rates: nothing is held there, so cost_minor is 0 and this subtraction would come to the whole of the debt wearing the name of a profit. What such a balance is worth is still published above (money owed in dollars is worth something in rubles), and what the money that HAS left earned is still in realized_pnl_minor; what does not exist is a gain on money the account does not have." }
        realized_pnl_minor: { type: integer, format: int64, nullable: true, description: "What the currency already earned or cost: for every departure of this money, its proceeds at the rate of the day it left less what its parcels were worth on the days they arrived (settlement days when known). Unmoved by today's rate. Money spent that was never seen arriving counts nothing here and shows as a negative balance. Null when a rate is missing (`gap` names it)." }
        gap:
          nullable: true
          description: "Which rate was missing, or null when the figures are struck. `no_rate_today` stops the valuation; `no_rate_lot_date` stops the cost and therefore the unrealized profit; `no_rate_disposal_date` stops the realized result alone, whose days are its own. `negative_balance` is not a missing rate at all: the account owes this money rather than holding it, so there is no basis to measure a gain against and none is published — the balance and what already left are still there."
          allOf:
            - $ref: "#/components/schemas/CashGap"
    CashGap:
      type: string
      enum: [no_rate_today, no_rate_lot_date, no_rate_disposal_date, negative_balance]
    AccountCurrencyTotal:
      type: object
      required: [currency, amount_minor]
      properties:
        currency: { type: string }
        amount_minor:
          type: integer
          format: int64
          nullable: true
          description: "The account's result in this currency, or null when one of its terms has no figure in this currency at all — a position that realized into another currency, or one paid in another, has no own-currency total to add (see Position.total_minor). A bucket short one term is published as null rather than as the sum of the rest: a total quietly missing a term reads as a smaller result, not as a gap, and is indistinguishable from a real figure on screen."
    AccountTotal:
      type: object
      required: [by_currency, base_currency, in_base, in_base_gap, cash_fx_in_base, no_rate_currencies, zero_valued_positions, zero_valued_cost_by_currency, undated_positions, unknown_cost_positions]
      description: "What the account has made, all in: the sum of every position's total (realized, income, unrealized) plus the account's own charges — interest on the cash, and commissions and tax booked on their own and charged to no paper — and, in the base currency only, the currency result on its money in other currencies (cash_fx_in_base). Deposits and withdrawals are not in it. Published per currency and in the base currency."
      properties:
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/AccountCurrencyTotal" }
          description: "One entry per currency the account has a result in, ordered by currency code, each an exact sum within that currency. Amounts in different currencies are never added together: a single integer made of rubles and yuan is denominated in nothing. Empty exactly when the account has no positions and no charges of its own."
        base_currency: { type: string, description: "The space's base currency (ISO-4217), carried here so a client formatting the total need not go back to the session for it" }
        in_base:
          type: integer
          format: int64
          nullable: true
          description: "The same as one figure in the base currency: each position's in_base total (rounded per position, so it agrees with the rows) plus each account charge at its day's rate. Null when a term could not be valued; `in_base_gap` says which kind. A holding with no recorded purchase dates does not stop it: it is left out and counted in `undated_positions`."
        cash_fx_in_base:
          type: integer
          format: int64
          nullable: true
          description: >-
            Of in_base, the part that is the currency result on the account's
            money in currencies other than the base one — what that money is
            worth in the base currency against what it was worth when it
            arrived, for the money still held and the money already spent. A
            revaluation of currency, not the result of a trade and not a tax
            figure; which portions of a currency count as spent first is this
            program's assumption (the earliest to arrive). Null when the account
            holds no money in another currency, or when a rate behind it is
            missing (in_base is null then too).
        in_base_gap:
          nullable: true
          description: "Why `in_base` is null, or null when there is a figure."
          allOf:
            - $ref: "#/components/schemas/RealizedGap"
        no_rate_currencies:
          type: array
          items: { type: string }
          description: "The cash currencies the server could not value, ordered, without repeats — a rate source may not quote a currency at all (the Bank of Russia has none for XAU, the broker's code for gold). Empty when no cash was stopped by a rate."
        zero_valued_positions:
          type: integer
          description: "How many holdings went into this total at nought because nothing prices them (no quote, a bond without a face value, a type with no valuation model — Position.market_value_gap says which). The total is then lower than the truth by what they are worth; their basis is in zero_valued_cost_by_currency. 0 when every holding was priced."
        zero_valued_cost_by_currency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyAmount" }
          description: "What the holdings counted at nought actually cost, per currency. It is how far this total is below a figure that valued them at what was paid for them — each contributes minus its own basis, so counting them at cost instead would move the total up by exactly this. IT IS NOT THE ERROR: how far the total is from the truth depends on what those papers are really worth, and not knowing that is the whole reason they were counted at nought. Empty exactly when zero_valued_positions is 0."
        undated_positions:
          type: integer
          description: "How many holdings were left out of `in_base` because part of their basis HAS a cost but no purchase date — typically a transfer whose total basis was typed in by hand without dates — so it cannot be converted at the rate of an unknown day. Left out rather than valued at a guess, and rather than taking the whole figure down. Basis with neither a date nor a cost is not counted here: it is bought for nothing as far as anyone knows, needs no date, and is counted by unknown_cost_positions. The per-currency buckets include every holding in full. 0 when nothing was left out."
        unknown_cost_positions:
          type: integer
          description: "How many positions carry basis — still held or already sold — that arrived with no purchase price and is counted as bought for nothing, the way a broker counts shares handed to it without their cost (Position.has_unknown_cost). Their whole value counts as profit in this total, in every currency, so the total is HIGHER than the truth by whatever was really paid for them. 0 when every position knows what it cost."
    PositionsResponse:
      type: object
      required: [positions, cash, cost_basis_rules, realized_total, account_total]
      properties:
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        cost_basis_rules:
          description: "Whether the cost basis behind these figures is the one the owner's country requires (see CostBasisRules); the same statement as SessionInfo.cost_basis_rules, carried with the figures it qualifies."
          allOf:
            - $ref: "#/components/schemas/CostBasisRules"
        cash:
          type: array
          items: { $ref: "#/components/schemas/CashPosition" }
          description: "The money the account holds, one entry per currency it has ever touched, ordered by currency code. It sits beside `positions` rather than among them because it is not a security and has no instrument — but it belongs on the same screen and in the same round trip: cash is a holding, and a reader comparing it with the papers beside it is doing the arithmetic this screen is for. A currency whose balance came to nought is still listed: an account that bought dollars and sold them all again HAS held dollars, and saying nothing about them is a different claim from saying the balance is zero."
        account_total:
          description: "What this account has made all in, across the positions above and its own charges beside them. It sits on the response for the same reasons realized_total does: it is an aggregate of exactly these rows, it arrives in the round trip the screen already makes, and the addition happens once on the server so every reader agrees on the answer. Present even for an account with no positions, where by_currency is empty and in_base is a plain zero."
          allOf:
            - $ref: "#/components/schemas/AccountTotal"
        realized_total:
          description: "What this account's closed deals have locked in, across all of the positions above. It sits on the response rather than being computed by the reader from `positions`, and rather than living on its own endpoint: it is an aggregate of exactly these rows, arrives with them in the one round trip the screen already makes, and — like cost_basis_rules — describes the whole list rather than any one row. Present even for an account with no positions, where by_currency is empty and in_base is a plain zero."
          allOf:
            - $ref: "#/components/schemas/RealizedTotal"
    TinvestConnectionStatus:
      type: string
      description: "Where a connection to T-Invest stands. `active`: the token works as far as anyone knows, and the hourly schedule syncs this connection. `token_revoked`: the broker refused the stored token, and only a new one fixes it — THE SERVER'S OWN VERDICT, reached by asking the broker, which is why UpdateTinvestConnectionRequest.status will not accept it. `disabled`: the owner switched the connection off; the mirror of what the broker already said stays exactly as it is, and the scheduler passes it by."
      enum: [active, token_revoked, disabled]
    TinvestSyncTrigger:
      type: string
      description: "What caused a sync run. `initial`: the first import, queued by the request that created the connection. `schedule`: the hourly job. `manual`: the owner asked for one (POST .../sync). `registry`: the corporate-actions registry changed a journal this connection is reconciled against, and asked for a fresh comparison — a verdict is a sentence about the journal at the moment it was struck, and a split materialized after that moment leaves it describing a journal that no longer exists (see migration 0024 for the live case)."
      enum: [schedule, manual, initial, registry]
    TinvestSyncRunStatus:
      type: string
      description: "Where one sync run stands. `running`: it started and has not reported back — a run left in this state for good is a process that died mid-sync, which is visible as such rather than as nothing having happened. `ok`: it finished. `failed`: it stopped on an error, which TinvestSyncRun.error names."
      enum: [running, ok, failed]
    TinvestReconcileStatus:
      type: string
      description: "What the check against the broker said about a run. `not_checked` is NOT `matched`, and the difference is the reason this enum has three values rather than a boolean: a run that was never reconciled — because it failed, or because our own side could not be computed — makes no claim at all, and a screen that could not tell the two apart would draw a tick over a check that never happened. `matched`: every security's quantity and every currency's balance agreed, and the broker named no asset this program cannot hold. `mismatched`: at least one did not, and the mismatch list says which."
      enum: [not_checked, matched, mismatched]
    TinvestReconcileMismatchKind:
      type: string
      description: "What kind of difference the check found. `instrument`: a security's quantity differs, or the journal holds one the broker does not — usually operations that did not become journal entries (see the unparsed list). `currency`: a cash balance differs. `unknown_security`: the broker holds a security no journal entry ever named, labelled with the broker's own naming — usually a corporate action that arrived as no operation. `unsupported`: an asset of a kind this program does not account for (a future, an option)."
      enum: [instrument, currency, unsupported, unknown_security]
    TinvestUnparsedReason:
      type: string
      description: >-
        Why one broker operation did not become journal entries; a code the interface
        translates. `unsupported_type`: an operation type this program does not account for.
        `unrepresentable_amount`: the sum is finer than a minor unit.
        `amount_out_of_bounds`: the sum is beyond what the journal holds.
        `unrepresentable_quantity`: the units are finer than the journal's scale.
        `trade_without_filled_quantity`: a trade that does not say how much of its order was
        executed. `transfer_direction_unknown`: a move between own accounts with no
        direction. `instrument_unresolved`: no catalog row matched the security.
        `engine_refused`: the journal would not take it. `redemption_without_quantity`: a
        bond redemption with no count — no longer produced, kept on older rows.
        `redemption_nothing_held`: a bond redemption where the journal holds none of the
        bond. `currency_trade`: a purchase or sale of currency. `transfer_without_quantity`:
        a transfer with no units anywhere, even in its description.
        `transfer_quantity_contradicted`: the quantity field and the description disagree.
        `fund_payout_units_unknown`: a payout on a fund sent as a bond repayment with no
        units named (unless the withdrawal of those units pairs with it).
        `foreign_currency_no_rate`: an operation in another currency than its position's, on
        a day with no official rate yet; restated once the rate arrives.
        `commission_refund`: a negative commission. `projection_incomplete`: a rule produced
        nothing — a gap in this program. `broker_fee_parent_missing`: a commission naming a
        trade not among the imported ones. `broker_fee_parent_explained`: a commission
        naming a trade the owner accounted for by hand; neither booked nor dropped.
      enum:
        - unsupported_type
        - unrepresentable_amount
        - amount_out_of_bounds
        - unrepresentable_quantity
        - trade_without_filled_quantity
        - transfer_direction_unknown
        - instrument_unresolved
        - engine_refused
        - redemption_without_quantity
        - redemption_nothing_held
        - currency_trade
        - transfer_without_quantity
        - transfer_quantity_contradicted
        - fund_payout_units_unknown
        - foreign_currency_no_rate
        - commission_refund
        - projection_incomplete
        - broker_fee_parent_missing
        - broker_fee_parent_explained
    TinvestTokenCheckRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: "A read-only T-Invest API token. Sent to the broker and dropped; nothing about it is stored by this endpoint. Only its emptiness is checked here — its length, shape and alphabet are the broker's to judge, and this server holds no pattern it could honestly check them against. It appears in this request schema and in the two write requests below, and in NO RESPONSE SCHEMA ANYWHERE — the same way `password` does."
    TinvestBrokerAccount:
      type: object
      required: [broker_account_id, name, type]
      description: "One T-Invest account a token can see, as the broker describes it. Only the kinds this program can import are listed — a regular brokerage account and an ИИС; savings, card and «инвесткопилка» accounts are left out, because nothing here knows how to read them. Accounts are listed WHATEVER their status, closed ones included: a closed account's history is exactly as real as an open one's, and its settled results are the part of it worth importing."
      properties:
        broker_account_id: { type: string, description: "The broker's own id for the account. Sent back in CreateTinvestConnectionRequest to say which accounts to import." }
        name: { type: string, description: "What the broker calls the account. Shown so the owner can tell one of their accounts from another; nothing is looked up by it." }
        type: { type: string, description: "The broker's own account-type word, verbatim (e.g. ACCOUNT_TYPE_TINKOFF, ACCOUNT_TYPE_TINKOFF_IIS). Passed through rather than translated into a vocabulary of ours: it is the broker's classification and this program keeps it as evidence of what was connected." }
        opened_on: { type: string, nullable: true, description: "Date YYYY-MM-DD the broker says the account was opened, or null when it sent none. It is where the first import starts reading history from." }
    TinvestTokenCheckResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TinvestBrokerAccount" }
          description: "The importable accounts, in the order the broker listed them. Empty means the token works and there is nothing to import through it — which is a different answer from a refused token (400) and must not be shown as one."
    TinvestAccountPick:
      type: object
      required: [broker_account_id, account_name]
      properties:
        broker_account_id: { type: string, minLength: 1, description: "One `broker_account_id` from the token check. It must be among the accounts the token can see AND be one of the importable kinds; anything else is a 422 (NOT a 400 — a 400 here means the token itself was refused), so a client cannot connect an account this program cannot read. The two are separate because the account list can change between the token check and this call, and a client that blames the token for that sends its owner to re-issue a working credential." }
        account_name: { type: string, minLength: 1, description: "What to call the NEW babki account this broker account is imported into. A new account every time — never an existing one — so imported history is never mixed into anything hand-entered." }
    CreateTinvestConnectionRequest:
      type: object
      required: [token, accounts]
      properties:
        token:
          type: string
          minLength: 1
          description: "A read-only T-Invest API token. Checked against the broker before anything is written, then stored encrypted; only its last characters are ever published again (TinvestConnection.token_last4)."
        accounts:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TinvestAccountPick" }
          description: "Which broker accounts to import, and what to call each one here. At least one — a connection that imports nothing would sync forever and produce nothing. Naming one broker account twice in one request is a 400."
    UpdateTinvestConnectionRequest:
      type: object
      description: "Partial update of the connection. Both fields are optional and an omitted one is left unchanged, but at least one must be present — an empty body is refused rather than answered with an unchanged connection and a 200 that looks like success. minProperties states that in the schema itself, as UpdateSpaceRequest does."
      minProperties: 1
      properties:
        token:
          type: string
          minLength: 1
          description: "A replacement read-only token, checked against the broker before it is stored. A connection sitting at `token_revoked` returns to `active` when the broker accepts it — unless this request also names a `status`, which wins."
        status:
          description: "Switch the connection on or off. Only `active` and `disabled` are accepted here; `token_revoked` is refused with a 400, because it is a statement about what the broker said and a client saying it would be stating something nobody checked."
          allOf:
            - $ref: "#/components/schemas/TinvestConnectionStatus"
    TinvestLinkedAccount:
      type: object
      required: [link_id, account_id, broker_account_id, broker_account_name, broker_account_type]
      description: "One broker account tied to the one babki account it is imported into."
      properties:
        link_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid, description: "The babki account this import feeds. It outlives the connection: deleting the connection leaves it, and its operations, alone." }
        broker_account_id: { type: string }
        broker_account_name: { type: string, description: "What the broker called the account WHEN THE LINK WAS MADE — a label kept as it was, not re-read on every sync, so it can differ from what the broker calls it today." }
        broker_account_type: { type: string, description: "The broker's own account-type word as it was at that same moment (e.g. ACCOUNT_TYPE_TINKOFF)." }
        opened_on: { type: string, nullable: true, description: "Date YYYY-MM-DD the broker said the account was opened, or null when it sent none — in which case history is read from a fixed floor instead." }
    TinvestReconcileMismatch:
      type: object
      required: [kind, label, broker, journal]
      description: "One thing the broker and this program's journal disagree about, carrying BOTH figures rather than their difference: a reader who sees only the gap cannot tell which side to go and look at."
      properties:
        kind: { $ref: "#/components/schemas/TinvestReconcileMismatchKind" }
        instrument_id: { type: string, format: uuid, nullable: true, description: "The catalog instrument this row is about, or null when there is none to name: a currency row, an asset kind this program does not hold, and a security the broker named that nothing of ours matched. That last null is itself the news." }
        label: { type: string, description: "What a person reads: our instrument's ticker or name when the row is about one of ours, the broker's own naming when it is about a position that is not, and a currency code on a currency row." }
        broker: { type: string, description: "Decimal as string — what the broker says is there. Units of the security, or an amount of the currency." }
        journal: { type: string, description: "Decimal as string — what this program's journal computes for the same thing, in the same units." }
        broker_isin:
          type: string
          nullable: true
          description: "The ISIN the broker's own passport gives an `unknown_security` position, when the check obtained one. Null on other kinds, when the broker would not say (404), past the number of passports one check looks up, or on runs recorded before the field existed. A catalog row with this ISIN is what the check will pair the position with."
        broker_name:
          type: string
          nullable: true
          description: "The name the broker's passport gives that same position — the words the reader will recognize where the label (the broker's ticker) says only «TECH2». Null exactly when the passport was not obtained, or when it named nothing; independent of `broker_isin`, since a passport can carry a name and no ISIN."
        broker_currency:
          type: string
          nullable: true
          description: "The currency the broker's passport says the position is denominated in, ISO-4217 uppercase (the server uppercases the broker's lowercase code) — the shape CreateInstrumentRequest.currency requires. Null exactly when the passport was not obtained, or when it named no currency."
        broker_type:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/InstrumentType"
          description: "The `unknown_security` position's kind, already translated into this catalog's InstrumentType (share, bond, etf) by the importer's table, from the position's own type. Null on other kinds."
        split_hint_factor:
          type: integer
          format: int64
          nullable: true
          description: >-
            Set when the two quantities differ by a whole factor of two or more and the
            registry holds no split that would explain it: that factor, the larger quantity
            over the smaller. A question, not a finding — an unrecorded split and a missing
            purchase look the same; nothing acts on it. Null on other kinds, other
            differences, papers with a known split or no ISIN, older runs, and when the
            registry could not be read.
    TinvestAccountReconcile:
      type: object
      required: [link_id, account_id, broker_account_name, at, status, mismatches, currency_trades_unparsed]
      description: "The latest check against the broker for one linked broker account; each account of a connection has its own."
      properties:
        link_id: { type: string, format: uuid, description: "Which link this verdict belongs to — the same id as the matching TinvestLinkedAccount.link_id, and the same one a run carries." }
        account_id: { type: string, format: uuid, description: "The babki account behind that link, so a reader can be sent to it without joining anything." }
        broker_account_name: { type: string, description: "What the broker called the account WHEN THE LINK WAS MADE, the same frozen label TinvestLinkedAccount carries and read from the same link row in the same query — the two cannot disagree, and a reader of a verdict needs to be told whose it is without looking it up." }
        at:
          type: string
          format: date-time
          nullable: true
          description: "When that check was made. Null exactly when `status` is `not_checked` — both are written by the same statement that closes a run (see Store.FinishRun), so a time without a verdict, or a verdict without a time, cannot arrive."
        status:
          description: "All three values occur here, and `not_checked` is the one this shape exists to keep sayable: it is what an account carries when NO run of it ever reconciled — a fresh link, or one whose every run failed. It is not «сходится» and not «расхождений нет»."
          allOf:
            - $ref: "#/components/schemas/TinvestReconcileStatus"
        mismatches:
          type: array
          items: { $ref: "#/components/schemas/TinvestReconcileMismatch" }
          description: "What differed for THIS account. Empty when `status` is `matched` — the verdict is derived from this list and never kept beside it — and empty again when `status` is `not_checked`, where it means nobody looked. `status` is what tells those two apart."
        currency_trades_unparsed:
          type: integer
          description: "How many of this broker account's currency purchases and sales are not imported (reason `currency_trade`). Each leaves the cash comparison off by its sum, however often the sync runs; it speaks for the money rows only. Present on every verdict; counted from the mirror as it stands."
    TinvestConnection:
      type: object
      required: [id, status, token_last4, accounts, reconciles]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/TinvestConnectionStatus" }
        token_last4: { type: string, description: "The last characters of the stored token — at most four, and fewer only if the token itself is shorter — so the owner can tell one token from another. THE TOKEN ITSELF IS NEVER PUBLISHED, by this field or any other: it appears in request schemas only, the way `password` does." }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TinvestLinkedAccount" }
          description: "The broker accounts this connection imports, in the order they were linked."
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
          description: "When this connection's last successful run STARTED, or null if it never had one. Two things about it are easy to assume the other way round and are not: it is the run's start rather than its finish, so it is not the moment the mirror became current; and it is keyed by the connection while runs are made per account, so for a connection with several broker accounts it means at least one of them synced then, never all of them."
        reconciles:
          type: array
          items: { $ref: "#/components/schemas/TinvestAccountReconcile" }
          description: "The latest check for each of the accounts above, in the same order and never fewer — an account never reconciled says `not_checked`. A later failed run does not erase an earlier verdict. There is no connection-wide verdict: it is `matched` only when every entry is."
    TinvestConnectionsResponse:
      type: object
      required: [connections]
      description: "Every connection of the space, whole. An envelope with no `has_more` and no paging, unlike the run log and the unparsed list beneath it: a space holds a handful of connections and this list is never truncated, so there is no question for a flag to answer. The envelope is kept all the same — it costs one key and leaves somewhere to put a fact about the list itself, which a bare array (the shape the members list still has) has nowhere to carry."
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/TinvestConnection" }
    TinvestSyncAcceptedResponse:
      type: object
      required: [queued]
      properties:
        queued:
          type: boolean
          description: >-
            True when this request put a sync into the queue. FALSE MEANS ONE
            WAS ALREADY THERE — and «there» is wider than «running right now».
            A sync that failed and is waiting out its backoff occupies the same
            slot, and that backoff grows into the hours, so a client that turned
            `false` into «синхронизация уже идёт» would be saying something
            false for as long as the wait lasts. «Уже запланирована» is true in
            both cases, which is the sentence to write.
    TinvestSyncRun:
      type: object
      required: [id, link_id, trigger, status, started_at, read_count, added_count,
                 disappeared_count, unparsed_count, error, reconcile_status, mismatches]
      description: "One attempt to bring ONE broker account up to date. A connection importing two broker accounts produces two runs per sync, one each."
      properties:
        id: { type: string, format: uuid }
        link_id: { type: string, format: uuid, description: "Which of the connection's links this run was for — join it against TinvestConnection.accounts to name the broker account and the babki account behind it. THE LINK RATHER THAN THE ACCOUNT, so that this figure is read off the run's own row and never assembled from a second query whose answer could have moved on between the two." }
        trigger: { $ref: "#/components/schemas/TinvestSyncTrigger" }
        status: { $ref: "#/components/schemas/TinvestSyncRunStatus" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true, description: "Null while the run is `running`, and permanently null for a run whose process died mid-sync." }
        read_count: { type: integer, description: "How many operations the broker returned for this account." }
        added_count: { type: integer, description: "How many of them the mirror had never seen before." }
        disappeared_count: { type: integer, description: "How many mirror rows the broker stopped returning. Not a deletion: the row stays and is marked, because the broker rewriting its own history is a fact worth keeping." }
        unparsed_count: { type: integer, description: "How many of THIS account's mirror rows the projection could not read, counted after this run — the account's own figure, not the connection's." }
        error: { type: string, description: "What went wrong, empty on a run that did not fail. Prose for a person, never something a client branches on." }
        reconcile_status: { $ref: "#/components/schemas/TinvestReconcileStatus" }
        reconciled_at: { type: string, format: date-time, nullable: true, description: "When the check against the broker was made, or null when `reconcile_status` is `not_checked`." }
        mismatches:
          type: array
          items: { $ref: "#/components/schemas/TinvestReconcileMismatch" }
          description: "What that check found. EMPTY IN TWO DIFFERENT SITUATIONS — the check found nothing, and no check was made — and `reconcile_status` is what tells them apart. It is not restated here as a nullable list, because one fact published in two fields is one fact that can eventually disagree with itself."
    TinvestSyncRunsResponse:
      type: object
      required: [runs, has_more]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/TinvestSyncRun" }
          description: "The page itself, newest first, at most `limit` long."
        has_more: { type: boolean, description: "Whether the log holds at least one more run beyond this page. The server's to answer: the page's own length cannot, and here it especially cannot be inferred from a short page, since an over-large `limit` is refused rather than clamped. Fetched — one row beyond the page is asked for and its arrival IS this answer — never derived by comparing lengths afterwards." }
    TinvestUnparsedOperation:
      type: object
      required: [id, link_id, content_key, occurred_at, op_type, class_code, trading_mode_kind, payment, currency, description, reason, detail, raw, disappeared_at]
      description: >-
        One broker operation the projection could not turn into journal entries — or one the
        owner accounted for by hand (`explained_by`, and then no `reason`). Rows the broker
        stopped returning stay listed.
      properties:
        id: { type: string, format: uuid, description: "The mirror row's id — this program's own, not the broker's, whose operation ids are documented to change over time and are an attribute here rather than a key." }
        link_id:
          type: string
          format: uuid
          description: >-
            The linked broker account this row belongs to. One connection may
            feed several of them — the owner's own feeds four — and this list
            covers the whole connection, so a client explaining a row needs to
            know which link's endpoint to send it to, and must not offer to
            explain rows of two different links with one operation: an
            operation belongs to one account.
        content_key:
          type: string
          description: >-
            What this mirror row is identified BY, across syncs: a digest of
            the operation's own content. It is what an explanation names (see
            TinvestExplainRequest), rather than `id` or the broker's operation
            id, because the broker rewrites its history in place — an operation
            may come back with a new id and the same content, and an
            explanation has to survive that. A client that explains rows sends
            these back verbatim; nothing else may be computed from them.
        occurred_at: { type: string, format: date-time, description: "When the broker says the operation happened." }
        op_type: { type: string, description: "The broker's own operation-type word, verbatim (e.g. OPERATION_TYPE_BUY)." }
        class_code:
          type: string
          description: >-
            The broker's own trading-mode code for this operation, verbatim and
            possibly empty — the mirror keeps what the broker said, and it says
            nothing here for an operation that describes no instrument (money
            in and out of the account). `trading_mode_kind` is what this
            program is willing to call it; see Operation.trading_mode, which is
            the same fact carried onto the journal row this row produced.
        trading_mode_kind:
          $ref: "#/components/schemas/TradingModeKind"
        payment: { type: string, description: "Decimal as string — the broker's own amount, exactly as it arrived, unconverted and unrounded. Not minor units: an amount too fine or too large for this program's money is one of the reasons a row lands on this list, and rendering it in minor units would be impossible for exactly those rows." }
        currency: { type: string, description: "ISO-4217, upper case." }
        description: { type: string, description: "The broker's own free-text description of the operation, empty when it sent none." }
        reason: { $ref: "#/components/schemas/TinvestUnparsedReason" }
        detail:
          type: string
          description: >-
            What refused this operation said about this row, in English, for a person and
            not for a parser — `reason` is what a client decides by. May be empty on rows
            refused before details were kept. Never carries a credential.
        raw: { description: "The broker's own JSON element for this operation, as it arrived — every field, including the ones this program does not model. Untyped on purpose: it is evidence for a person asking what the broker actually sent, and nothing here computes from it." }
        disappeared_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the broker stopped returning this operation, or null while it
            still does. Such a row stays on this list (see above), and on an
            explained row it is the one thing the owner has to look at: the
            broker may have sent the same event back in a changed form that
            could not be recognized as this row, and then it is counted again
            beside the manual operation that stands for it (#196).
        explained_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TinvestRowExplanation" }]
          description: >-
            The manual operation the owner entered to account for this row, or
            null for a row nobody has explained. Non-null exactly when this row
            was skipped by the projection on purpose — and such a row's
            `reason` is empty, since "could not be read" is not what is true of
            it.
    TinvestRowExplanation:
      type: object
      required: [id, operation_id, operation_on, operation_type]
      description: >-
        The manual journal operation that stands for a broker row this program
        cannot read as itself — a corporate action, which the broker sends no
        operation type for at all.


        It names the operation rather than restating it: date and type, so a
        reader knows which journal entry to look at, and no amounts, because
        the journal is where those are read and a second copy of them here
        would part company with the first the moment the operation is edited.
      properties:
        id: { type: string, format: uuid, description: "The explanation's own id — what DELETE /api/v1/tinvest/explanations/{explanationId} takes." }
        operation_id: { type: string, format: uuid, description: "The manual journal operation. Deleting it from the journal screen removes this explanation too, and the rows it covered go back to being projected on the next sync." }
        operation_on: { type: string, format: date, description: "The operation's journal date, which need not be either broker row's date: one operation may stand for rows a fortnight apart." }
        operation_type: { $ref: "#/components/schemas/OperationType" }
    TinvestExplainRequest:
      type: object
      required: [content_keys, operation]
      description: >-
        Accounts for one or more of a linked account's broker rows with one hand-written
        journal operation: the broker sends no corporate actions, so an event (a fund's
        partial redemption, a conversion) arrives as whatever rows carried its money. The
        rows stop being projected and are not unparsed; the operation is what the journal
        holds instead. Both happen together or neither does.
      properties:
        content_keys:
          type: array
          minItems: 1
          items: { type: string }
          description: "The `content_key` of each mirror row this operation accounts for, from TinvestUnparsedOperation. A key that is not one of this link's rows is a 404 naming it; a row already explained is a 409."
        operation:
          allOf: [{ $ref: "#/components/schemas/CreateOperationRequest" }]
          description: >-
            The manual operation, in the journal's own create shape and
            validated by the journal's own rules — the engine replays the
            account with it exactly as it would for an operation entered on the
            journal screen, and refuses it in exactly the same cases with
            exactly the same messages.


            `account_id` IS IGNORED AND OVERWRITTEN with the linked account's:
            the explanation is about this link's rows, so its operation belongs
            on this link's account, and letting the field decide would put the
            money on an account the broker never had it on while leaving the
            linked one still missing the event.
    TinvestExplanationResponse:
      type: object
      required: [operation_id, sync_queued]
      properties:
        operation_id: { type: string, format: uuid, description: "The manual operation that was created." }
        sync_queued:
          type: boolean
          description: >-
            Whether a sync was queued to rebuild the journal with this
            explanation applied. FALSE IS NOT A FAILURE and the explanation is
            written either way: a connection that is switched off or waiting
            for a new token cannot sync at all, and the explanation takes
            effect the next time it runs. It is also false when a sync for this
            connection was already queued — that run will apply it.
    TinvestExplanationRemoved:
      type: object
      required: [sync_queued]
      properties:
        sync_queued: { type: boolean, description: "Whether a sync was queued to project the freed rows again. False is not a failure — see TinvestExplanationResponse.sync_queued." }
    TinvestUnparsedResponse:
      type: object
      required: [operations, has_more]
      properties:
        operations:
          type: array
          items: { $ref: "#/components/schemas/TinvestUnparsedOperation" }
          description: "The page itself, newest first, at most `limit` long."
        has_more: { type: boolean, description: "Whether there is at least one more unparsed operation beyond this page. Fetched rather than inferred, for the reason TinvestSyncRunsResponse.has_more gives." }
